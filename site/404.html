<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 · 此地无路 — 修仙模拟器</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#efe7d8;--ink:#2b2620;--ink3:#6f6659;--zhu:#9e2b25;--line:rgba(58,50,38,.2);--on:#fdf6ee;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#14120f;--ink:#ece4d6;--ink3:#9a9282;--zhu:#d9543f;--line:rgba(236,228,214,.16);--on:#1a1512}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:16px;
    padding:28px;text-align:center;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  h1{font-family:var(--serif);font-size:clamp(34px,10vw,64px);letter-spacing:.2em;margin:0;color:var(--zhu)}
  p{margin:0;color:var(--ink3);font-size:15px;max-width:34ch;line-height:1.8}
  a{display:inline-flex;align-items:center;min-height:48px;padding:12px 28px;margin-top:8px;border-radius:4px;
    background:var(--zhu);color:var(--on);text-decoration:none;letter-spacing:.1em;font-size:15px}
  a:hover{opacity:.9}
  a:focus-visible{outline:2px solid var(--zhu);outline-offset:4px}
</style>
</head>
<body>
  <h1>此 地 无 路</h1>
  <p>你走进了一条并不存在的岔路。前方无灵气，回头是岸。</p>
  <a href="./">返 回 山 门</a>
</body>
</html>
