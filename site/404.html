<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 · 此地无路 — 游戏大厅</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#efe7d8;--ink:#2b2620;--ink3:#6f6659;--zhu:#9e2b25;--line:rgba(58,50,38,.2);--on:#fdf6ee;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#101018;--ink:#e9e5dc;--ink3:#948f85;--zhu:#e0654f;--line:rgba(233,229,220,.16);--on:#151119}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:16px;
    padding:28px;text-align:center;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  h1{font-family:var(--serif);font-size:clamp(34px,10vw,64px);letter-spacing:.2em;margin:0;color:var(--zhu)}
  p{margin:0;color:var(--ink3);font-size:15px;max-width:36ch;line-height:1.8}
  nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  a{display:inline-flex;align-items:center;min-height:48px;padding:12px 26px;border-radius:4px;
    border:1px solid var(--line);color:var(--ink3);text-decoration:none;letter-spacing:.08em;font-size:14px}
  a.main{background:var(--zhu);border-color:var(--zhu);color:var(--on)}
  a:hover{border-color:var(--zhu);color:var(--zhu)}
  a.main:hover{color:var(--on);opacity:.9}
  a:focus-visible{outline:2px solid var(--zhu);outline-offset:4px}
</style>
</head>
<body>
  <h1>此 地 无 路</h1>
  <p>你走进了一条并不存在的岔路。前方既无灵气，也无星轨——回头是岸。</p>
  <nav aria-label="可用入口">
    <a class="main" href="./">返 回 游 戏 大 厅</a>
    <a href="xiuxian.html">修仙模拟器</a>
    <a href="rogue/">星际裂隙</a>
  </nav>
</body>
</html>
