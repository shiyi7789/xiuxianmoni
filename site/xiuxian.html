/* ── sys/combat.js ──────────────────────────────────────────────── */

/* =========================================================
   妖兽系统 / 战斗
   ---------------------------------------------------------
   回合模型：玩家的每个动作 = 自己出手一次 + 敌人行动一次（monsterTurn）
   功法主动技（阶段二）叠加在此模型上：
     · 冷却 cd：每个玩家回合开始递减（tickTurn）
     · 增益 buff：shield（减伤 n 回合）/ dodge（完全闪避 n 回合）
     · 减益 debuff：freeze（敌伤减半 n 回合）/ burn（每回合灼烧扣血 n 回合）
   基础「灵力斩」永远可用（不依赖功法），保证没有功法时战斗照旧。
   ========================================================= */
function makeMonster(tier, boss){
  const lv = S.level;
  const base = 1 + tier*0.58;
  const k = 1 + lv*0.30;
  const m = {
    name: pick(MONSTERS[tier]) + (boss ? '（妖王）' : ''),
    tier, boss: !!boss,
    hpMax: Math.round(95 * base * k * (boss?2.8:1)),
    atk:   Math.round(11 * base * k * (boss?1.32:1)),
    def:   Math.round(3.4 * base * k * (boss?1.25:1)),
    crit:  5 + tier*3,
    exp:   Math.floor(expNeed(lv) * (0.45 + tier*0.18) * (boss?3.2:1)),
    stones:Math.round((10 + tier*16) * (1 + lv*0.32) * (boss?4:1))
  };
  m.hp = m.hpMax;
  return m;
}

function startFight(m, ctx){
  S.combat = {
    m, ctx: ctx||{}, turn:1,
    cd: {},                                              /* 技能冷却：key → 剩余回合 */
    buff: { shield:0, shieldDur:0, dodge:0, dodgeDur:0 },
    debuff: { freeze:0, burn:0, burnPct:0 }
  };
  S.fightPillN = 0;
  addSep();
  addLog('【'+m.name+'】出现在你面前——'+TIER_NAME[m.tier]+'，气血 '+num(m.hpMax)+'。','dmg');
  renderAll();
}

function dmgRoll(atk, def, crit, mult){
  let d = Math.max(1, atk*rf(0.86,1.14) - def*0.6);
  const isCrit = chance(crit);
  if(isCrit) d *= 1.85;
  return { d: Math.max(1, Math.round(d*(mult||1))), crit: isCrit };
}

/* 战斗对象的安全读取（老存档/异常态下不炸） */
function combatState(c){
  if(!c) return null;
  if(!c.cd || typeof c.cd !== 'object') c.cd = {};
  if(!c.buff) c.buff = { shield:0, shieldDur:0, dodge:0, dodgeDur:0 };
  if(!c.debuff) c.debuff = { freeze:0, burn:0, burnPct:0 };
  return c;
}

/* 每个玩家回合开始时结算：冷却递减、增益/减益计时、灼烧扣血 */
function tickTurn(){
  const c = combatState(S.combat);
  if(!c) return;
  for(const k in c.cd) if(c.cd[k] > 0) c.cd[k]--;

  if(c.buff.shieldDur > 0){
    c.buff.shieldDur--;
    if(c.buff.shieldDur <= 0){ c.buff.shield = 0; addLog('护体灵光散去。','dim'); }
  }
  if(c.buff.dodgeDur > 0){
    c.buff.dodgeDur--;
    if(c.buff.dodgeDur <= 0) c.buff.dodge = 0;
  }
  if(c.debuff.freeze > 0) c.debuff.freeze--;

  /* 灼烧：按我方攻击力的一定比例，每回合烧敌一次 */
  if(c.debuff.burn > 0 && c.m.hp > 0){
    const st = stats();
    const burn = Math.max(1, Math.round(st.atk * (c.debuff.burnPct || 0.05) * 4));
    c.m.hp -= burn;
    c.debuff.burn--;
    addLog('烈焰灼烧，'+c.m.name+'再受 '+num(burn)+' 点伤害。','dmg');
  }
}

function fightAttack(){ fightAction('atk'); }
function fightSkill(){ fightAction('skill'); }

function fightAction(kind, skIdx){
  const c = combatState(S.combat);
  if(!c) return;
  tickTurn();
  if(c.m.hp <= 0){ winFight(); after(); return; }

  const st = stats();
  const m = c.m;

  if(kind === 'defend'){
    c.defend = true;
    const rec = Math.round(st.mpMax*0.14);
    S.mp = Math.min(st.mpMax, S.mp + rec);
    addLog('你掐诀布下护体灵光，静待其势。（灵力 +'+rec+'）','sys');
    monsterTurn();
    after(); return;
  }

  if(kind === 'flee'){
    if(m.boss){ toast('妖王当前，无从遁走'); return; }
    const fc = Math.min(94, 58 + st.speed*0.8);
    if(chance(fc)){
      addLog('你脚下一错，踏罡步斗，身形暴退数十丈——脱身了。'
        + (st.speed ? '（坐骑遁速 +'+st.speed+'%）' : ''),'sys');
      endFight('flee');
    }else{
      addLog('你转身欲走，却被其拦住去路！','warn');
      monsterTurn();
    }
    after(); return;
  }

  let mult = 1, cost = 0;
  if(kind === 'skill'){
    cost = Math.round(st.mpMax*0.15) + 8;
    if(S.mp < cost){ toast('灵力不足（需 '+cost+'）'); return; }
    S.mp -= cost;
    mult = 2.3;
  }

  const r = dmgRoll(st.atk, m.def, st.crit, mult);
  m.hp -= r.d;
  addLog('你'+(kind==='skill' ? '催动灵力，一道灵光斩落' : '挥动法器直取')+'——'
    + (r.crit?'<b>暴击！</b>':'') + '造成 '+num(r.d)+' 点伤害。', r.crit?'epic':'dmg');

  if(m.hp <= 0){ winFight(); after(); return; }
  monsterTurn();
  after();
}

/* ---------- 功法主动技（阶段二） ---------- */
/* 槽位 0/1 的技能；k 也可直接给功法键（UI 按 key 调用） */
function castSkill(arg){
  const c = combatState(S.combat);
  if(!c) return;
  const sk = typeof arg === 'number' ? gfActiveSkill(arg) : gfSkillByKey(arg);
  if(!sk){ toast('尚未备下此术'); return; }
  tickTurn();
  if(c.m.hp <= 0){ winFight(); after(); return; }

  const st = stats();
  if((c.cd[sk.key] || 0) > 0){ toast('【'+sk.n+'】尚在冷却（'+c.cd[sk.key]+' 回合）'); return; }
  const cost = gfSkillMp(sk, st.mpMax);
  if(S.mp < cost){ toast('灵力不足（需 '+cost+'）'); return; }

  S.mp -= cost;
  c.cd[sk.key] = sk.cd;

  const m = c.m;
  const fx = sk.fx || {};
  const defUse = m.def * (1 - (fx.pierce || 0));
  const critUse = st.crit + (fx.crit || 0);

  let total = 0, anyCrit = false;
  for(let i=0;i<(sk.hits||1);i++){
    const r = dmgRoll(st.atk, defUse, critUse, sk.mult);
    m.hp -= r.d;
    total += r.d;
    if(r.crit) anyCrit = true;
    if(m.hp <= 0) break;
  }

  if(sk.mult > 0){
    addLog('你施展【'+sk.n+'】——' + (anyCrit?'<b>暴击！</b>':'')
      + '造成 '+num(total)+' 点伤害' + ((sk.hits||1) > 1 ? '（'+sk.hits+' 段合计）' : '') + '。',
      anyCrit ? 'epic' : 'dmg');
  }else{
    addLog('你施展【'+sk.n+'】。','act');
  }

  /* 附加效果 */
  if(fx.heal && total > 0){
    const h = Math.round(total * fx.heal);
    S.hp = Math.min(st.hpMax, S.hp + h);
    addLog('所伤之血化作一缕精气回流，气血 +'+num(h)+'。','gain');
  }
  if(fx.shield){
    c.buff.shield = fx.shield;
    c.buff.shieldDur = fx.dur || 1;
    addLog('护体灵光凝如实质，'+Math.round(fx.shield*100)+'% 伤害将被卸去（'+c.buff.shieldDur+' 回合）。','gain');
  }
  if(fx.dodge){
    c.buff.dodge = 1;
    c.buff.dodgeDur = fx.dodge;
    addLog('身形一晃，已遁入虚空——'+fx.dodge+' 回合内敌手难着其身。','gain');
  }
  if(fx.freeze){
    c.debuff.freeze = Math.max(c.debuff.freeze, fx.freeze);
    addLog('寒气入体，'+m.name+'动作一滞（'+fx.freeze+' 回合内伤害减半）。','gain');
  }
  if(fx.burn){
    c.debuff.burn = Math.max(c.debuff.burn, fx.burn);
    c.debuff.burnPct = fx.burnPct || 0.05;
    addLog('烈焰附骨，'+m.name+'陷入灼烧（'+fx.burn+' 回合）。','gain');
  }
  if(fx.mpBack){
    const back = Math.round(st.mpMax * fx.mpBack);
    S.mp = Math.min(st.mpMax, S.mp + back);
    addLog('一息运转，灵力回了 '+back+' 点。','sys');
  }
  if(fx.selfDmgPct){
    const sd = Math.max(1, Math.round(st.hpMax * fx.selfDmgPct));
    S.hp -= sd;
    addLog('因果反噬，你自身承受 '+num(sd)+' 点伤害。','warn');
    if(S.hp <= 0){ loseFight(); after(); return; }
  }

  if(m.hp <= 0){ winFight(); after(); return; }
  monsterTurn();
  after();
}
/* 按功法键施放（未装在槽位上也可调用，用于测试与快捷键） */
function castSkillAt(i){ castSkill(i); }

function monsterTurn(){
  const c = combatState(S.combat);
  if(!c || c.m.hp <= 0) return;
  const st = stats();
  const m = c.m;

  /* 虚空：完全闪避 */
  if(c.buff.dodge > 0){
    addLog('你的身形在虚空与现世之间闪烁，'+m.name+'扑了个空。','gain');
    c.buff.dodgeDur--;
    if(c.buff.dodgeDur <= 0) c.buff.dodge = 0;
    c.turn++;
    return;
  }

  let dmg;
  if(c.defend){
    const raw = dmgRoll(m.atk, st.def, m.crit, 1);
    dmg = Math.max(1, Math.round(raw.d*0.32));
    addLog(m.name+'猛扑而来，被护体灵光卸去大半力道，你仍受 '+num(dmg)+' 点伤害。','sys');
    c.defend = false;
  }else{
    const r = dmgRoll(m.atk, st.def, m.crit, 1);
    dmg = r.d;
    let tail = (r.crit?'（暴击）':'');
    /* 冰封：伤害减半 */
    if(c.debuff.freeze > 0){
      const cut = Math.round(dmg * 0.5);
      dmg -= cut;
      tail += '（寒气封脉，伤害减半）';
    }
    /* 护盾：按比例减伤 */
    if(c.buff.shield > 0){
      const cut = Math.round(dmg * c.buff.shield);
      dmg = Math.max(1, dmg - cut);
      tail += '（护体灵光卸去 '+num(cut)+'）';
    }
    S.hp -= dmg;
    addLog(m.name+(r.crit?'狞笑一声，一击命中要害':'扑上来撕咬')+'——你受 '+num(dmg)+' 点伤害'+tail+'。','dmg');
    if(S.hp <= 0){ loseFight(); return; }
    c.turn++;
    return;
  }

  /* 御守分支也可能被护盾/冰封补足减伤 */
  if(c.debuff.freeze > 0) dmg = Math.max(1, Math.round(dmg * 0.5));
  if(c.buff.shield > 0) dmg = Math.max(1, dmg - Math.round(dmg * c.buff.shield));
  S.hp -= dmg;
  if(S.hp <= 0){ loseFight(); return; }
  c.turn++;
}

/* 兼容旧 API（阶段一的 fightSkillA/B 现在等价于槽位 0/1 的主动技） */
function fightSkillA(){ castSkill(0); }
function fightSkillB(){ castSkill(1); }

function winFight(){
  const c = S.combat;
  const m = c.m;
  S.kills++;
  if(m.boss) S.stat.boss++;
  addLog('【'+m.name+'】发出一声哀鸣，轰然倒地。','epic');
  gainExp(m.exp);
  const got = fortStone(m.stones);
  S.stones += got; S.stat.stones += got;
  addLog('拾得灵石 '+num(got)+' 枚。','item');

  // 掉落（气运提高掉落概率）
  const dropChance = (m.boss ? 100 : fortDrop(26 + m.tier*7));
  if(chance(dropChance)){
    const it = rollItem(-1 + m.tier, 0.12 + m.tier*0.14 + (m.boss?0.28:0));
    addItem(it);
  }else if(chance(22)){
    const p = pick(PILLS);
    S.pills[p.name] = (S.pills[p.name]||0) + 1;
    addLog('从残骸中摸出一枚「'+p.name+'」。','item');
  }

  // 灵兽幼崽：只有凶兽以上的妖兽才有，妖王概率大涨
  const mtChance = fortDrop(m.boss ? 55 : (m.tier >= 1 ? 5 + m.tier*3.5 : 1.5));
  if(chance(mtChance)){
    addLog('你在其巢穴深处发现一枚尚有余温的兽卵——还能驯服。','act');
    addItem(rollMount(clamp(m.tier - 1, 0, 4), 0.10 + m.tier*0.13 + (m.boss?0.25:0)));
  }

  /* 材料：与上面三类掉落**并行**，用独立判定，不挤占既有概率（老玩家收益节奏不变） */
  const mats = rollMaterialDrop(m.tier, m.boss);
  if(Object.keys(mats).length){
    addMaterials(mats, true);
    addLog('从残骸中剥取：'+matPlain(mats)+'。','dim');
  }

  checkAch();
  endFight('win');
}

function loseFight(){
  playerDefeated();
}

function endFight(outcome){
  const c = S.combat;
  const ctx = c.ctx;
  S.combat = null;
  if(outcome === 'win' && ctx.type === 'boss'){ completeDungeon(); return; }
  if(outcome === 'win' && ctx.type === 'dungeon'){
    addLog('你退回秘境甬道，继续前行。','dim');
  }
  renderAll();
}

function playerDefeated(){
  S.combat = null;
  S.deaths++;
  const lose = Math.floor(S.exp * 0.25);
  S.exp = Math.max(0, S.exp - lose);
  advance(3);
  const st = stats();
  S.hp = Math.round(st.hpMax*0.3);
  S.mp = Math.round(st.mpMax*0.3);
  addLog('你眼前一黑，栽倒在地……','dmg');
  addLog('三日后于溪边醒来，周身剧痛。修为流失 '+num(lose)+'，气血仅余三成。','warn');
  if(S.dungeon){
    addLog('秘境之行就此中断，所得之物尽数遗落在深处。','warn');
    S.dungeon = null;
  }
  addSep();
  after();
}

function fightPill(){
  if(!S.pills['回春丹']){ toast('没有回春丹'); return; }
  if((S.fightPillN||0) >= 3){ toast('药力已过，再服无用'); return; }
  S.fightPillN = (S.fightPillN||0)+1;
  usePill('回春丹', true);
  addLog('你趁隙吞下一枚回春丹。','gain');
  monsterTurn();
  after();
}

/* ── sys/hunt.js ────────────────────────────────────────────────── */

/* ---------------- 历练 ---------------- */
function hunt(gi){
  if(S.combat || S.dungeon) return;
  const g = GROUNDS[gi];
  if(S.level < g.min){ toast('境界不足，需 '+realmAt(g.min).name); return; }
  const days = travelDays(g.days);
  advance(days);
  const r = Math.random()*100;
  if(r < 62){
    startFight(makeMonster(g.tier, chance(4)), { type:'hunt' });
    renderAll(); return;
  }else if(r < 78){
    const s = fortStone(Math.round((14 + g.tier*22) * (1 + S.level*0.3) * rf(0.7,1.4)));
    S.stones += s; S.stat.stones += s;
    addLog('你在'+g.name+'搜寻半日，于岩缝中寻得灵石 '+num(s)+' 枚。','item');
  }else if(r < 89){
    addLog('你在'+g.name+'游走'+days+'日，只见风过林梢，未遇敌手。','dim');
  }else if(r < 95){
    const it = rollItem(0, 0.15 + g.tier*0.12);
    addLog('涧边一具枯骨半掩于落叶之下，手中犹握一物。','act');
    addItem(it);
    /* 骨旁还有几块未化的矿石（与上面并行，不占器物判定） */
    const got = rollSeamMats(g.tier);
    addMaterials(got, true);
    addLog('骨旁散落：'+matPlain(got)+'。','dim');
  }else if(r < 98){
    addLog('林间一只受伤的幼兽伏在溪边，见你并不躲闪，反而低鸣着凑了过来。','act');
    addItem(rollMount(clamp(g.tier-1, 0, 4), 0.12 + g.tier*0.13));
  }else{
    const d = Math.round(stats().hpMax*0.22);
    S.hp = Math.max(1, S.hp - d);
    addLog('你误入兽群伏击圈！一番苦战后脱身，气血 -'+num(d)+'。','warn');
  }
  checkAch();
  if(tryEncounter()) return;
  after();
}

function estPower(tier){
  return Math.round((13 + S.level*5.2) * (1 + tier*0.58) * 5 + 120);
}

function curGround(){
  let best = 0;
  for(let i=0;i<GROUNDS.length;i++) if(S.level >= GROUNDS[i].min) best = i;
  return best;
}

/* ── sys/dungeon.js ─────────────────────────────────────────────── */

/* =========================================================
   秘境系统
   ========================================================= */
function enterSecret(si){
  if(S.combat || S.dungeon) return;
  const d = SECRETS[si];
  if(S.level < d.min){ toast('境界不足，需 '+realmAt(d.min).name); return; }
  if(S.mp < d.mp){ toast('灵力不足，需 '+num(d.mp)); return; }
  S.mp -= d.mp;
  advance(travelDays(d.days));
  S.dungeon = { idx:si, floor:1, total:d.floors, searched:false, gained:0, items:0 };
  addSep();
  addLog('你以灵力 '+num(d.mp)+' 打开「'+d.name+'」的入口禁制，踏入其中。','epic');
  addLog(d.desc,'dim');
  S.stat.secEnter++;
  floorIntro();
  checkAch();
  after();
}

function floorIntro(){
  const d = S.dungeon, def = SECRETS[d.idx];
  if(d.floor === d.total){
    addLog('═══ 第 '+d.floor+' 层 · 终点 ═══  前方妖气冲霄，守关妖王的气息压得你几乎喘不过气。','warn');
  }else{
    addLog('─── 第 '+d.floor+'/'+d.total+' 层 ───','sys');
  }
}

function dungeonSearch(){
  const d = S.dungeon;
  if(!d || d.searched) return;
  d.searched = true;
  const def = SECRETS[d.idx];
  const r = Math.random()*100;

  if(r < 34){
    const s = fortStone(Math.round((30 + def.tier*70) * (1 + S.level*0.35) * rf(0.8,1.3)));
    S.stones += s; d.gained += s; S.stat.stones += s;
    addLog('崖壁暗格中藏着一只玉匣，启开是满满灵石。','item');
    addLog('灵石 +'+num(s),'gain');
  }else if(r < 54){
    const it = rollItem(ri(0,2), def.luck);
    if(addItem(it)) d.items++;
  }else if(r < 68){
    const e = Math.floor(expNeed(S.level) * (0.28 + def.tier*0.1));
    gainExp(e);
    addLog('石壁上刻着上古修士的修行心得，你默诵良久，受益匪浅。','act');
  }else if(r < 76){
    addLog('石室角落一只异兽被禁制锁了不知多少岁月，见你破阵，竟低头伏地。','act');
    addItem(rollMount(ri(0, def.tier+1), def.luck + 0.16));
  }else if(r < 90){
    addLog('你拨开藤蔓，一头妖兽猛然扑出！','warn');
    startFight(makeMonster(def.tier, false), { type:'dungeon' });
    renderAll(); return;
  }else{
    const dm = Math.round(stats().hpMax*0.18);
    S.hp = Math.max(1, S.hp - dm);
    addLog('脚下法阵骤然亮起，万千雷芒穿体而过——但你并非全无收获。','warn');
    const s = fortStone(Math.round((45 + def.tier*90) * (1 + S.level*0.35)));
    S.stones += s; S.stat.stones += s;
    addLog('气血 -'+num(dm)+'，却从阵眼中剥离出灵石 '+num(s)+' 枚。','dmg');
  }
  after();
}

function dungeonForward(){
  const d = S.dungeon;
  if(!d || d.floor >= d.total) return;
  const def = SECRETS[d.idx];
  const e = Math.floor(expNeed(S.level) * (0.16 + def.tier*0.06));
  gainExp(e);
  d.floor++;
  d.searched = false;
  advance(1);
  /* 每层保底：走一趟总有点收获（与既有分支并行，不改动它们） */
  const got = rollSearchMats(def.tier);
  addMaterials(got, true);
  addLog('沿途采撷：'+matPlain(got)+'。','dim');
  floorIntro();
  if(chance(48)){
    addLog('转角处一道黑影直扑而至！','warn');
    startFight(makeMonster(def.tier, false), { type:'dungeon' });
  }
  after();
}

function dungeonBoss(){
  const d = S.dungeon;
  if(!d) return;
  const def = SECRETS[d.idx];
  addLog('你踏上最后一级台阶，守关妖王缓缓转身——','dmg');
  startFight(makeMonster(def.tier, true), { type:'boss' });
  renderAll();
}

function completeDungeon(){
  const d = S.dungeon;
  const def = SECRETS[d.idx];
  addSep();
  addLog('═══ 「'+def.name+'」 已 被 贯 通 ═══','epic');
  const e = Math.floor(expNeed(S.level) * (0.9 + def.tier*0.35));
  gainExp(e);
  const s = fortStone(Math.round((160 + def.tier*380) * (1 + S.level*0.35)));
  S.stones += s; S.stat.stones += s;
  addLog('妖王陨落，其守护的宝藏尽归你手：灵石 +'+num(s)+'。','item');
  const n = def.tier + 1;
  for(let i=0;i<n;i++){
    const it = rollItem(ri(1,4), def.luck + 0.2);
    addItem(it);
  }
  addLog('你自秘境深处掠出，衣衫猎猎。此番所得，抵得上数月苦修。','epic');
  if(S.pills['破境丹'] === 0 && chance(50)){
    S.pills['破境丹'] = 1;
    addLog('妖王内丹中竟凝着一缕破境之机，可炼为破境丹。','item');
  }
  if(chance(38)){
    addLog('妖王尸身前，一头幼兽蜷缩着低鸣——它认你为主了。','act');
    addItem(rollMount(ri(1, def.tier+1), def.luck + 0.22));
  }
  /* 妖王身上的材料包（与既有掉落并行） */
  const bm = rollBossMats(def.tier);
  addMaterials(bm, true);
  addLog('妖王陨落，尸身中剥出：'+matPlain(bm)+'。','item');
  /* 妖王遗物：必有一部功法石壁（已尽数参透则折算灵石） */
  const gf = gfRollDrop();
  if(gf){
    addLog('洞府最深处，石壁上刻着一部功法，笔意森然——','act');
    gfGrant(gf);
  }else{
    const gift = fortStone(220 + def.tier * 300);
    S.stones += gift; S.stat.stones += gift;
    addLog('石壁上的功法你早已参透，只将拓本收起，换作灵石 +'+num(gift)+'。','dim');
  }
  S.dungeon = null;
  S.stat.secret++;
  if(META.secSet.indexOf(d.idx) < 0){ META.secSet.push(d.idx); saveMeta(); }
  addSep();
  checkAch();
  after();
}

function dungeonLeave(){
  const d = S.dungeon;
  if(!d) return;
  addLog('你见好就收，循原路退出「'+SECRETS[d.idx].name+'」。','sys');
  S.dungeon = null;
  after();
}

/* =========================================================
   坊市 / 装备
   ========================================================= */
function refreshShop(free){
  if(!free){
    if(S.stones < 3){ toast('灵石不足'); return; }
    S.stones -= 3;
    addLog('你付了 3 枚灵石，请掌柜换了批新货。','dim');
  }
  S.shop = [];
  for(let i=0;i<4;i++){
    S.shop.push(rollItem(ri(-1,2), 0.08 + S.level/60));
  }
  // 灵兽栏：坊市常设一头坐骑，随境界与刷新浮动
  const mt = clamp(ri(0,1) + Math.floor(S.level/12), 0, 4);
  S.shopMount = rollMount(mt, 0.10 + S.level/70);
  /* 藏经阁：每批货摆两部未习得的功法 */
  S.shopBook = gfRollBook();
  S.shopDay = S.day;
  if(!free) after();
}

function buyItem(i){
  const it = S.shop[i];
  if(!it) return;
  const cost = itemCost(it);
  if(S.stones < cost){ toast('灵石不足（需 '+num(cost)+'）'); return; }
  S.stones -= cost;
  S.shop.splice(i,1);
  addLog('你以 '+num(cost)+' 枚灵石购得【'+it.name+'】。','item');
  addItem(it, true);
  after();
}

/* -------- 出售价：约为买价的四成 -------- */
function sellPrice(x){
  if(!x) return 0;
  if(isMount(x)) return Math.max(1, Math.round(mountCost(x)*0.42));
  return Math.max(1, Math.round(itemCost(x)*0.42));
}

/* =========================================================
   出售 · 以器易石
   ========================================================= */
const SELL_TYPES = [
  {k:'all', n:'全部'}, {k:'weapon', n:'武器'}, {k:'armor', n:'防具'},
  {k:'treasure', n:'法宝'}, {k:'mount', n:'坐骑'}
];
const SELL_Q = [
  {k:'all', n:'全部'}, {k:'0', n:'凡品'}, {k:'1', n:'灵品'},
  {k:'2', n:'宝品'}, {k:'3', n:'仙品'}, {k:'4', n:'神品'}
];
let SELL = { type:'all', q:'all' };

function setSell(type, q){
  if(type) SELL.type = type;
  if(q) SELL.q = q;
  after();
}
function matchSell(it){
  if(SELL.type !== 'all'){
    if(SELL.type === 'mount'){ if(!isMount(it)) return false; }
    else if(it.slot !== SELL.type || isMount(it)) return false;
  }
  if(SELL.q !== 'all' && it.q !== +SELL.q) return false;
  return true;
}
function sellBatch(){
  if(noBusy('战中无暇谈价')) return;
  const list = S.bag.filter(matchSell);
  if(!list.length){ toast('没有符合条件的器物'); return; }
  let tot = 0;
  for(const it of list){
    const i = S.bag.indexOf(it);
    if(i >= 0) S.bag.splice(i,1);
    tot += sellPrice(it);
  }
  S.stones += tot;
  S.stat.stones += tot;
  addLog('你抱出一堆器物摊在柜上，掌柜逐件验看，共付灵石 '+num(tot)+' 枚（'+list.length+' 件）。','item');
  checkAch();
  after();
}
function sellQuality(maxQ){
  if(noBusy('战中无暇谈价')) return;
  const list = S.bag.filter(x => x.q <= maxQ);
  if(!list.length){ toast('没有符合条件的器物'); return; }
  let tot = 0;
  for(const it of list){
    const i = S.bag.indexOf(it);
    if(i >= 0) S.bag.splice(i,1);
    tot += sellPrice(it);
  }
  S.stones += tot;
  S.stat.stones += tot;
  addLog('你把那些用不上的器物尽数卖给掌柜，得灵石 '+num(tot)+' 枚（'+list.length+' 件）。','item');
  checkAch();
  after();
}
function sellBagItem(id){
  if(noBusy('战中无暇谈价')) return;
  const i = S.bag.findIndex(x=>x.id===id);
  if(i < 0) return;
  const it = S.bag[i], p = sellPrice(it);
  S.bag.splice(i,1);
  S.stones += p;
  S.stat.stones += p;
  addLog('你将【'+it.name+'】售与坊市，得灵石 '+num(p)+' 枚。','item');
  checkAch();
  after();
}
function sellEquipped(key, idx){
  if(noBusy('战中无暇谈价')) return;
  let it = null;
  if(key === 'treasure'){
    it = S.equip.treasures[idx];
    if(!it) return;
    S.equip.treasures[idx] = null;
  }else{
    it = S.equip[key];
    if(!it) return;
    S.equip[key] = null;
  }
  const p = sellPrice(it);
  S.stones += p;
  S.stat.stones += p;
  addLog('你解下【'+it.name+'】当场售出，得灵石 '+num(p)+' 枚。','item');
  clampVitals(); checkAch(); after();
}

/* ── sys/encounter.js ───────────────────────────────────────────── */

function encSeg(){
  const g = realmAt(S.level).group;
  return g <= 1 ? 0 : g <= 3 ? 1 : g <= 6 ? 2 : g <= 9 ? 3 : 4;
}
function encTier(){ return clamp(encSeg() + 1, 0, 4); }

function eExp(m){ return Math.floor(expNeed(S.level) * m); }
function eStone(m){ return fortStone(Math.round((50 + S.level*30) * m)); }
function eStones(m){ const v = eStone(m); S.stones += v; addLog('灵石 +'+num(v)+' 枚。','item'); return v; }
function eGain(m){ gainExp(eExp(m)); }
function eLoot(luck, bias, n){
  n = n || 1;
  for(let i=0;i<n;i++) addItem(rollItem(bias === undefined ? 0 : bias, luck));
}
function ePill(name, n){ S.pills[name] = (S.pills[name]||0) + n; addLog('得「'+name+'」×'+n+' 枚。','item'); }
function eHeal(){ const st = stats(); S.hp = st.hpMax; S.mp = st.mpMax; addLog('气血与灵力尽复。','gain'); }
function eHurt(m){ const d = Math.round(stats().hpMax*m); S.hp = Math.max(1, S.hp - d); addLog('气血 -'+num(d)+'。','dmg'); }
function eSpend(mp){ const d = Math.round(stats().mpMax*mp); S.mp = Math.max(0, S.mp - d); return d; }
function eFight(tier, boss){ startFight(makeMonster(clamp(tier,0,4), !!boss), { type:'enc' }); }
function eMirror(){
  const st = stats();
  const hp = Math.round(st.hpMax*1.1);
  return { name:'镜中之我', tier:3, boss:false, hpMax:hp, hp:hp,
    atk: Math.round(st.atk*1.05), def: Math.round(st.def*0.95), crit: st.crit,
    exp: eExp(2.8), stones: eStone(3.2) };
}

function tryEncounter(){
  if(!S || busy() || S.encOpen) return false;
  if(S.day - (S.encDay||0) < ENC_CD) return false;
  if(!chance(ENC_RATE)) return false;
  const seg = encSeg();
  const pool = ENCOUNTERS.filter(e => e.seg === seg);
  if(!pool.length) return false;
  const tot = pool.reduce((a,e)=>a+e.w, 0);
  let r = Math.random()*tot, sel = pool[0];
  for(const e of pool){ r -= e.w; if(r <= 0){ sel = e; break; } }
  S.encDay = S.day;
  S.encOpen = sel;
  META.encSeen = (META.encSeen||0) + 1;
  if(META.encKeys.indexOf(sel.k) < 0) META.encKeys.push(sel.k);
  if(S.stat) S.stat.enc++;
  saveMeta();
  addSep();
  addLog('【奇遇 · '+sel.t+'】'+sel.d,'enc');
  showEncounter();
  return true;
}

function showEncounter(){
  const e = S.encOpen;
  if(!e) return;
  let h = '<div class="encintro">'+e.d+'</div><div class="encopts">';
  for(let i=0;i<e.ch.length;i++){
    const o = e.ch[i];
    h += '<div class="encopt" onclick="encChoose('+i+')">'
      + '<div class="et">'+o.t+'</div>'
      + (o.d ? '<div class="ed">'+o.d+'</div>' : '')
      + '</div>';
  }
  h += '</div>';
  showModal('奇 遇 · '+e.t, h, [], 'wide');
}

function encChoose(i){
  const e = S.encOpen;
  if(!e) return;
  const o = e.ch[i];
  if(!o) return;
  S.encOpen = null;
  closeModal();
  addLog('你选择了「'+o.t+'」。','sys');
  try{ o.f(); }catch(err){}
  checkAch();
  clampVitals();
  after();
}

/* 汇总当前可判定的一切数据（本局 + 历世累计） */
function achAgg(){
  const s = S.stat || blankStat(), l = META.life || blankStat();
  const sum = k => (s[k]||0) + (l[k]||0);
  const eq = S.equip;
  return {
    lv: Math.max(S.level, META.best.lv||0),
    grp: realmAt(Math.max(S.level, META.best.lv||0)).group,
    day: Math.max(S.day, META.best.day||0),
    kills: S.kills + META.totalKills,
    deaths: S.deaths + META.totalDeaths,
    rebirths: META.rebirths,
    asc: META.ascensions,
    med: sum('med'), sec: sum('sec'), secEnter: sum('secEnter'),
    ins: sum('ins'), boss: sum('boss'), secret: sum('secret'),
    stones: sum('stones'), items: sum('items'),
    xian: sum('xian'), shen: sum('shen'),
    mountMax: Math.max(s.mountMax||0, l.mountMax||0),
    chain: Math.max(s.chainMax||0, l.chainMax||0),
    pillUse: sum('pillUse'), breakFail: sum('breakFail'), enc: META.encSeen||0,
    secretAll: (META.secSet||[]).length >= SECRETS.length,
    gearFull: !!(eq.weapon && eq.armor && eq.treasures[0] && eq.treasures[1] && eq.treasures[2]),
    fort: fortune()
  };
}

/* 成就加成的汇总（供 stats / 突破率使用） */
function achBonus(){
  const b = { atk:0, def:0, hp:0, cult:0, brk:0, f:0 };
  for(const k of achList()){
    const d = ACH_BY_KEY[k];
    if(!d) continue;
    const tb = ACH_TIER[d.t].b;
    b.atk += tb.atk||0; b.def += tb.def||0; b.hp += tb.hp||0;
    b.cult += tb.cult||0; b.brk += tb.brk||0;
  }
  return b;
}

/* 扫描并解锁；返回本次新解锁的成就数组 */
function checkAch(){
  if(!S) return [];
  const list = achList();
  const a = achAgg();
  const got = [];
  for(const d of ACHIEVEMENTS){
    if(list.indexOf(d.k) >= 0) continue;
    let ok = false;
    try{ ok = !!d.c(a); }catch(e){ ok = false; }
    if(ok){ list.push(d.k); got.push(d); }
  }
  if(got.length){
    saveMeta();
    for(const d of got){
      addLog('【成就 · '+ACH_TIER[d.t].n+'品】'+d.n+' —— '+d.d+'　（'+achTierText(d.t)+'）','ach');
    }
    showAchPop(got[got.length-1], got.length);
  }
  return got;
}

/* 解锁横幅：金色卷轴自顶垂下 */
function showAchPop(d, total){
  if(!d) return;
  const t = ACH_TIER[d.t];
  const el = document.createElement('div');
  el.className = 'achpop' + (d.t >= 4 ? ' shen' : '');
  el.innerHTML = '<span class="aseal">'+t.n+'</span>'
    + '<span class="atxt">'
    + '<span class="ak">成 就 达 成'+(total>1 ? ' ×'+total : '')+'</span><br>'
    + '<span class="an">'+d.n+'</span><br>'
    + '<span class="ab">'+achTierText(d.t)+'</span>'
    + '</span>';
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); }, 2600);
  setTimeout(()=>{ el.remove(); }, 3100);
}

/* ── sys/craft.js ───────────────────────────────────────────────── */

/* =========================================================
   材 料 · 炼 制 —— 逻辑层
   ---------------------------------------------------------
   设计要点（改之前先读）：
   1. 材料是**本局**的，不存 META —— 与装备/灵石一致，轮回清零
   2. 掉落与现有产出**并行**，不挤占既有概率（老玩家的收益节奏不变）
   3. 炼制消耗**灵力 + 天数**，不消耗灵石 —— 材料本身才是稀缺项，
      也让「出门打怪」与「留家开炉」形成节奏竞争
   4. 成功率三路加成：配方基础 + 丹道传承 + 境界差（越级炼有惩罚）
   5. 失败返还 40% 材料 —— 有痛感，但不劝退
   6. 炼器出器的品质随机（qiMin 起步，气运与越级加成）→ 把随机产出变成可控产出
   ========================================================= */

/* ---------- 材料基础操作 ---------- */
function materialName(k){
  const m = MATERIALS[k];
  return m ? m.n : k;
}
function materialDef(k){ return MATERIALS[k] || null; }

function countMat(k){
  if(!S || !S.materials) return 0;
  return S.materials[k] || 0;
}
function totalMats(){
  if(!S || !S.materials) return 0;
  let n = 0;
  for(const k of MAT_ORDER) n += (S.materials[k] || 0);
  return n;
}
function addMaterial(k, n){
  if(!S || !MATERIALS[k]) return false;
  n = Math.floor(Number(n) || 0);
  if(n <= 0) return false;
  if(!S.materials) S.materials = {};
  S.materials[k] = clamp((S.materials[k] || 0) + n, 0, 999999);
  return true;
}
function addMaterials(map, quiet){
  if(!map) return 0;
  let total = 0;
  const got = {};
  for(const k in map){
    if(addMaterial(k, map[k])){ total += Math.floor(Number(map[k]) || 0); got[k] = Math.floor(Number(map[k]) || 0); }
  }
  if(!quiet && total > 0) addLog('获得材料：' + matPlain(got) + '。', 'item');
  return total;
}
function hasMats(need){
  if(!need) return true;
  for(const k in need) if(countMat(k) < need[k]) return false;
  return true;
}
function costMats(need){
  if(!hasMats(need)) return false;
  for(const k in need) S.materials[k] -= need[k];
  return true;
}
/* 失败返还（默认四成） */
function refundMats(need, rate){
  rate = (rate === undefined) ? 0.4 : rate;
  const back = {};
  for(const k in need){
    const n = Math.floor(need[k] * rate);
    if(n > 0) back[k] = n;
  }
  addMaterials(back, true);
  return back;
}
function scaleNeed(need, n){
  const out = {};
  for(const k in need) out[k] = need[k] * n;
  return out;
}

/* ---------- 文案 ---------- */
/* { lingcao:3 } → "灵草×3"（不足者标红，界面用） */
function matText(need){
  if(!need) return '';
  const parts = [];
  for(const k of MAT_ORDER){
    if(!need[k]) continue;
    const m = MATERIALS[k];
    const cnt = need[k];
    const enough = countMat(k) >= cnt;
    parts.push('<span' + (enough ? '' : ' style="color:var(--zhu)"') + '>'
      + (m ? m.n : k) + '×' + cnt + '</span>');
  }
  return parts.join(' · ');
}
/* 纯文本版（日志用，切勿放进 HTML 位置） */
function matPlain(need){
  if(!need) return '';
  const parts = [];
  for(const k of MAT_ORDER){
    if(!need[k]) continue;
    const m = MATERIALS[k];
    parts.push((m ? m.n : k) + '×' + need[k]);
  }
  return parts.join(' · ');
}
/* 带品阶色的材料名（左栏与货架用；仙品以上自带流光） */
function matLabel(k, n){
  const m = MATERIALS[k];
  if(!m) return k;
  const cnt = (n === undefined) ? countMat(k) : n;
  return qName(m.n, m.t) + '<span class="muted-sm"> ×' + num(cnt) + '</span>';
}
function matTierName(t){
  return ['凡品','灵品','宝品','仙品','神品'][clamp(t, 0, 4)] || '凡品';
}

/* ---------- 材料买卖（坊市材料铺：应急补差） ---------- */
function matPrice(k){
  const row = MAT_SHOP.find(x => x.k === k);
  return row ? row.price : 0;
}
function buyMaterial(k, n){
  const gfMat = MATERIALS[k];
  if(!gfMat) return false;
  n = Math.max(1, Math.floor(Number(n) || 1));
  const p = matPrice(k);

}

   ========================================================= */

/* 妖兽：击杀后调用一次（不挤占成品掉落分支） */
function rollMaterialDrop(tier, boss){
  const got = {};
  tier = clamp(tier, 0, 4);
  /* 兽皮：凡兽起就有 */
  if(chance(boss ? 100 : 70)) got.shoupi = ri(1, 2 + tier) * (boss ? 3 : 1);
  /* 妖丹：凶兽起 */
  if(tier >= 1 && chance(boss ? 100 : 45 + tier * 8)) got.yaodan = ri(1, 1 + Math.floor(tier / 2)) * (boss ? 3 : 1);
  /* 玄铁：妖将起 */
  if(tier >= 2 && chance(boss ? 90 : 25 + tier * 6)) got.xuantie = ri(1, tier - 1) * (boss ? 2 : 1);
  /* 星辰砂：妖王/高阶 */
  if(tier >= 3 && chance(boss ? 70 : 12 + tier * 4)) got.xingchen = boss ? 2 : 1;
  /* 混沌石：仅最高档妖王 */
  if(boss && tier >= 4 && chance(35)) got.hundun = 1;
  return got;
}

/* 秘境每层保底（在 dungeonForward 里给） */
function rollSearchMats(tier){
  const got = {};
  tier = clamp(tier, 0, 4);
  got.lingcao = ri(2, 4 + tier);
  if(tier >= 1 && chance(55)) got.xuantie = ri(1, 1 + tier);
  if(tier >= 2 && chance(30 + tier * 4)) got.xingchen = 1;
  return got;
}

/* 秘境妖王贯通时的大材料包 */
function rollBossMats(tier){
  const got = {};
  tier = clamp(tier, 0, 4);
  got.shoupi  = ri(4, 8);
  got.yaodan  = ri(3, 6);
  got.xuantie = ri(2, 4 + tier);
  if(tier >= 2) got.xingchen = ri(1, 1 + Math.floor(tier / 2));
  if(tier >= 4 && chance(45)) got.hundun = 1;
  return got;
}
/* 历练岩缝：额外掉矿 */
function rollSeamMats(tier){
  tier = clamp(tier, 0, 4);
  const got = { lingcao: ri(1, 2) };
  if(tier >= 1) got.xuantie = ri(1, 1 + tier);

}

/* =========================================================
   炼 制 · 通 用 计 算
   ========================================================= */
/* 丹道传承（复用既有传承，不新增字段） */
function heritagePillBonus(){
  return ((META && META.up && META.up.pill) ? META.up.pill : 0) * 0.015;
}
/* 境界差：当前大境界组 - 配方推荐段 */
function realmDiff(lv){ return realmAt(S.level).group - (lv || 0); }

/* 最终成功率：配方基础 + 丹道 + 洞府（丹房/器坊）+ 境界差
   extra 是外部加成（洞府设施），不是基础率 */
function finalRate(recipe, extra){
  let r = (recipe.base || 0) + heritagePillBonus() + (extra || 0);
  const d = realmDiff(recipe.lv);
  if(d < 0) r += d * 0.06;                    /* 越级炼：每差一档 -6% */
  else r += Math.min(0.10, d * 0.02);         /* 高境界炼低配方：至多 +10% */
  return clamp(r, 0.05, 0.98);
}
/* 每次消耗灵力 */
function craftMp(recipe){
  const st = stats();
  return Math.round(st.mpMax * recipe.mpF) + 5;
}
/* 境界是否足以驾驭 */
function craftLocked(recipe){
  return (recipe.lv || 0) > realmAt(S.level).group + 2;
}
function pillCraftRate(k){
  const r = PILL_RECIPES.find(x => x.k === k);
  return r ? finalRate(r, cvBonus().pillRate) : 0;        /* 洞府 · 丹房 */
}
function gearCraftRate(k){
  const r = GEAR_RECIPES.find(x => x.k === k);
  return r ? finalRate(r, cvBonus().gearRate) : 0;        /* 洞府 · 器坊 */
}
function canCraftPill(k, n){ return canCraft(PILL_RECIPES, k, n); }
function canCraftGear(k, n){ return canCraft(GEAR_RECIPES, k, n); }
function canCraft(list, k, n){
  const r = list.find(x => x.k === k);
  if(!r || !S) return false;
  n = Math.max(1, Math.floor(Number(n) || 1));
  if(craftLocked(r)) return false;
  if(!hasMats(scaleNeed(r.need, n))) return false;
  if(S.mp < craftMp(r) * n) return false;
  return true;
}
/* 界面用：给出不能炼的原因 */
function craftBlockReason(r){
  if(craftLocked(r)) return '境界不足以驾驭此方（需 ' + realmNameOf(r.lv) + '）';
  if(!hasMats(r.need)) return '材料不足';
  if(S.mp < craftMp(r)) return '灵力不足';
  return '';
}

/* =========================================================
   炼 丹
   ========================================================= */
function craftPill(k, n){
  n = Math.max(1, Math.floor(Number(n) || 1));
  const r = PILL_RECIPES.find(x => x.k === k);
  if(!r){ toast('无此丹方'); return; }
  if(busy()){ toast('战中无暇开炉'); return; }
  const needAll = scaleNeed(r.need, n);
  if(craftLocked(r)){ toast('境界不足以驾驭此方'); return; }
  if(!hasMats(needAll)){ toast('材料不足（需 ' + matPlain(needAll) + '）'); return; }
  const mpCost = craftMp(r) * n;
  if(S.mp < mpCost){ toast('灵力不足（需 ' + num(mpCost) + '）'); return; }

  S.mp -= mpCost;
  costMats(needAll);
  const days = r.days * n;
  advance(days);
  addLog('你布下丹炉，以灵力 ' + num(mpCost) + ' 催动真火，炼了 ' + days + ' 日——', 'act');

  const rate = finalRate(r, cvBonus().pillRate);
  let ok = 0, bad = 0;
  for(let i = 0; i < n; i++){ if(chance(rate * 100)) ok++; else bad++; }

  if(ok > 0){
    S.pills[r.out] = (S.pills[r.out] || 0) + ok;
    addLog('成丹 ' + ok + ' 枚「' + r.out + '」，炉中清香四溢。', 'item');
  }
  if(bad > 0){
    const back = refundMats(scaleNeed(r.need, bad), 0.4);
    addLog('炸炉 ' + bad + ' 次，丹毁。残渣中收回：' + matPlain(back) + '。', 'warn');
  }
  if(S.stat) S.stat.pillMake = (S.stat.pillMake || 0) + ok;
  checkAch();
  after();
}

/* =========================================================
   炼 器
   ========================================================= */
function craftGear(k, n){
  n = Math.max(1, Math.floor(Number(n) || 1));
  const r = GEAR_RECIPES.find(x => x.k === k);
  if(!r){ toast('无此器方'); return; }
  if(busy()){ toast('战中无暇开炉'); return; }
  const needAll = scaleNeed(r.need, n);
  if(craftLocked(r)){ toast('境界不足以驾驭此方'); return; }
  if(!hasMats(needAll)){ toast('材料不足（需 ' + matPlain(needAll) + '）'); return; }
  const mpCost = craftMp(r) * n;
  if(S.mp < mpCost){ toast('灵力不足（需 ' + num(mpCost) + '）'); return; }

  S.mp -= mpCost;
  costMats(needAll);
  const days = r.days * n;
  advance(days);
  addLog('你架起炉火，以灵力 ' + num(mpCost) + ' 锤锻 ' + days + ' 日——', 'act');

  const rate = finalRate(r, cvBonus().gearRate);
  const over = realmDiff(r.lv) >= 4;                    /* 境界远超配方：火候更纯 */
  let ok = 0, bad = 0;
  for(let i = 0; i < n; i++){
    if(!chance(rate * 100)){ bad++; continue; }
    /* 品质：qiMin 起步；气运有概率 +1 阶；越级炼器再 +1 阶 */
    let qi = r.qiMin;
    if(chance(12 + fortune() * 0.25)) qi++;
    if(over) qi++;
    qi = clamp(qi, r.qiMin, 4);
    const lv = Math.max(0, S.level + (r.lvBias || 0));
    const item = makeItem(r.slot, lv, qi);
    addItem(item, true);
    addLog('器成：' + itemLabel(item), 'item');
    ok++;
  }
  if(bad > 0){
    const back = refundMats(scaleNeed(r.need, bad), 0.4);
    addLog('器碎 ' + bad + ' 件。残料收回：' + matPlain(back) + '。', 'warn');
  }
  if(S.stat) S.stat.gearMake = (S.stat.gearMake || 0) + ok;
  checkAch();
  after();
}

/* =========================================================
   存 档 进 出（防御式：undefined / 非法键 / 负数一律剔除）
   ========================================================= */
function matSanitize(d){
  const out = {};
  if(!d || typeof d !== 'object') return out;
  for(const k in d){
    if(!MATERIALS[k]) continue;
    const v = Math.floor(Number(d[k]) || 0);
    if(v > 0) out[k] = clamp(v, 0, 999999);
  }
  return out;
}

/* ── sys/cave.js ────────────────────────────────────────────────── */

/* =========================================================
   洞 府 —— 逻辑层
   ---------------------------------------------------------
   设计要点（改之前先读）：
   1. 五处设施：灵田（灵草）· 聚灵阵（修速+凝石）· 丹房（成丹率）
      · 器坊（成器率）· 静室（离线上限）
   2. 升级消耗灵石 + 天数（天数走 advance，与出门打怪形成节奏竞争）
   3. 离线收益由 lastTick 差值折算，上限 = 8 + 静室等级×2 小时；
      超出部分**丢弃**（不打折），这样升静室才有意义
   4. 洞府归本局（S.cave），轮回清零
   5. 老存档首次读取时 lastTick 设为当前时刻 —— **不给白嫖**
   ========================================================= */

/* ---------- 安全访问 ---------- */
function caveEnsure(){
  if(!S) return null;
  if(!S.cave || typeof S.cave !== 'object') S.cave = { facs:{}, lastTick: Date.now() };
  if(!S.cave.facs || typeof S.cave.facs !== 'object') S.cave.facs = {};
  if(typeof S.cave.lastTick !== 'number' || S.cave.lastTick <= 0) S.cave.lastTick = Date.now();
  return S.cave;
}
function cvFacDef(k){ return CAVE_BY_KEY[k] || null; }
function cvFacMax(k){ const f = cvFacDef(k); return f ? f.max : 0; }

function cvFacLv(k){
  const c = caveEnsure();
  if(!c) return 0;
  return clamp(Math.floor(Number(c.facs[k]) || 0), 0, cvFacMax(k));
}
function cvTotalLv(){
  let n = 0;
  for(const f of CAVE_FACILITIES) n += cvFacLv(f.k);
  return n;
}
function cvTotalMax(){
  let n = 0;
  for(const f of CAVE_FACILITIES) n += f.max;
  return n;
}

/* ---------- 升级 ---------- */
function cvUpgradeCost(k){
  const f = cvFacDef(k);
  if(!f) return null;
  const lv = cvFacLv(k);
  if(lv >= f.max) return null;
  return f.cost(lv + 1);
}
function cvUpgrade(k){
  if(!S) return false;
  if(busy()){ toast('此刻无暇整修洞府'); return false; }
  const f = cvFacDef(k);
  if(!f) return false;
  const lv = cvFacLv(k);
  if(lv >= f.max){ toast('此设施已至圆满'); return false; }
  const cost = f.cost(lv + 1);
  if(S.stones < cost.stones){ toast('灵石不足（需 '+num(cost.stones)+'）'); return false; }
  S.stones -= cost.stones;
  advance(cost.days);
  caveEnsure().facs[k] = lv + 1;
  addLog('你整修「'+f.n+'」，已至 '+(lv+1)+' 级——'+cvFacSummary(f, lv+1)+'。','act');
  after();
  return true;
}

/* ---------- 效果汇总 ---------- */
function cvBonus(){
  const z = { cult:0, stone:0, herb:0, pillRate:0, gearRate:0, offlineCap:0 };
  if(!S || !S.cave) return z;
  for(const f of CAVE_FACILITIES){
    const lv = cvFacLv(f.k);
    if(!lv) continue;
    const e = f.eff(lv);
    for(const k in e) if(z[k] !== undefined) z[k] += e[k];
  }
  z.cult     = +z.cult.toFixed(1);
  z.herb     = +z.herb.toFixed(2);
  z.pillRate = +z.pillRate.toFixed(3);
  z.gearRate = +z.gearRate.toFixed(3);
  return z;
}

/* ---------- 离线结算 ---------- */
/* 可累积时长上限（小时） */
function cvOfflineCapHours(){ return CAVE_OFFLINE_BASE + cvBonus().offlineCap; }
function cvOfflineCapMs(){ return cvOfflineCapHours() * 3600 * 1000; }

/* 返回 null（无需结算）或一份 report。调用方负责弹面板。 */
function cvSettleOffline(){
  const c = caveEnsure();
  if(!c || !S) return null;
  const now = Date.now();
  const elapsed = now - c.lastTick;
  c.lastTick = now;                                  /* 先写回，无论是否结算都不重复计入 */
  if(!(elapsed >= CAVE_OFFLINE_MIN_MS)) return null; /* 短于 1 分钟（含时钟回拨）不算 */

  const capMs = cvOfflineCapMs();
  const usedMs = Math.min(elapsed, capMs);
  const capped = elapsed > capMs;
  const hours = usedMs / 3600000;

  const b = cvBonus();
  const report = { elapsedMs: elapsed, hours, capped, herb:0, stone:0 };

  if(b.herb > 0){
    report.herb = Math.floor(b.herb * hours);
    if(report.herb > 0) addMaterial('lingcao', report.herb);
  }
  if(b.stone > 0){
    report.stone = Math.floor(b.stone * hours);
    if(report.stone > 0){
      S.stones += report.stone;
      if(S.stat) S.stat.stones = (S.stat.stones||0) + report.stone;
    }
  }
  if(report.herb === 0 && report.stone === 0) return null;
  return report;
}

/* ---------- 文案 ---------- */
function cvFacSummary(f, lv){
  if(!lv) return '未 建';
  const e = f.eff(lv);
  const parts = [];
  if(e.herb)       parts.push('灵草 '+e.herb.toFixed(2)+' /时');
  if(e.stone)      parts.push('灵石 '+e.stone+' /时');
  if(e.cult)       parts.push('修速 +'+e.cult+'%');
  if(e.pillRate)   parts.push('成丹 +'+Math.round(e.pillRate*100)+'%');
  if(e.gearRate)   parts.push('成器 +'+Math.round(e.gearRate*100)+'%');
  if(e.offlineCap) parts.push('离线上限 +'+e.offlineCap+' 时');
  return parts.join(' · ');
}
function cvFacName(k){ const f = cvFacDef(k); return f ? f.n : k; }

function cvFmtDuration(ms){
  const mins = Math.floor(ms / 60000);
  if(mins < 60) return mins + ' 分';
  const hh = Math.floor(mins / 60);
  const mm = mins % 60;
  if(hh < 24) return hh + ' 时 ' + mm + ' 分';
  return Math.floor(hh / 24) + ' 日 ' + (hh % 24) + ' 时';
}

/* ---------- 存档进出 ---------- */
function cvSanitize(d){
  const out = { facs:{}, lastTick: Date.now() };
  if(!d || typeof d !== 'object') return out;
  const src = (d.facs && typeof d.facs === 'object') ? d.facs : {};
  for(const f of CAVE_FACILITIES){
    const v = Math.floor(Number(src[f.k]) || 0);
    if(v > 0) out.facs[f.k] = clamp(v, 0, f.max);
  }
  /* 未来的时间戳一律丢弃（系统时钟被改时 now - lastTick 会变负数） */
  if(typeof d.lastTick === 'number' && d.lastTick > 0 && d.lastTick <= Date.now() + 86400000){
    out.lastTick = d.lastTick;
  }
  return out;
}

/* 存档输出：lastTick 打上「此刻」，使离线时长 = 从最后活跃到下次打开的间隔。
   若沿用旧值，玩家在线挂机数小时后刷新也会算成离线收益 —— 这是可刷的漏洞。 */
function cvSnapshot(){
  const c = caveEnsure();
  if(!c) return { facs:{}, lastTick: Date.now() };
  return { facs: Object.assign({}, c.facs), lastTick: Date.now() };
}

/* ── ui/theme.js ────────────────────────────────────────────────── */

const THEME_KEY = 'xiuxian_theme_v1';
function systemDark(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
  catch(e){ return false; }
}
function savedTheme(){
  let t = null;
  try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
  return (t === 'light' || t === 'dark') ? t : null;
}
function applyTheme(){
  const t = savedTheme() || (systemDark() ? 'dark' : 'light');
  try{
    if(document.documentElement) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
  const b = $('themeBtn');
  if(b){
    b.textContent = (t === 'dark') ? '☀' : '☾';
    b.title = (t === 'dark') ? '切到宣纸（日间）' : '切到玄墨（夜间）';
  }
  return t;
}
function toggleTheme(){
  const next = (document.documentElement && document.documentElement.getAttribute('data-theme') === 'dark')
    ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme();
  const b = $('themeBtn');
  if(b) b.title = (next === 'dark') ? '切到宣纸（日间）' : '切到玄墨（夜间）';
}
/* 未手动选过主题时，跟随系统变化 */
function watchSystemTheme(){
  try{
    if(!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const on = () => { if(!savedTheme()) applyTheme(); };
    if(mq.addEventListener) mq.addEventListener('change', on);
    else if(mq.addListener) mq.addListener(on);
  }catch(e){}
}

let REH_UID = 700000;
function rehydrate(it){
  if(!it) return null;
  const o = Object.assign({}, it);
  o.id = ++REH_UID;
  if(o.power === undefined){
    o.power = Math.round((o.atk||0)*2 + (o.def||0)*2.6 + (o.hp||0)*0.16
      + (o.mp||0)*0.1 + (o.crit||0)*6 + (o.cult||0)*5 + (o.speed||0)*14);
  }
  return o;
}

/* 把一份存档数据装回运行时状态（读档 / 玉简 / 导入共用） */
function restore(d){
  if(!d || typeof d.level !== 'number') return false;
  const eq = d.equip || {};
  S = {
    level: d.level||0,
    exp: d.exp||0,
    day: d.day||1,
    stones: d.stones||0,
    hp: d.hp||1,
    mp: d.mp||0,
    equip:{
      weapon: eq.weapon ? rehydrate(eq.weapon) : null,
      armor:  eq.armor  ? rehydrate(eq.armor)  : null,
      mount:  eq.mount  ? rehydrate(eq.mount)  : null,
      treasures: (eq.treasures || [null,null,null]).map(x => x ? rehydrate(x) : null)
    },
    bag: (d.bag||[]).map(rehydrate),
    /* 药囊默认值由 data/pills.js 的表派生：新增丹药（如归元丹）自动补 0，老档不丢 */
    pills: Object.assign(blankPills(), d.pills||{}),
    /* 材料：本局所有；缺字段补空、非法键与负数由 matSanitize 剔除 */
    materials: matSanitize(d.materials),
    /* 洞府：本局所有；老档缺字段时 lastTick 取「此刻」——不给白嫖 */
    cave: cvSanitize(d.cave),
    logs: d.logs||[],
    combat:null,
    dungeon:null,
    shop:(d.shop||[]).map(rehydrate),
    shopMount: d.shopMount ? rehydrate(d.shopMount) : null,
    shopDay: d.shopDay||1,
    /* 旧版 buffBreak 迁移为破境丹药力层数 */
    pillStack: (d.pillStack !== undefined) ? d.pillStack : ((d.buffBreak||0) > 0 ? 1 : 0),
    breakStreak: d.breakStreak||0,
    autoEquipOn: d.autoEquipOn !== false,
    kills: d.kills||0,
    deaths: d.deaths||0,
    tab: d.tab||'cult',
    ended: !!d.ended,
    stat: Object.assign(blankStat(), d.stat||{}),
    encDay: d.encDay||0,
    encOpen: null,
    /* 功法：缺字段自动补默认（旧存档可直接读），非法键一律剔除 */
    gongfa: gfSanitizeS(d.gongfa),
    shopBook: (Array.isArray(d.shopBook) ? d.shopBook : [])
      .filter(k => GF_BY_KEY[k]).slice(0, 2)
  };
  while(S.equip.treasures.length < 3) S.equip.treasures.push(null);
  if(!S.logs.length) addLog('你重新睁开双眼，前尘如故。','sys');
  if(!S.shop.length) refreshShop(true);
  /* 旧存档没有藏经阁货架，补一批 */
  else if(!S.shopBook.length) S.shopBook = gfRollBook();
  /* 旧存档（坐骑系统之前）没有 shopMount 字段，补一头 */
  else if(d.shopMount === undefined){
    S.shopMount = rollMount(clamp(ri(0,1)+Math.floor(S.level/12), 0, 4), 0.10 + S.level/70);
  }
  clampVitals();
  return true;
}

function load(){
  try{
    let raw = localStorage.getItem(SAVE_KEY);
    if(!raw) raw = localStorage.getItem(SAVE_OLD);       /* 兼容旧版自动存档 */
    if(!raw) return false;
    return restore(JSON.parse(raw));
  }catch(e){ return false; }
}

/* -------- 存档码：导出 / 导入 -------- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function b64dec(txt){
  const bin = atob(String(txt).trim());
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function exportCode(){
  const pack = { s: saveData(), m: META };
  return 'XXLX1.' + b64enc(JSON.stringify(pack));
}
function importSave(text){
  try{
    const t = String(text||'').trim();
    if(!t){ toast('请先粘贴存档码'); return; }
    const body = t.indexOf('XXLX1.') === 0 ? t.slice(6) : t;
    const obj = JSON.parse(b64dec(body));
    const sd = obj.s ? obj.s : obj;
    if(!restore(sd)){ toast('存档码无效'); return; }
    if(obj.m) applyMeta(obj.m);
    closeModal();
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(saveData())); }catch(e){}
    addLog('一纸残卷自虚空中落下，其上正是你走过的路——旧日道途，重新展开。','epic');
    renderAll();
    toast('存档已导入');
  }catch(e){ toast('存档码无法解析'); }
}

function slotRow(label, it, key, idx){
  if(!it){
    return '<div class="slot"><span class="k">'+label+'</span><span class="v empty">— 空 —</span></div>';
  }
  const body = '<span class="v">'+ (isMount(it) ? mountLabel(it) : itemLabel(it)) +'</span>'
    + (busy()
        ? '<span class="r" style="opacity:.3">卸下</span>'
        : '<span class="r" onclick="unequip(\''+key+'\','+idx+')">卸下</span>'
          + '<span class="r sell" onclick="sellEquipped(\''+key+'\','+idx+')">售'+num(sellPrice(it))+'</span>');
  return '<div class="slot'+godCls(it.q)+'"><span class="k">'+label+'</span>'+body+'</div>';
}

function renderMount(){

  const cost = mountFeedCost(m);

    + '<div class="hint-mini">'+MOUNT_TIER_NAME[m.tier]+' · '+m.lv+' / '+MOUNT_MAX_LV+' 阶 · 战力 '+num(m.power)+'</div>'

    + '<button class="mbtn" style="padding:5px 12px;font-size:11.5px;letter-spacing:.08em" onclick="releaseMount()">放 生</button>'

}

/* --- 功法（左栏面板）：只做摘要，详情与操作都在「悟道录」弹层 --- */
function gfSlotRow(label, gf, lv, extra){
  if(!gf){
    return '<div class="slot"><span class="k">'+label+'</span><span class="v empty">— 空 —</span>'
      + '<span class="r" onclick="openGongfa()">习 法</span></div>';
  }
  const full = lv >= GF_MAX[gf.t];
  return '<div class="slot'+godCls(gf.t)+'"><span class="k">'+label+'</span>'
    + '<span class="v">'+qName(gf.n, gf.t)
    + '<span class="muted-sm">　'+lv+' / '+GF_MAX[gf.t]+' 重'+(full?' · 圆满':'')
    + (extra?' · '+extra:'')+'</span></span>'
    + '<span class="r" onclick="openGongfa()">改 修</span></div>';
}

function renderGongfa(){
  const box = $('gfBox');
  if(!box) return;
  const g = gfEnsure();
  let h = '';
  for(let i=0;i<GF_SLOT.passive;i++){
    const gf = GF_BY_KEY[g.passive[i]];
    h += gfSlotRow('被动'+(i+1), gf, gf ? gfLevel(gf.k) : 0);
  }
  for(let i=0;i<GF_SLOT.active;i++){
    const gf = GF_BY_KEY[g.active[i]];
    const prof = gf ? GF_SHU[gf.sk] : null;
    h += gfSlotRow('主动'+(i+1), gf, gf ? gfLevel(gf.k) : 0, prof ? prof.n : '');
  }
  const n = gfLearnedList().length;
  const b = gfBonus();
  const parts = [];
  if(b.cult) parts.push('修速 +'+b.cult+'%');
  if(b.atk) parts.push('攻 +'+b.atk+'%');
  if(b.hp) parts.push('血 +'+b.hp+'%');
  if(b.def) parts.push('防 +'+b.def+'%');
  if(b.luck) parts.push('气运 +'+b.luck);
  const tip = parts.length ? '被动合计：'+parts.join(' · ')
    : (n ? '被动槽尚未装心法，点「改 修」择一部运转。' : '尚未习得。秘境妖王与坊市藏经阁皆可求得功法。');
  h += '<div class="hint-mini">'+tip+'</div>';
  box.innerHTML = h;

  const tag = $('gfTag');
  if(tag) tag.textContent = '已 习 ' + n + ' / ' + GONGFA.length;
}

function renderPills(){
  const lock = busy();
  let h = '';
  for(const p of PILLS){
    const n = S.pills[p.name]||0;
    const off = !n || lock;
    const bonus = (p.name === '破境丹' && (S.pillStack||0) > 0)
      ? ' <span style="color:var(--zhu)">+'+pillBonus()+'%</span>' : '';

      + (off?'opacity:.4;':'') + '"'
      + (off ? '' : ' onclick="usePill(\''+p.name+'\')"')
      + ' title="'+p.desc+(lock?'（战斗中请在战斗面板用「服丹」）':'')+'">'
      + p.name + ' ×' + n + bonus + '</button>';
  }
  $('pillBox').innerHTML = h;
}

function renderBag(){
  const box = $('bagBox');
  $('bagCount').textContent = S.bag.length + ' / 40';
  if(!S.bag.length){ box.innerHTML = '<div class="empty-note">囊 中 空 空</div>'; return; }
  const lock = busy();
  let h = '';
  for(const it of S.bag){
    const label = isMount(it) ? mountLabel(it) : itemLabel(it);
    h += '<div class="bagrow2' + godCls(it.q) + (lock ? ' locked-row' : '') + '">'

    }else{
      h += '<div class="l2">'
        + '<button onclick="equipBag('+it.id+')">'+ (isMount(it) ? '骑 乘' : '装 备') +'</button>'
        + '<button class="sell-btn" onclick="sellBagItem('+it.id+')">售 '+num(sellPrice(it))+'</button>'
        + '<button onclick="dropItem('+it.id+')" style="opacity:.6">弃</button>'
        + '</div>';

function renderTabs(){
  const locked = !!(S.combat || S.dungeon);
  const tabs = [
    { k:'cult',   n:'修 炼' },
    { k:'hunt',   n:'妖 兽' },
    { k:'secret', n:'秘 境' },
    { k:'gear',   n:'装 备' },
    { k:'shop',   n:'坊 市' }
  ];
  let h = '';
  for(const t of tabs){
    const on = (!locked && S.tab === t.k) ? ' on' : '';
    const dis = locked ? ' dis' : '';
    h += '<div class="tab'+on+dis+'" onclick="'+(locked?'':'switchTab(\''+t.k+'\')')+'">'+t.n+'</div>';
  }
  $('tabs').innerHTML = h;
}

function switchTab(k){
  S.tab = k;
  renderTabs(); renderActions(); save();
}

function card(title, desc, cost, fn, opt){
  opt = opt || {};
  const cls = 'card' + (opt.lock?' lock':'') + (opt.hot?' hot':'') + (opt.danger?' danger':'')
    + (opt.q !== undefined ? godCls(opt.q) : '');
  const oc = (opt.lock || !fn) ? '' : ' onclick="'+fn+'"';
  return '<div class="'+cls+'"'+oc+'>'
    + '<div class="t">'+title+'</div>'
    + '<div class="d">'+desc+'</div>'
    + (cost ? '<div class="cost">'+cost+'</div>' : '')
    + '</div>';
}

function renderActions(){
  const p = $('actPanel');
  if(S.combat){ p.innerHTML = renderCombat(); return; }
  if(S.dungeon){ p.innerHTML = renderDungeon(); return; }
  p.innerHTML = ({
    cult:   actionsCult,
    hunt:   actionsHunt,
    secret: actionsSecret,
    gear:   actionsGear,
    shop:   actionsShop
  }[S.tab] || actionsCult)();
}

/* --- 战斗面板 --- */
function renderCombat(){
  const c = S.combat, m = c.m, st = stats();
  const hpPct = clamp(m.hp/m.hpMax*100,0,100);
  let h = '<div class="fbar" style="margin:-13px -14px 12px;border-radius:0">'
    + '<span class="fname">'+m.name+'</span>'
    + '<span class="ftrack"><span class="ffill" style="width:'+hpPct+'%"></span></span>'
    + '<span class="fnum">'+num(Math.max(0,m.hp))+' / '+num(m.hpMax)+'</span>'
    + '</div>';
  h += '<div class="tip">第 <b>'+c.turn+'</b> 回合 · 灵力 '+num(S.mp)+' / '+num(st.mpMax)
    + ' · 灵技需 '+num(Math.round(st.mpMax*0.15)+8)+' 灵力</div>';
  const myDmg  = Math.max(1, Math.round(st.atk - m.def*0.6));
  const foeDmg = Math.max(1, Math.round(m.atk - st.def*0.6));
  const myTurns  = Math.ceil(Math.max(0, m.hp) / myDmg);
  const foeTurns = Math.ceil(Math.max(1, S.hp) / foeDmg);
  h += '<div class="foe">'
    + '<span>我 攻 <b>'+num(st.atk)+'</b> · 防 <b>'+num(st.def)+'</b></span>'
    + '<span>敌 攻 <b>'+num(m.atk)+'</b> · 防 <b>'+num(m.def)+'</b></span>'
    + '<span>一击约 <b>'+num(myDmg)+'</b> · 需 <b>'+myTurns+'</b> 回合</span>'
    + '<span>敌伤约 <b>'+num(foeDmg)+'</b> · 可撑 <b>'+foeTurns+'</b> 回合</span>'
    + '<span class="'+(myTurns <= foeTurns ? 'up' : 'dn')+'">'
      + (myTurns <= foeTurns ? '我占上风' : '宜守宜走') + '</span>'
    + '</div>';
  /* 功法状态：护盾 / 虚空 / 冰封 / 灼烧 剩余回合 */
  const buffs = [];
  if(c.buff && c.buff.shield > 0) buffs.push('<span class="up">护体 '+Math.round(c.buff.shield*100)+'% · 余 '+c.buff.shieldDur+'</span>');
  if(c.buff && c.buff.dodge > 0) buffs.push('<span class="up">虚空 · 余 '+c.buff.dodgeDur+'</span>');
  if(c.debuff && c.debuff.freeze > 0) buffs.push('<span class="dn">冰封 · 余 '+c.debuff.freeze+'</span>');
  if(c.debuff && c.debuff.burn > 0) buffs.push('<span class="dn">灼烧 · 余 '+c.debuff.burn+'</span>');
  if(buffs.length){
    h += '<div class="foe" style="margin-bottom:10px">'+buffs.join('')+'</div>';
  }

  h += '<div class="actgrid">';
  h += card('挥 击','以手中法器直取要害，不耗灵力。','', "fightAttack()");
  h += card('灵 力 斩','催动灵力一击，伤害约 2.3 倍。','耗灵力 '+num(Math.round(st.mpMax*0.15)+8), "fightSkill()", S.mp < Math.round(st.mpMax*0.15)+8 ? {lock:true}:{});
  /* 识海中的主动功法（功法系统）：带冷却与附加效果 */
  const skills = gfActiveList();
  for(const sk of skills){
    const cd = (c.cd && c.cd[sk.key]) || 0;
    const mc = gfSkillMp(sk, st.mpMax);
    const canCast = cd === 0 && S.mp >= mc;
    const fx = gfFxText(sk.fx);
    const desc = '伤害 ×'+sk.mult + ((sk.hits||1) > 1 ? ' · '+sk.hits+' 段' : '') + (fx ? ' · '+fx : '');
    h += card('【'+sk.n+'】', desc,
      cd > 0 ? ('冷却中 · 余 '+cd+' 回合') : ('耗灵力 '+num(mc)),
      "castSkill('"+sk.key+"')",
      canCast ? {hot:true} : {lock:true});
  }
  if(!skills.length){
    h += card('未 备 术 法','在「功 法」中把主动功法备入识海，战斗中便多出可放之技。','主动槽 2 格', "openGongfa()", {});
  }
  h += card('御 守','架起护体灵光，本回合受伤减至三成，并回灵力。','', "fightAction('defend')");
  const hasPill = (S.pills['回春丹']||0) > 0;
  h += card('服 丹','服一枚回春丹，恢复气血 45%。', (S.pills['回春丹']||0)+' 枚 · 至多 3 次', "fightPill()", hasPill?{}:{lock:true});
  h += card('遁 走','有五成八的把握脱身。妖王当前则无从遁走。','', "fightAction('flee')", m.boss?{lock:true}:{});
  h += '</div>';
  return h;
}

/* --- 修炼 --- */
function actionsCult(){
  const st = stats();
  const need = expNeed(S.level);
  const atMax = S.level >= MAX_LV;
  const ready = S.exp >= need;
  const chain = atMax ? 0 : readyCount();
  const cost = 25 + S.level*6;
  let h = '<div class="actgrid">';

  if(atMax){
    if(ready){
      h += card('白 日 飞 升','凡世修行的尽头已至。九霄雷云为你聚拢，只待踏出最后一步。',
        '无 需 条 件', "doBreakthrough()", {hot:true});
    }
  }else if(ready){
    h += card('冲 击 境 界','修为圆满，尝试晋升至【'+realmAt(S.level+1).name+'】。',
      '成功率 ' + breakChance() + '%' + pillTip(), "doBreakthrough()", {hot:true});
    if(chain >= 2){
      h += card('连 续 突 破','气机已足，一次冲到尽处。每成一境修为便结转下去，失败即止。',
        '可连破 ' + chain + ' 境 · 首破 ' + breakChance() + '%', "doBreakthroughChain()", {hot:true});
    }
  }

  if(!atMax && (S.pills['破境丹']||0) > 0){
    const stack = S.pillStack||0;
    h += card('服 破 境 丹','药力随大境界增厚，每个境界皆可用；至多连服三枚叠加。',
      '丹田已蓄 ' + stack + ' 枚 · 本次 +' + pillBonus() + '%',
      "usePill('破境丹')", stack >= 3 ? {lock:true} : {});
  }

  h += card('打 坐 吐 纳','盘膝运转周天，凝聚天地灵气。回复少量气血灵力。','1 日 · 修为 +'+num(Math.floor(askExp(S.level)*(1+st.cult/100))), "actMeditate()", ready?{}:{hot:true});
  h += card('灵 石 修 炼','布下聚灵阵，以灵石催发磅礴灵气，约四倍于枯坐。','1 日 · '+num(cost)+' 灵石', "actStoneCultivate()", S.stones<cost?{lock:true}:{});
  h += card('闭 关 七 日','封洞苦修，所得丰厚，然心魔或顿悟难料。需气血灵力皆满九成。','7 日 · 修为 +'+num(Math.floor(need*4.2*(1+st.cult/100))), "actSeclusion()",
    (S.mp<st.mpMax*0.9||S.hp<st.hpMax*0.9)?{lock:true}:{});

  h += '</div>';

  h += '<div class="tip" style="margin-top:12px">'
    + '当前境界 <b>'+realmName()+'</b> · 距下一境还需修为 <b>'+num(Math.max(0,need-S.exp))+'</b>'
    + (ready && S.exp > need ? ' · <b>修为溢出 '+num(S.exp-need)+'</b>，突破后结转' : '')
    + ' · 修速加成 <b>+'+st.cult+'%</b>（法宝 · 坐骑 · 传承 · 功法）</div>';
  if((S.pillStack||0) > 0){
    h += '<div class="tip" style="font-size:11px">丹田中已蓄破境丹之力，本次突破 <b>+'+pillBonus()+'%</b>，成或败皆会耗尽。'
      + ((S.breakStreak||0) > 0 ? ' 连破已 '+S.breakStreak+' 境，气机浮动，成功率 -'+Math.min(12,S.breakStreak*3)+'%。' : '') + '</div>';
  }else if((S.breakStreak||0) > 0){
    h += '<div class="tip" style="font-size:11px">连破已 '+S.breakStreak+' 境，气机未稳，本次突破成功率 <b>-'+Math.min(12,S.breakStreak*3)+'%</b>。</div>';
  }
  return h;
}

    const m = S.shopMount;
    h += card(mountLabel(m),
      MOUNT_TIER_NAME[m.tier] + ' · 战力 '+num(m.power)+' · 遁速 +'+m.speed+'%',
      mountCost(m)+' 灵石', "buyMount()", { q:m.q, lock:S.stones<mountCost(m) });
  }else{
    h += card('栏 中 空 空','这一批灵兽已被买走，换货后或有新兽。','', '', {lock:true});

  h += '</div>';

  h += '<div class="tip" style="margin-top:14px">丹药铺 · 常备三味</div>';
  h += '<div class="actgrid">';
  for(const p of PILLS){
    if(p.craft) continue;                      /* 只能自炼的丹药不上架（如归元丹） */
    const pr = pillPrice(p);
    h += card(p.name, p.desc, pr+' 灵石', "buyPill('"+p.name+"')", S.stones<pr?{lock:true}:{});
  }
  h += '</div>';
  h += '<div class="actgrid" style="margin-top:10px">';
  h += card('换 一 批 货','支付 3 灵石，请掌柜重新取货。','3 灵石', "refreshShop(false)", S.stones<3?{lock:true}:{});

  h += '<div class="tip" style="margin-top:18px">藏 经 阁 · 功 法</div>';
  h += '<div class="actgrid">';
  const books = gfShopBook();
  if(!books.length){
    h += card('书 架 已 空','这一批功法已被你收去，换货后或有新卷。','', '', {lock:true});
  }
  for(let i=0;i<books.length;i++){
    const gf = GF_BY_KEY[books[i]];
    if(!gf) continue;
    const p = gfBookPrice(gf);
    h += card('《'+gf.n+'》', gfGrade(gf) + ' · ' + gfPerLvText(gf),
      p+' 灵石 · 买下即习得', "gfBuyBook("+i+")", { q:gf.t, lock:S.stones<p });
  }
  const learnedN = gfLearnedList().length;
  h += card('悟 道 录','心法一格、术法两格——习得多寡不等同于强弱，如何取舍才是关键。',
    '已习得 '+learnedN+' / '+GONGFA.length+' 部', "openGongfa()", {hot:true});
  h += '</div>';

  /* ---------- 丹房 · 炼丹 ---------- */
  h += renderPillSection();

  /* ---------- 器坊 · 炼器 ---------- */
  h += renderGearSection();

  /* ---------- 材料铺 ---------- */
  h += renderMatShopSection();

  /* ---------- 出售台 ---------- */
  h += '<div class="tip" style="margin-top:18px">出 售 台 · 以 器 易 石</div>';
  h += '<div class="filters"><span class="fl">类 型</span>';
  for(const t of SELL_TYPES){
    h += '<span class="chip'+(SELL.type===t.k?' on':'')+'" onclick="setSell(\''+t.k+'\',null)">'+t.n+'</span>';
  }
  h += '</div>';
  h += '<div class="filters"><span class="fl">品 质</span>';
  for(const q of SELL_Q){
    h += '<span class="chip'+(SELL.q===q.k?' on':'')+'" onclick="setSell(null,\''+q.k+'\')">'+q.n+'</span>';
  }
  h += '</div>';

  const list = S.bag.filter(matchSell);
  const tot = list.reduce((a,it)=>a+sellPrice(it), 0);
  h += '<div class="sellbox"><span class="sv">符合条件 <b>'+list.length+'</b> 件 · 可得 <b>'+num(tot)+'</b> 灵石</span>'
    + '<button class="mbtn" style="margin-left:auto;padding:6px 18px;font-size:12px;letter-spacing:.12em;'
      + (list.length?'':'opacity:.4;') + '"' + (list.length?' onclick="sellBatch()"':'') + '>全 部 售 出</button></div>';

  const q0 = S.bag.filter(x=>x.q===0);
  const q1 = S.bag.filter(x=>x.q<=1);
  h += '<div class="actgrid" style="margin-top:9px">';
  h += card('清 空 凡 品','一应凡品法器与坐骑尽数售出，只留可用之物。',
    q0.length ? '共 '+num(q0.reduce((a,it)=>a+sellPrice(it),0))+' 灵石' : '囊中并无凡品',
    "sellQuality(0)", q0.length?{}:{lock:true});
  h += card('清 空 凡 品 与 灵 品','连灵品一起处理，腾出囊中空位。',
    q1.length ? '共 '+num(q1.reduce((a,it)=>a+sellPrice(it),0))+' 灵石' : '囊中并无凡灵之物',
    "sellQuality(1)", q1.length?{}:{lock:true});
  h += '</div>';
  h += '<div class="tip" style="font-size:11px;margin-top:8px">出售价约为购入价的四成，坐骑亦在可售之列。'
    + '储物袋每行右侧的「售」可单件出手；若怕误售，可先在左栏「法器」中关闭自动换装。</div>';
  return h;
}

/* -------- 玉简（手动槽位） -------- */
function slotInfo(i){
  try{
    const raw = localStorage.getItem(slotKey(i));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveToSlot(i){
  try{
    localStorage.setItem(slotKey(i), JSON.stringify(saveData()));
    addLog('你将今世的一切封入第 '+(i+1)+' 枚玉简。','sys');
    after();
    openSavePanel();
  }catch(e){ toast('存档失败：本机存储不可用'); }
}
function clearSlot(i){
  try{ localStorage.removeItem(slotKey(i)); }catch(e){}
  toast('第 '+(i+1)+' 枚玉简已抹去');
  openSavePanel();
}
function loadFromSlot(i){
  const d = slotInfo(i);
  if(!d){ toast('此玉简空空如也'); return; }
  if(!restore(d)){ toast('玉简已损，无法读取'); return; }
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(saveData())); }catch(e){}
  closeModal();
  addLog('你以神识探入第 '+(i+1)+' 枚玉简，旧日的自己重新回到身上。','epic');
  renderAll();
  toast('已读取第 '+(i+1)+' 枚玉简');
}
function copyCode(){
  const el = $('saveCode');
  const code = exportCode();
  if(el) el.value = code;
  const done = () => toast('存档码已复制');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(done).catch(()=>{ if(el){ el.select(); document.execCommand('copy'); done(); } });
      return;
    }
  }catch(e){}
  if(el){ el.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选中'); } }
}
function importFile(){
  const el = $('impFile');
  if(!el) return;
  el.value = '';
  el.click();
}
function onImportFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = () => importSave(String(fr.result||''));
  fr.onerror = () => toast('文件读取失败');
  fr.readAsText(f);
}
function downloadSave(){
  const code = exportCode();
  const blob = new Blob([code], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '修仙存档-'+realmName()+'-第'+S.day+'日.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
function fmtTime(ts){
  try{
    const d = new Date(ts);
    const p = n => (n<10?'0':'')+n;
    return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){ return ''; }
}

function openSavePanel(){
  let h = '<div class="meta-note">进度每走一步都会自动存入本机。此处另有 <b>3 枚玉简</b>可手动封存；'
    + '存档亦可导出为存档码或文件，用于备份、换机或分享。<br>'
    + '当前：<b>'+realmName()+'</b> · 第 '+num(S.day)+' 日 · 战力 '+num(stats().power)
    + ' · 斩妖 '+num(S.kills)+' 头 · 轮回 '+META.rebirths+' 世</div>';

  for(let i=0;i<SLOT_N;i++){
    const d = slotInfo(i);
    const sd = d
      ? realmNameOf(d.level) + ' · 第 ' + num(d.day||0) + ' 日 · 灵石 ' + num(d.stones||0)
        + (d.kills ? ' · 斩妖 ' + num(d.kills) : '') + (d.t ? ' · ' + fmtTime(d.t) : '')
      : '空 白';
    h += '<div class="slotcard">'
      + '<div class="si"><div class="sn">玉简 '+(i+1)+'</div><div class="sd">'+sd+'</div></div>'
      + '<button class="sb" onclick="saveToSlot('+i+')">存 档</button>'
      + '<button class="sb'+(d?'':' dis')+'" onclick="'+ (d ? 'loadFromSlot('+i+')' : "toast('此玉简空空如也')") +'">读 档</button>'
      + '<button class="sb'+(d?'':' dis')+'" onclick="'+ (d ? 'clearSlot('+i+')' : "toast('此玉简空空如也')") +'">抹 除</button>'
      + '</div>';
  }

  h += '<div class="hrline"></div>';
  h += '<div class="meta-note" style="margin-bottom:6px">存 档 码（可另存为文本，或粘贴他人的存档码导入）</div>';
  h += '<textarea class="savecode" id="saveCode" readonly>'+exportCode()+'</textarea>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'
    + '<button class="sb" onclick="copyCode()">复 制 存 档 码</button>'
    + '<button class="sb" onclick="downloadSave()">下 载 为 文 件</button>'
    + '<button class="sb" onclick="importFile()">从 文 件 导 入</button>'
    + '</div>';
  h += '<textarea class="savecode" id="impCode" style="height:58px;margin-top:10px" placeholder="在此粘贴存档码…"></textarea>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'
    + '<button class="sb" onclick="importSave(document.getElementById(\'impCode\').value)">导 入 此 码</button>'
    + '<button class="sb" onclick="wipeConfirm()">抹 除 全 部 进 度</button>'
    + '</div>';

  showModal('存 档 · 玉 简', h, [{label:'关 闭', primary:true, fn:closeModal}], 'wide');
}

/* =========================================================
   功 法 · 悟 道 录（面板）
   ---------------------------------------------------------
   全部复用既有样式类（.heritage / .hr / .hn / .hl / .dots / .hb / .hd
   / .achsec / .meta-note / .pb-scroll），学院配色走 .gfs-* 类，不写死颜色
   注意：本文件的 UI 操作函数一律以 gfUi 开头，避免与 sys/gongfa.js 的
   顶层函数重名（构建后同处一个作用域，重名会让后者覆盖前者）
   ========================================================= */

function gfDots(lv, max){
  let s = '<span class="dots">';
  for(let i = 0; i < max; i++) s += '<i class="' + (i < lv ? 'f' : '') + '"></i>';
  return s + '</span>';
}
function gfSchoolTag(gf){
  const sc = gfSchoolOf(gf);
  return '<span class="gfs gfs-' + gfSchoolKey(gf) + '">' + sc.n + '</span>';
}

/* 单行：已习得的可装/卸与参悟；未习得的只作图鉴并提示来路 */
function gfRow(gf, owned){
  const lv = owned ? gfLevel(gf.k) : 0;
  const max = GF_MAX[gf.t];
  const slotInfo = owned ? gfSlotOf(gf.k) : { idx: -1 };
  const on = slotInfo.idx >= 0;
  const full = lv >= max;
  const cost = gfCost(gf.k), ce = gfExpCost(gf.k);
  const short = owned && (S.stones < cost || S.exp < ce);
  const isPas = gf.kind === 'xin';
  const profName = isPas ? GF_XIN[gf.p].n : GF_SHU[gf.sk].n;

  let acts = '';
  if(owned){
    acts = '<span style="margin-left:auto;display:flex;gap:6px;flex:0 0 auto">'
      + '<button class="hb" style="margin-left:0;padding:4px 10px" onclick="gfUiToggle(\'' + gf.k + '\')">'
        + (on ? '卸 下' : (isPas ? '装 被 动' : '装 主 动')) + '</button>'
      + (full
          ? '<button class="hb dis" style="margin-left:0;padding:4px 10px">已 圆 满</button>'
          : '<button class="hb' + (short ? ' dis' : '') + '" style="margin-left:0;padding:4px 10px" onclick="'
            + (short ? "toast('灵石或修为不足')" : "gfUiUp('" + gf.k + "')") + '">参 悟 · ' + num(cost) + '</button>')
      + '</span>';
  }

  return '<div class="heritage' + godCls(gf.t) + (owned ? '' : ' off') + '">'
    + '<div class="hr">'
    + '<span class="hn">' + qName(gf.n, gf.t) + '</span>'
    + gfSchoolTag(gf)
    + '<span class="hl">' + (owned ? lv + ' / ' + max + ' 重' : '第 ' + (gf.seg + 1) + ' 段') + '</span>'
    + (owned ? gfDots(lv, max) : '')
    + acts
    + '</div>'
    + '<div class="hd">' + gfGrade(gf) + ' · ' + profName + ' · '
      + (owned ? gfEffectText(gf, lv) : '尚未习得')
      + (owned && on ? '　<span class="gold">已在' + (isPas ? '被动' : '主动') + '槽 ' + (slotInfo.idx + 1) + '</span>' : '')
      + (owned && !full ? '　参悟需 <b>' + num(cost) + '</b> 灵石 + <b>' + num(ce) + '</b> 修为' : '')
      + (owned ? '' : '　秘境妖王或坊市藏经阁可得')
    + '</div>'
    + '<div class="hd" style="opacity:.72">' + gf.d + '</div>'
    + '<div class="hd" style="opacity:.62">　' + gfPerLvText(gf) + '</div>'
    + '</div>';
}

/* 槽位概览行 */
function gfSlotLine(kind, idx){
  const arr = kind === 'xin' ? S.gongfa.passive : S.gongfa.active;
  const key = arr[idx];
  const gf = GF_BY_KEY[key];
  const label = (kind === 'xin' ? '被 动 ' : '主 动 ') + (idx + 1);
  const sk = gf && gf.kind === 'shu' ? GF_SHU[gf.sk] : null;
  return '<div class="hr" style="padding:4px 0">'
    + '<span class="hl" style="flex:0 0 52px">' + label + '</span>'
    + (gf
        ? '<span class="hn" style="font-size:12.5px">' + qName(gf.n, gf.t)
          + '<span class="muted-sm">　' + gfLevel(gf.k) + ' 重' + (sk ? ' · ' + sk.n + '（冷却 ' + sk.cd + '）' : '') + '</span></span>'
          + '<span style="margin-left:auto"><button class="hb" style="margin-left:0;padding:3px 9px" onclick="gfUiOff(\'' + kind + '\',' + idx + ')">卸 下</button></span>'
        : '<span class="hl">— 空 —</span>')
    + '</div>';
}

function openGongfa(){
  const learned = gfLearnedList();
  const cur = gfSeg();

  let h = '<div class="meta-note">'
    + '功法分 <b>被动</b>（心法）与 <b>主动</b>（术法）二类。被动只可运转 <b>' + GF_SLOT.passive + ' 部</b>，'
    + '主动只可备于识海 <b>' + GF_SLOT.active + ' 式</b>——习得多寡不等同于强弱，<b>如何取舍才是关键</b>。<br>'
    + '主动功法带<b>冷却</b>与附加效果（护体 / 虚空 / 冰封 / 灼烧 / 吸血 / 破防 / 反噬），'
    + '战斗中于「灵 力 斩」之外另出此二式。<br>'
    + '已习得的功法<b>刻入道基、轮回不灭</b>；重数与装备则归本局，须重新参悟（同时耗灵石与修为）。<br>'
    + '来路：<b>秘境妖王</b>必有所遗、坊市<b>藏经阁</b>可购。当前境界段 <b>' + GF_SEG_NAME[cur] + '</b>，'
    + '已习得 <b>' + learned.length + '</b> / ' + GONGFA.length + ' 部。'
    + '</div>';

  h += '<div class="heritage">';
  for(let i = 0; i < GF_SLOT.passive; i++) h += gfSlotLine('xin', i);
  for(let i = 0; i < GF_SLOT.active; i++) h += gfSlotLine('shu', i);
  h += '<div class="hd" style="margin-top:4px">被动提供属性 / 修速 / 突破率 / 气运；主动提供战斗技能与效果。'
    + '<span style="margin-left:6px"><button class="hb" style="margin-left:0;padding:3px 9px" onclick="gfUiAllOff()">尽 数 卸 下</button></span></div>';
  h += '</div>';

  h += '<div class="pb-scroll">';

  const owned = GONGFA.filter(g => gfLearned(g.k)).sort((a, b) => b.seg - a.seg || b.t - a.t);
  h += '<div class="achsec" style="color:var(--zhu-d)">已 习 得 · ' + owned.length + '</div>';
  if(!owned.length){
    h += '<div class="meta-note" style="margin-bottom:6px">尚无一部在身。秘境妖王与坊市藏经阁，是功法唯二的来路。</div>';
  }
  for(const gf of owned) h += gfRow(gf, true);

  const rest = GONGFA.filter(g => !gfLearned(g.k));
  h += '<div class="achsec" style="color:var(--ink3)">未 习 得 · ' + rest.length + '</div>';
  for(const gf of rest) h += gfRow(gf, false);

  h += '</div>';

  showModal('功 法 · 悟 道 录', h, [{ label: '关 闭', primary: true, fn: closeModal }], 'wide');
}

/* ---------- UI 操作（gfUi 前缀，避免与 sys 层重名） ---------- */
function gfUiToggle(key){
  const r = gfToggleEquip(key);
  if(r === 'full'){ gfUiPick(key); return; }
  openGongfa();
}
function gfUiUp(key){
  gfUpgrade(key);
  openGongfa();
}
function gfUiOff(kind, idx){
  gfUnequipAt(kind, idx);
  openGongfa();
}
function gfUiAllOff(){
  gfAllOff();
  openGongfa();
}
function gfUiSet(key, idx){
  const gf = GF_BY_KEY[key];
  if(!gf) return;
  if(gfEquipAt(key, idx)) toast('已装入' + (gf.kind === 'xin' ? '被动' : '主动') + '槽 ' + (idx + 1));
  openGongfa();

/* 槽满时让玩家选一格替换 */
function gfUiPick(key){
  const gf = GF_BY_KEY[key];
  if(!gf) return;
  const isPas = gf.kind === 'xin';
  const arr = isPas ? S.gongfa.passive : S.gongfa.active;
  let h = '<div class="meta-note">' + (isPas ? '被动' : '主动') + '槽已满。选择一格换上【' + gf.n + '】——被换下的功法<b>不会丢失</b>，仍在已习得之列。</div>';
  h += '<div class="heritage">';
  for(let i = 0; i < arr.length; i++){
    const old = GF_BY_KEY[arr[i]];
    h += '<div class="hr" style="padding:6px 0">'
      + '<span class="hn">第 ' + (i + 1) + ' 格</span>'
      + '<span class="hl">' + (old ? old.n + ' · ' + gfLevel(old.k) + ' 重' : '空') + '</span>'
      + '<span style="margin-left:auto"><button class="hb" style="margin-left:0;padding:4px 12px" onclick="gfUiSet(\'' + key + '\',' + i + ')">换 上</button></span>'
      + '</div>';
  }
  h += '</div>';
  showModal('选 择 槽 位', h, [{ label: '取 消', fn: () => openGongfa() }], 'wide');
}
