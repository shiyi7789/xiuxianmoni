<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修仙模拟器 · 文字版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;height:100%}

  /* =========================================================
     设计令牌（Design Tokens）
     所有颜色 / 字号 / 节律集中在此，改主题不需要动具体规则
     ========================================================= */
  :root{
    /* —— 纸墨（中性） —— */
    --ink:#2b2620;            /* 主文字   对比 ~11:1 */
    --ink2:#4a4238;           /* 次级文字 对比 ~7.4:1 */
    --ink3:#6f6659;           /* 弱化文字 对比 ~5.2:1（原 #7d7365 不足 AA，已压暗） */
    --ink4:#9c9280;           /* 提示 / 占位（大字或装饰用） */
    --paper:#efe7d8;
    --paper2:#f7f2e7;
    --paper3:#e6dcc8;
    /* —— 表面层（叠加在纸上的"抬起"层次） —— */
    --surface:rgba(255, 253, 247, .78);
    --surface2:rgba(246, 240, 228, .72);
    --raise:rgba(255, 255, 255, .48);
    --raise2:rgba(255, 255, 255, .62);
    --raise3:rgba(240, 232, 216, .50);
    --track:rgba(58, 50, 38, .12);
    --veil:rgba(43, 38, 32, .42);
    /* —— 描边 —— */
    --line:rgba(58,50,38,.20);
    --line2:rgba(58,50,38,.34);
    /* —— 主题色 —— */
    --zhu:#9e2b25;   --zhu2:#c0453a;  --zhu-d:#8c1f1a;   /* 朱砂 */
    --qing:#2f6b63;                                    /* 青 */
    --jin:#8f6c20;                                     /* 金（压暗以过对比度） */
    --zi:#5b4a9e;                                      /* 紫 */
    --warn:#a8481a;
    --on-accent:#fdf6ee;                               /* 朱砂底上的文字 */
    /* —— 品质（凡灵宝仙神） —— */
    --q0:#8a8378; --q1:#2f7d63; --q2:#5b4a9e; --q3:#a86a12; --q4:#9e2b25;
    /* —— 血条 / 灵力条 —— */
    --hp1:#8e2f2a; --hp2:#c4645c;
    --mp1:#22564f; --mp2:#4b9c8f;
    /* —— 背景肌理 —— */
    --bg-glow:#fbf7ee; --bg-glow2:#e7dcc6;
    --fiber:rgba(120,100,70,.030); --fiber2:rgba(120,100,70,.024);
    /* —— 特殊表面 —— */
    --modal-bg:linear-gradient(180deg,#fdf9f0,#f3ecdd);
    --god-bg:linear-gradient(180deg,rgba(255,250,236,.72),rgba(250,238,208,.55));
    --shen-bg:linear-gradient(180deg,rgba(255,246,243,.78),rgba(252,231,224,.55));
    --achpop-bg:linear-gradient(180deg,#fffaf0,#f4e3bf);
    --sheen:rgba(255, 243, 205, .85);
    --sheen2:rgba(255, 196, 178, .85);
    --glow:rgba(80, 62, 38, .06);
    --toast-bg:rgba(43, 38, 32, .92); --toast-fg:#f6efe2;
    --flow3:linear-gradient(100deg,#8a5510 0%,#f7e3b0 16%,#b0701c 32%,#8a5510 50%,#fff2cf 66%,#c98a2a 82%,#8a5510 100%);
    --flow4:linear-gradient(100deg,#6f1a16 0%,#ffd0c4 14%,#9e2b25 30%,#5d1410 46%,#ffe9b8 62%,#c0453a 80%,#6f1a16 100%);
    /* —— 字号（流体，随视口自适应） —— */
    --fs-xs:11px;
    --fs-sm:12px;
    --fs-sm2:12.5px;
    --fs-base:14px;
    --fs-md:15px;
    --fs-lg:clamp(16px,4.4vw,19px);
    --fs-xl:clamp(19px,5.6vw,23px);
    /* —— 节律与圆角 —— */
    --gap:12px;
    --r-sm:3px;
    --r-md:6px;
    --r-lg:14px;
    --tap:44px;               /* 移动端最小触摸目标 */
    /* —— 字体族 —— */
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong","SimSun",serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    --navh:56px;              /* 移动端底部导航高度 */
  }

  /* ============ 夜间 · 玄墨 ============ */
  html[data-theme="dark"]{
    --ink:#ece4d6;
    --ink2:#c9c0ae;
    --ink3:#9a9282;
    --ink4:#6e6759;
    --paper:#14120f;
    --paper2:#221e19;
    --paper3:#2b2620;
    --surface:rgba(38, 34, 28, .72);
    --surface2:rgba(28, 25, 20, .66);
    --raise:rgba(255, 255, 255, .055);
    --raise2:rgba(255, 255, 255, .085);
    --raise3:rgba(255, 255, 255, .028);
    --track:rgba(0, 0, 0, .40);
    --veil:rgba(0, 0, 0, .62);
    --line:rgba(236, 228, 214, .14);
    --line2:rgba(236, 228, 214, .26);
    --zhu:#d9543f;   --zhu2:#e8705a;  --zhu-d:#c8452f;
    --qing:#4fb3a0;
    --jin:#d9a441;
    --zi:#a394e8;
    --warn:#e08a4c;
    --on-accent:#1a1512;
    --q0:#a49c8e; --q1:#54b795; --q2:#9a8ce8; --q3:#e0a531; --q4:#e2664c;
    --hp1:#b8483c; --hp2:#e0766a;
    --mp1:#2f7d74; --mp2:#63c4b3;
    --bg-glow:#1e1a15; --bg-glow2:#191612;
    --fiber:rgba(255, 240, 210, .020); --fiber2:rgba(255, 240, 210, .015);
    --modal-bg:linear-gradient(180deg,#241f19,#1b1814);
    --god-bg:linear-gradient(180deg,rgba(217, 164, 65, .15),rgba(217, 164, 65, .06));
    --shen-bg:linear-gradient(180deg,rgba(226, 102, 76, .17),rgba(226, 102, 76, .07));
    --achpop-bg:linear-gradient(180deg,#33291b,#241f16);
    --sheen:rgba(255, 215, 130, .40);
    --sheen2:rgba(255, 150, 120, .40);
    --glow:rgba(0, 0, 0, .5);
    --toast-bg:rgba(236, 228, 214, .95); --toast-fg:#1c1915;
    --flow3:linear-gradient(100deg,#a06a12 0%,#ffeec4 16%,#d9a441 32%,#a06a12 50%,#fff8e2 66%,#e8bb5c 82%,#a06a12 100%);
    --flow4:linear-gradient(100deg,#b8402a 0%,#ffdfd4 14%,#e2664c 30%,#a83a26 46%,#fff3d2 62%,#e8705a 80%,#b8402a 100%);
  }

  body{
    min-height:100%;
    background:
      radial-gradient(120% 90% at 12% 0%, var(--bg-glow) 0%, transparent 55%),
      radial-gradient(100% 80% at 100% 100%, var(--bg-glow2) 0%, transparent 60%),
      repeating-linear-gradient(0deg, var(--fiber) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, var(--fiber2) 0 1px, transparent 1px 4px),
      var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:var(--fs-base);line-height:1.6;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding:14px;
    transition:background-color .25s,color .25s;
  }
  .serif{font-family:var(--serif)}
  /* 数字统一等宽，跳动时不抖动 */
  b,.num,.ts b,.grid2 b,.bar .lab em,.cost,.pr,.pw{font-variant-numeric:tabular-nums}

  .wrap{
    max-width:1320px;margin:0 auto;
    height:calc(100vh - 28px);
    height:calc(100dvh - 28px);   /* 移动端浏览器动态视口 */
    display:flex;flex-direction:column;gap:var(--gap);
  }

  /* ---------- 顶栏 ---------- */
  .top{
    flex:0 0 auto;
    display:flex;align-items:center;gap:16px;
    padding:12px 18px;
    background:linear-gradient(180deg,var(--paper2),var(--paper));
    border:1px solid var(--line2);
    border-radius:3px;
    box-shadow:0 1px 0 var(--raise2) inset,0 2px 10px var(--glow);
    position:relative;
  }
  .top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--zhu),transparent);opacity:.45}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:19px;letter-spacing:.34em;font-weight:600;color:var(--ink)}
  .brand span{font-size:11px;color:var(--ink3);letter-spacing:.22em}
  .top-stats{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .ts{display:flex;flex-direction:column;line-height:1.25}
  .ts b{font-size:14px;font-weight:600;letter-spacing:.04em}
  .ts i{font-style:normal;font-size:10.5px;color:var(--ink3);letter-spacing:.2em}
  .ts.realm b{color:var(--zhu)}

  .btn-mini{
    font-size:11.5px;padding:5px 11px;border:1px solid var(--line2);border-radius:2px;
    background:var(--raise);color:var(--ink2);cursor:pointer;letter-spacing:.1em;
  }
  .btn-mini:hover{border-color:var(--zhu);color:var(--zhu);background:#fff}

  /* ---------- 主体 ---------- */
  .main{flex:1 1 auto;display:grid;grid-template-columns:330px 1fr;gap:12px;min-height:0}

  .panel{
    background:linear-gradient(180deg,var(--surface),var(--surface2));
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:0 1px 0 var(--raise2) inset;
  }
  .ph{
    display:flex;align-items:center;gap:8px;
    padding:8px 12px;border-bottom:1px solid var(--line);
    font-size:12px;letter-spacing:.24em;color:var(--ink3);
  }
  .ph::before{content:"";width:3px;height:12px;background:var(--zhu);opacity:.8;border-radius:1px}
  .pb{padding:12px}

  /* 左栏 */
  .left{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;padding-right:2px}
  .left::-webkit-scrollbar{width:7px}
  .left::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

  .bar{margin-bottom:9px}
  .bar .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-bottom:3px;letter-spacing:.06em}
  .bar .lab em{font-style:normal;color:var(--ink2)}
  .track{height:7px;background:var(--track);border-radius:4px;overflow:hidden}
  .fill{height:100%;border-radius:4px;transition:width .35s ease}
  .f-exp{background:linear-gradient(90deg,var(--zhu-d),var(--zhu2))}
  .f-hp{background:linear-gradient(90deg,var(--hp1),var(--hp2))}
  .f-mp{background:linear-gradient(90deg,var(--mp1),var(--mp2))}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px}
  .grid2 div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:3px 0}
  .grid2 span{color:var(--ink3);font-size:11.5px}
  .grid2 b{font-weight:600;color:var(--ink2)}

  /* 装备位 */
  .slot{
    display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:5px;
    border:1px solid var(--line);border-radius:2px;background:var(--raise);
    font-size:12.5px;
  }
  .slot .k{flex:0 0 52px;color:var(--ink3);font-size:11.5px;letter-spacing:.06em}
  .slot .v{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .v.empty{color:var(--ink4)}
  .slot .q{font-size:10.5px;padding:1px 5px;border-radius:2px;border:1px solid currentColor;opacity:.9;flex:0 0 auto}
  .slot .r{flex:0 0 auto;font-size:10.5px;color:var(--ink3);cursor:pointer;border-bottom:1px dotted var(--ink3);opacity:.75}
  .slot .r:hover{color:var(--zhu);border-color:var(--zhu);opacity:1}

  .empty-note{font-size:12px;color:var(--ink4);text-align:center;padding:10px 0;letter-spacing:.1em}
  .hint-mini{font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.6;letter-spacing:.02em}
  .empty-row .slot{margin-bottom:0}

  /* 右栏 */
  .right{display:flex;flex-direction:column;gap:12px;min-height:0}

  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 4px;flex:0 0 auto}
  .tab{
    padding:9px 20px 8px;font-size:13px;letter-spacing:.22em;color:var(--ink3);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;position:relative;
  }
  .tab:hover{color:var(--ink2)}
  .tab.on{color:var(--zhu);border-color:var(--zhu);font-weight:600}
  .tab.dis{opacity:.35;cursor:not-allowed}

  .actwrap{flex:0 0 auto;padding:13px 14px}
  .actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:9px}
  .card{
    text-align:left;padding:10px 12px;border:1px solid var(--line2);border-radius:3px;
    background:linear-gradient(180deg,var(--raise2),var(--raise3));
    cursor:pointer;transition:.14s;position:relative;overflow:hidden;
  }
  .card:hover{border-color:var(--zhu);background:#fff;transform:translateY(-1px);box-shadow:0 3px 10px rgba(120,90,60,.10)}
  .card:active{transform:translateY(0)}
  .card.lock{opacity:.42;cursor:not-allowed}
  .card.lock:hover{border-color:var(--line2);transform:none;background:linear-gradient(180deg,var(--raise2),var(--raise3));box-shadow:none}
  .card .t{font-size:13.5px;font-weight:600;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
  .card .d{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
  .card .cost{font-size:11px;color:var(--jin);margin-top:4px;letter-spacing:.04em}
  .card.hot{border-color:var(--zhu);background:linear-gradient(180deg,#fff8f5,#fdeee9)}
  .card.danger{border-color:rgba(158,43,37,.5)}
  .card.danger:hover{border-color:var(--zhu)}
  .tip{font-size:11.5px;color:var(--ink3);margin-bottom:9px;letter-spacing:.06em;line-height:1.65}
  .tip b{color:var(--zhu);font-weight:600}

  /* 日志 */
  .logpanel{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .log{
    flex:1 1 auto;overflow-y:auto;padding:12px 16px;
    font-size:13px;line-height:1.85;
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  }
  .log::-webkit-scrollbar{width:7px}
  .log::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  .log p{margin:0 0 5px;padding-left:11px;position:relative;animation:fadein .28s ease}
  .log p::before{content:"";position:absolute;left:0;top:.72em;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.45}
  @keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .l-sys{color:var(--ink3);font-size:12.5px}
  .l-act{color:var(--ink2)}
  .l-gain{color:var(--qing)}
  .l-dmg{color:var(--zhu)}
  .l-warn{color:var(--warn)}
  .l-epic{color:var(--zhu-d);font-weight:600;letter-spacing:.04em}
  .l-item{color:var(--jin)}
  .l-dim{color:var(--ink3);font-size:12.5px}
  .sep{text-align:center;color:var(--ink4);font-size:11px;letter-spacing:.5em;margin:8px 0}

  /* 战斗条 */
  .fbar{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:rgba(158,43,37,.045)}
  .fbar .fname{font-size:13.5px;font-weight:600;letter-spacing:.1em;color:var(--zhu)}
  .fbar .ftrack{flex:1 1 auto;height:9px;background:var(--track);border-radius:5px;overflow:hidden}
  .fbar .ffill{height:100%;background:linear-gradient(90deg,var(--zhu-d),var(--zhu2));transition:width .3s}
  .fbar .fnum{font-size:11.5px;color:var(--ink3);flex:0 0 auto}

  /* 居中弹层 */
  .mask{position:fixed;inset:0;background:var(--veil);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal{
    max-width:560px;width:100%;background:var(--modal-bg);
    border:1px solid var(--line2);border-radius:4px;padding:26px 30px;
    box-shadow:0 20px 60px rgba(40,30,20,.3);animation:pop .3s ease;
  }
  @keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
  .modal h2{font-size:22px;letter-spacing:.3em;color:var(--zhu);margin-bottom:14px;text-align:center}
  .modal .txt{font-size:13.5px;line-height:2;color:var(--ink2)}
  .modal .txt b{color:var(--zhu)}
  .modal .btns{margin-top:20px;display:flex;gap:10px;justify-content:center}
  .mbtn{padding:9px 26px;border:1px solid var(--line2);background:var(--raise2);color:var(--ink2);
    border-radius:2px;cursor:pointer;font-size:13px;letter-spacing:.2em}
  .mbtn:hover{border-color:var(--zhu);color:var(--zhu);background:#fff}
  .mbtn.primary{background:var(--zhu);border-color:var(--zhu);color:var(--on-accent)}
  .mbtn.primary:hover{background:var(--zhu-d);color:#fff}

  .toast{
    position:fixed;left:50%;top:22px;transform:translateX(-50%);
    background:var(--toast-bg);color:var(--toast-fg);padding:9px 22px;border-radius:2px;
    font-size:13px;letter-spacing:.12em;z-index:99;pointer-events:none;
    animation:tin .25s ease;box-shadow:0 6px 24px rgba(0,0,0,.24)
  }
  @keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ---------- 品阶徽章（全局） ---------- */
  .q{font-size:10.5px;padding:1px 5px;border-radius:2px;border:1px solid currentColor;opacity:.9}

  /* ---------- 出售台 ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 9px}
  .filters .fl{font-size:11px;color:var(--ink3);letter-spacing:.14em;margin-right:2px}
  .chip{
    font-size:11.5px;padding:4px 10px;border:1px solid var(--line2);border-radius:2px;
    background:var(--raise);color:var(--ink2);cursor:pointer;letter-spacing:.06em;
  }
  .chip:hover{border-color:var(--zhu);color:var(--zhu)}
  .chip.on{background:var(--zhu);border-color:var(--zhu);color:var(--on-accent)}
  .sellbox{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;margin-top:6px;
    border:1px solid var(--line2);border-radius:3px;background:var(--raise);
  }
  .sellbox .sv{font-size:12.5px;color:var(--ink2)}
  .sellbox .sv b{color:var(--jin)}
  .slot .r.sell{color:var(--jin);border-color:var(--jin)}
  .slot .r.sell:hover{color:var(--zhu);border-color:var(--zhu)}
  .locked-row{opacity:.42;pointer-events:none;filter:grayscale(.3)}

  /* ---------- 仙品 / 神品 流光 ---------- */
  @keyframes flowmove{0%{background-position:0% 50%}100%{background-position:220% 50%}}
  @keyframes gl3{0%,100%{filter:drop-shadow(0 0 1px rgba(246,223,168,.45))}50%{filter:drop-shadow(0 0 6px rgba(246,223,168,.92))}}
  @keyframes gl4{0%,100%{filter:drop-shadow(0 0 1px rgba(255,170,150,.5))}50%{filter:drop-shadow(0 0 7px rgba(255,138,108,.95))}}
  @keyframes sheen{0%{left:-48%}62%{left:106%}100%{left:106%}}
  .flow{
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;font-weight:600;
    animation:flowmove 2.6s linear infinite, gl3 1.9s ease-in-out infinite;
  }
  .flow.q3{background-image:var(--flow3)}
  .flow.q4{
    background-image:var(--flow4);
    animation:flowmove 2.1s linear infinite, gl4 1.5s ease-in-out infinite;
  }
  .god,.shen{position:relative;overflow:hidden}
  .god{border-color:rgba(176,112,28,.5)!important;background:var(--god-bg)!important}
  .shen{border-color:rgba(158,43,37,.55)!important;background:var(--shen-bg)!important}
  .god::after,.shen::after{
    content:"";position:absolute;top:-1px;bottom:-1px;width:42%;left:-48%;pointer-events:none;
    background:linear-gradient(100deg,transparent,var(--sheen),transparent);
    animation:sheen 2.9s ease-in-out infinite;
  }
  .shen::after{background:linear-gradient(100deg,transparent,var(--sheen2),transparent);animation-duration:2.3s}

  /* ---------- 传承 / 存档面板 ---------- */
  .heritage{border-top:1px dotted var(--line);padding:10px 0}
  .heritage:first-of-type{border-top:0}
  .heritage .hr{display:flex;align-items:center;gap:8px}
  .heritage .hn{font-size:13.5px;font-weight:600;color:var(--ink)}
  .heritage .hl{font-size:11px;color:var(--ink3);letter-spacing:.06em}
  .heritage .hd{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6}
  .heritage .hb{margin-left:auto;font-size:11.5px;padding:4px 12px;border:1px solid var(--line2);border-radius:2px;background:var(--raise);color:var(--ink2);cursor:pointer;letter-spacing:.08em;flex:0 0 auto}
  .heritage .hb:hover{border-color:var(--zhu);color:var(--zhu)}

  /* ---------- 成就解锁横幅 ---------- */

  .achpop .ak{font-size:10.5px;letter-spacing:.34em;color:#a07a2c}
  .achpop .an{font-size:14.5px;font-weight:600;color:#7d1f1a;letter-spacing:.06em}
  .achpop .ab{font-size:11.5px;color:#8a6a3a;letter-spacing:.03em}

  /* ---------- 成就面板 ---------- */
  .achhd{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .achbar{flex:1 1 auto;height:8px;background:var(--track);border-radius:5px;overflow:hidden}
  .achbar i{display:block;height:100%;background:linear-gradient(90deg,var(--jin),var(--zhu2));border-radius:5px;transition:width .4s}
  .achsec{font-size:11.5px;letter-spacing:.3em;color:var(--ink3);margin:15px 0 8px;display:flex;align-items:center;gap:9px}
  .achsec::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
  .achg{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:7px}
  .ach{padding:9px 11px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.34);position:relative;overflow:hidden}
  .ach .ant{font-size:12.5px;font-weight:600;color:var(--ink4);display:flex;align-items:center;gap:6px;padding-right:34px}
  .ach .ad{font-size:11px;color:var(--ink4);margin-top:3px;line-height:1.5}
  .ach .ab2{font-size:10.5px;color:var(--ink4);margin-top:4px}
  .ach .tier{font-size:9.5px;padding:1px 5px;border-radius:2px;border:1px solid currentColor;flex:0 0 auto}
  .ach .tick{position:absolute;right:9px;top:9px;font-size:10px;color:#2f6b63;letter-spacing:.05em}
  .ach.got{background:linear-gradient(180deg,rgba(255,252,244,.92),rgba(250,240,220,.72));border-color:var(--line2)}
  .ach.got .ant{color:var(--ink)}
  .ach.got .ad{color:var(--ink3)}
  .ach.got .ab2{color:var(--jin)}

  /* ---------- 奇遇 ---------- */
  .encintro{
    font-size:13.5px;line-height:2;color:var(--ink2);margin-bottom:15px;

  .encopts{display:grid;gap:9px}
  .encopt{

  .encopt .ed{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6}

  /* ---------- 储物袋两行式 ---------- */

  /* ---------- 战斗敌情 / 秘境进度 ---------- */
  .foe{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-bottom:10px}
  .foe span{background:var(--raise);border:1px solid var(--line);border-radius:2px;padding:2px 9px}
  .foe b{color:var(--ink2)}
  .foe .up{color:var(--zhu-d);font-weight:600}
  .foe .dn{color:#2f6b63;font-weight:600}
  .dtrack{height:6px;background:var(--track);border-radius:4px;overflow:hidden;margin:8px 0 2px}
  .dtrack i{display:block;height:100%;background:linear-gradient(90deg,var(--mp1),var(--mp2));border-radius:4px;transition:width .3s}

  /* ---------- 日志新类型 ---------- */

  /* =========================================================

  .jade{color:var(--qing)}
  .warnc{color:var(--warn)}
  .zhu{color:var(--zhu)}
  .tier-tag{font-size:11px;color:var(--ink3);font-weight:400}
  .sell-btn{color:var(--jin);border-color:var(--jin)}

  .qc1{color:var(--q1)}
  .qc2{color:var(--q2)}
  .qc3{color:var(--q3)}
  .qc4{color:var(--q4)}

  /* =========================================================
     响应式 · 移动优先
     桌面（≥821px）双栏；移动（≤820px）单栏 + 底部导航 + 底部抽屉
     ========================================================= */
  .only-m{display:none!important}
  .util-panel{display:none}

    position:fixed;inset:0;background:var(--veil);z-index:58;
    opacity:0;pointer-events:none;transition:opacity .26s;
  }
  body.sheet-on #veil{opacity:1;pointer-events:auto}

  @media (max-width:820px){
    :root{--gap:10px;--navh:58px}

    /* ---- 顶栏：粘性 · 紧凑 · 统计可横向滑动 ---- */
    .top{
      position:sticky;top:0;z-index:30;gap:8px;

      background:var(--paper);backdrop-filter:saturate(1.2) blur(10px);
    }
    .top::after{display:none}
    .brand{gap:0;flex:0 0 auto}
    .brand h1{font-size:15px;letter-spacing:.18em}
    .brand span{display:none}
    .top-stats{
      flex:1 1 auto;gap:0;overflow-x:auto;scrollbar-width:none;
      -webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 88%,transparent);
    }
    .top-stats::-webkit-scrollbar{display:none}
    .ts{flex:0 0 auto;padding:0 10px}
    .ts i{font-size:9.5px;letter-spacing:.12em}
    .ts b{font-size:13.5px}
    .act-d{display:none}
    .only-m{display:flex!important}
    .sheetbar.only-m{
      display:flex!important;align-items:center;gap:10px;
      padding:14px 14px 9px;border-bottom:1px solid var(--line);
      position:sticky;top:0;background:var(--paper2);z-index:2;
    }
    .sheetbar .grip{
      position:absolute;left:50%;top:6px;transform:translateX(-50%);
      width:38px;height:4px;border-radius:2px;background:var(--line2);
    }
    .sheetbar .stitle{flex:1 1 auto;font-size:var(--fs-sm2);letter-spacing:.24em;color:var(--ink3)}
    .sheetbar .sclose{
      width:34px;height:34px;flex:0 0 auto;padding:0;font-size:13px;
      border:1px solid var(--line2);border-radius:50%;
      background:var(--raise);color:var(--ink2);
      display:flex;align-items:center;justify-content:center;
    }
    #menuBtn{
      width:42px;height:42px;flex:0 0 auto;padding:0;font-size:19px;line-height:1;
      display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);
    }

    /* ---- 主区：单栏 ---- */
    .main{display:block;padding:0 10px}
    .right{gap:var(--gap)}

    /* ---- 左栏 → 底部抽屉 ---- */
    .left{
      position:fixed;left:0;right:0;bottom:0;z-index:60;
      max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;
      padding:0 12px calc(16px + env(safe-area-inset-bottom,0px));
      background:var(--paper2);
      border-top:1px solid var(--line2);
      border-radius:var(--r-lg) var(--r-lg) 0 0;
      box-shadow:0 -16px 48px rgba(0,0,0,.24);
      transform:translateY(102%);
      transition:transform .3s cubic-bezier(.22,.8,.28,1);
      display:flex;flex-direction:column;gap:var(--gap);
    }
    body.sheet-on .left{transform:none}
    .util-panel{display:block}

    /* ---- 动作区 ---- */
    .actwrap{padding:11px 12px}
    .actgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
    .card{padding:11px 12px;min-height:var(--tap)}
    .card .t{font-size:14px}
    .card .d{font-size:12px}

    /* ---- 日志 ---- */
    .logpanel{min-height:0}
    .log{max-height:46dvh;font-size:14px;line-height:1.9;padding:10px 12px}

    /* ---- 页签 → 底部导航 ---- */
    #tabs{
      position:fixed;left:0;right:0;bottom:0;z-index:50;
      display:grid;grid-template-columns:repeat(5,1fr);gap:0;
      border-top:1px solid var(--line2);border-bottom:0;
      padding:0 0 env(safe-area-inset-bottom,0px);
      background:var(--paper2);margin:0;
    }
    .tab{
      padding:0;height:var(--navh);margin:0;
      display:flex;align-items:center;justify-content:center;
      font-size:12.5px;letter-spacing:.06em;
      border-bottom:0;border-top:2px solid transparent;
    }
    .tab.on{
      border-top-color:var(--zhu);border-bottom-color:transparent;
      background:linear-gradient(180deg,var(--raise),transparent);
    }
    .tab.dis{opacity:.35}

    /* ---- 触摸目标 ---- */
    .btn-mini{padding:9px 12px}
    .bagrow2 button,.slotcard .sb,.heritage .hb,.mbtn,.chip{min-height:36px}
    .bagrow2 .l2{gap:8px;margin-top:7px}
    .bagrow2 button{padding:6px 12px}
    .slot{padding:8px 9px}
    .grid2{gap:6px 12px;font-size:13px}

    /* ---- 弹层 → 底部上滑 ---- */
    .mask{align-items:flex-end;padding:0}
    .modal{
      max-width:none;width:100%;
      border-radius:var(--r-lg) var(--r-lg) 0 0;
      max-height:90dvh;
      padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px));
      animation:sheetup .32s cubic-bezier(.22,.8,.28,1);
    }
    @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
    .modal h2{font-size:var(--fs-lg);margin-bottom:12px}
    .modal .btns{
      position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));
      background:linear-gradient(180deg,transparent,var(--paper2) 34%);
      padding:14px 0 4px;margin-top:12px;
    }
    @media (prefers-reduced-motion: reduce){ .modal{animation:none} }

    /* ---- 其余移动端微调 ---- */
    .achg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .foe{gap:6px;font-size:11px;margin-bottom:8px}
    .foe span{padding:3px 8px}
    .savecode{height:62px}
    .toast{
      top:auto;bottom:calc(var(--navh) + 18px);
      width:calc(100% - 32px);max-width:none;text-align:center;
    }
    .achpop{
      width:100%;min-width:0;padding:10px 16px;
      border-radius:0 0 var(--r-md) var(--r-md);
    }
    .encopt{padding:12px 14px}
    .encintro{font-size:13px;padding:11px 13px}
    .heritage .hb{padding:7px 12px}
    .filters{gap:6px}
    .sellbox{padding:10px 12px}
  }

  @media (max-width:400px){
    .brand h1{font-size:14px;letter-spacing:.12em}
    .actgrid{grid-template-columns:1fr 1fr}
    .achg{grid-template-columns:1fr}
    .ts{padding:0 8px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <h1 class="serif">修 仙 模 拟 器</h1>
      <span>L I T E R A R Y &nbsp; C U L T I V A T I O N</span>
    </div>
    <div class="top-stats">
      <div class="ts realm"><i>境 界</i><b id="topRealm">炼气一层</b></div>
      <div class="ts"><i>修 行 日</i><b id="topDay">第 1 日</b></div>
      <div class="ts"><i>灵 石</i><b id="topStones">0</b></div>
      <div class="ts"><i>战 力</i><b id="topPower">0</b></div>
      <div class="ts luck" id="luckTs"><i>气 运</i><b id="topLuck">0</b></div>

    <div class="top-acts">
      <button class="btn-mini act-d" onclick="showHelp()">道 法</button>

      <button class="btn-mini act-d" onclick="openRebirth()">轮 回</button>

      <button class="btn-mini only-m" onclick="toggleSheet()" id="menuBtn" aria-label="状态与功能">≡</button>
    </div>
  </div>

  <div class="main">
    <!-- 左栏（移动端为底部抽屉） -->
    <div class="left" id="leftPane">
      <div class="sheetbar only-m">

        <div class="ph">道 体</div>

            <div class="track"><div class="fill f-hp" id="hpBar" style="width:0%"></div></div>
          </div>
          <div class="bar">
            <div class="lab"><span>灵 力</span><em id="mpTxt">0 / 0</em></div>

          <div class="grid2">

        </div>
      </div>

      <div class="panel">

<script>
"use strict";

/* =========================================================
   修仙模拟器 · 文字版
   ========================================================= */

/* ---------------- 基础工具 ---------------- */
const $ = s => document.getElementById(s);
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const rf = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const chance = p => Math.random()*100 < p;
const clamp = (v,a,b) => v<a?a:(v>b?b:v);

function num(n){
  n = Math.floor(n);
  if(n < 10000) return String(n);
  if(n < 1e8) return (n/1e4).toFixed(n<1e5?2:1).replace(/\.0+$/,'') + '万';
  return (n/1e8).toFixed(2).replace(/\.0+$/,'') + '亿';
}

const Q_FLOW = 3;   /* 品质序号 ≥ 该值启用流光特效 */

const BASE_NAMES = {
  weapon:['青锋剑','玄铁长刀','游龙枪','判官笔','裂石锤','寒月钩','斩妖剑','龙骨鞭','赤霄枪','天罡剑','噬魂幡','断岳刀'],

  treasure:['聚灵珠','乾坤袋','镇妖塔','阴阳镜','太虚鼎','琉璃盏','缚仙索','五行环','紫金葫芦','噬灵幡','九宫盘','避水珠','照妖镜','引魂铃']
};

let UID = 1;
function makeItem(slot, lv, qi){
  const q = QUALITIES[qi];
  const s = 1 + lv*0.34;
  const it = { id: UID++, slot, q: qi, lv };
  if(slot === 'weapon'){
    it.atk  = Math.round(9 * q.mult * s);
    it.crit = +(q.crit * 0.9).toFixed(1);
    it.name = pick(BASE_NAMES.weapon);
  }else if(slot === 'armor'){
    it.def = Math.round(7 * q.mult * s);
    it.hp  = Math.round(47 * q.mult * s);
    it.name = pick(BASE_NAMES.armor);
  }else{
    it.mp   = Math.round(33 * q.mult * s);
    it.atk  = Math.round(3.4 * q.mult * s);
    it.def  = Math.round(2.3 * q.mult * s);
    it.cult = +(q.mult * 2.2 + lv * 0.12).toFixed(1);
    it.name = pick(BASE_NAMES.treasure);
  }
  it.power = Math.round((it.atk||0)*2 + (it.def||0)*2.6 + (it.hp||0)*0.16 + (it.mp||0)*0.1 + (it.crit||0)*6 + (it.cult||0)*5);
  return it;
}

/* 按运气（0~1）抽品质 —— 仙品与神品概率已整体下调 */
function rollQuality(luck){
  luck = clamp(luck, 0, 1);
  const w = [
    Math.max(6, 70 - 54*luck),
    22 + 8*luck,
    6 + 14*luck,
    1.2 + 9*luck,
    0.15 + 4.5*luck
  ];
  const tot = w.reduce((a,b)=>a+b,0);
  let r = Math.random()*tot;
  for(let i=0;i<w.length;i++){ r -= w[i]; if(r <= 0) return i; }
  return 0;
}

/* 气运 → 掉落运气（滚品质时叠加到 luck 上），见 fortune() */
function luckBoost(){ return fortune() * 0.005; }

function rollItem(levelBias, luck){
  const slot = pick(['weapon','armor','treasure']);
  const lv = Math.max(0, S.level + levelBias);
  return makeItem(slot, lv, rollQuality((luck||0) + luckBoost()));
}

function itemCost(it){
  const q = QUALITIES[it.q];
  return Math.round(55 * q.mult * (1 + it.lv*0.42));
}

/* -------- 品阶样式：仙品以上挂流光 -------- */
function flowCls(qi){ return qi >= Q_FLOW ? 'flow q'+qi : ''; }
function godCls(qi){ return qi > Q_FLOW ? ' shen' : (qi === Q_FLOW ? ' god' : ''); }
function qName(text, qi){
  return qi >= Q_FLOW
    ? '<span class="flow q'+qi+'">'+text+'</span>'
    : '<span class="qname qc'+qi+'">'+text+'</span>';
}
function qBadge(qi){
  const fc = flowCls(qi);
  return '<span class="q qc'+qi+(fc?' '+fc:'')+'">'+QUALITIES[qi].name+'</span>';
}
function isMount(x){ return !!x && (x.kind === 'mount' || x.slot === 'mount'); }

/* -------- 出售价：约为买价的四成 -------- */
function sellPrice(x){
  if(!x) return 0;
  if(isMount(x)) return Math.max(1, Math.round(mountCost(x)*0.42));
  return Math.max(1, Math.round(itemCost(x)*0.42));
}

function itemLabel(it){
  const parts = [];
  if(it.atk) parts.push('攻+'+num(it.atk));
  if(it.def) parts.push('防+'+num(it.def));
  if(it.hp)  parts.push('血+'+num(it.hp));
  if(it.mp)  parts.push('灵+'+num(it.mp));
  if(it.crit) parts.push('暴+'+it.crit+'%');
  if(it.cult) parts.push('修速+'+it.cult+'%');
  return qName(it.name, it.q) + qBadge(it.q)
       + '<span class="muted-sm"> '+parts.join(' · ')+'</span>';
}

           stones:0, items:0, xian:0, shen:0, mountMax:0, pillUse:0, breakFail:0, enc:0 };

  };

function loadMeta(){
  try{
    const raw = localStorage.getItem(META_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d) return;
    META.rebirths = d.rebirths||0;
    META.points = d.points||0;
    META.totalKills = d.totalKills||0;
    META.totalDeaths = d.totalDeaths||0;
    META.ascensions = d.ascensions||0;
    META.best = Object.assign({lv:0,day:0,kills:0}, d.best||{});
    const u = d.up||{};
    META.up = { cult:u.cult||0, pill:u.pill||0, stone:u.stone||0, luck:u.luck||0, body:u.body||0 };
    META.ach = Array.isArray(d.ach) ? d.ach.filter(x => typeof x === 'string') : [];
    const L = d.life || {};
    META.life = blankStat();
    for(const k in META.life) META.life[k] = L[k] || 0;
    META.encSeen = d.encSeen||0;
    META.encKeys = Array.isArray(d.encKeys) ? d.encKeys.filter(x => typeof x === 'string') : [];
    META.secSet = Array.isArray(d.secSet) ? d.secSet.filter(x => typeof x === 'number') : [];
  }catch(e){}
}
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(META)); }catch(e){} }

/* 用一份外部数据整体重建 META（导入存档码用）——必须走这里，
   否则漏字段会让 fortune()/achBonus() 之类在迭代时炸掉 */
function applyMeta(m){
  m = m || {};
  const u = m.up || {}, b = m.best || {}, L = m.life || {};
  META = blankMeta();
  META.rebirths = m.rebirths||0;
  META.points = m.points||0;
  META.up = { cult:u.cult||0, pill:u.pill||0, stone:u.stone||0, luck:u.luck||0, body:u.body||0 };
  META.best = { lv:b.lv||0, day:b.day||0, kills:b.kills||0 };
  META.totalKills = m.totalKills||0;
  META.totalDeaths = m.totalDeaths||0;
  META.ascensions = m.ascensions||0;
  META.ach = Array.isArray(m.ach) ? m.ach.filter(x => typeof x === 'string') : [];
  for(const k in META.life) META.life[k] = L[k]||0;
  META.secSet = Array.isArray(m.secSet) ? m.secSet.filter(x => typeof x === 'number') : [];
  META.encSeen = m.encSeen||0;
  META.encKeys = Array.isArray(m.encKeys) ? m.encKeys.filter(x => typeof x === 'string') : [];
  saveMeta();
}

const ACH_BY_KEY = {};
for(const a of ACHIEVEMENTS) ACH_BY_KEY[a.k] = a;

/* 汇总当前可判定的一切数据（本局 + 历世累计） */
function achAgg(){
  const s = S.stat || blankStat(), l = META.life || blankStat();
  const sum = k => (s[k]||0) + (l[k]||0);
  const eq = S.equip;
  return {
    lv: Math.max(S.level, META.best.lv||0),
    grp: realmAt(Math.max(S.level, META.best.lv||0)).group,
    day: Math.max(S.day, META.best.day||0),
    kills: S.kills + META.totalKills,
    deaths: S.deaths + META.totalDeaths,
    rebirths: META.rebirths,
    asc: META.ascensions,
    med: sum('med'), sec: sum('sec'), secEnter: sum('secEnter'),
    ins: sum('ins'), boss: sum('boss'), secret: sum('secret'),
    stones: sum('stones'), items: sum('items'),
    xian: sum('xian'), shen: sum('shen'),
    mountMax: Math.max(s.mountMax||0, l.mountMax||0),
    chain: Math.max(s.chainMax||0, l.chainMax||0),
    pillUse: sum('pillUse'), breakFail: sum('breakFail'), enc: META.encSeen||0,
    secretAll: (META.secSet||[]).length >= SECRETS.length,
    gearFull: !!(eq.weapon && eq.armor && eq.treasures[0] && eq.treasures[1] && eq.treasures[2]),
    fort: fortune()
  };
}

/* 成就加成的汇总（供 stats / 突破率使用） */
function achBonus(){
  const b = { atk:0, def:0, hp:0, cult:0, brk:0, f:0 };
  for(const k of achList()){
    const d = ACH_BY_KEY[k];
    if(!d) continue;
    const tb = ACH_TIER[d.t].b;
    b.atk += tb.atk||0; b.def += tb.def||0; b.hp += tb.hp||0;
    b.cult += tb.cult||0; b.brk += tb.brk||0;
  }
  return b;
}

/* 扫描并解锁；返回本次新解锁的成就数组 */
function checkAch(){
  if(!S) return [];
  const list = achList();
  const a = achAgg();
  const got = [];
  for(const d of ACHIEVEMENTS){
    if(list.indexOf(d.k) >= 0) continue;
    let ok = false;
    try{ ok = !!d.c(a); }catch(e){ ok = false; }
    if(ok){ list.push(d.k); got.push(d); }
  }
  if(got.length){
    saveMeta();
    for(const d of got){
      addLog('【成就 · '+ACH_TIER[d.t].n+'品】'+d.n+' —— '+d.d+'　（'+achTierText(d.t)+'）','ach');
    }
    showAchPop(got[got.length-1], got.length);
  }
  return got;
}

/* 解锁横幅：金色卷轴自顶垂下 */
function showAchPop(d, total){
  if(!d) return;
  const t = ACH_TIER[d.t];
  const el = document.createElement('div');
  el.className = 'achpop' + (d.t >= 4 ? ' shen' : '');
  el.innerHTML = '<span class="aseal">'+t.n+'</span>'
    + '<span class="atxt">'
    + '<span class="ak">成 就 达 成'+(total>1 ? ' ×'+total : '')+'</span><br>'
    + '<span class="an">'+d.n+'</span><br>'
    + '<span class="ab">'+achTierText(d.t)+'</span>'
    + '</span>';
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); }, 2600);
  setTimeout(()=>{ el.remove(); }, 3100);
}

/* 成就面板 */
function openAchievements(){
  const a = achAgg();
  const list = achList();
  const have = list.length, all = ACHIEVEMENTS.length;
  const ab = achBonus();
  const fb = Object.assign({}, ab); fb.f = fortune();
  let h = '<div class="achhd">'
    + '<span class="achsum">已 得 <b style="color:var(--zhu-d)">'+have+'</b> / '+all+'</span>'
    + '<span class="achbar"><i style="width:'+Math.round(have/all*100)+'%"></i></span>'
    + '<span class="achsum">气 运 <b style="color:#a07a2c">'+fortune()+'</b></span>'
    + '</div>';
  h += '<div class="meta-note">成就一旦达成便永久留存，<b>轮回也不消散</b>。'
    + '累积加成：<b>'+fmtBonus(fb)+'</b><br>'
    + '气运同时增益三处：掉落品质（运气 +'+(luckBoost()).toFixed(2)+'）、'
    + '灵石收益（+'+Math.round(fortune()*0.6)+'%）、掉落概率（+'+Math.round(fortune()*0.8)+'%）。'
    + '已遇奇遇 <b>'+META.encSeen+'</b> 次。</div>';
  h += '<div class="pb-scroll">';
  for(let t=4;t>=0;t--){
    const list2 = ACHIEVEMENTS.filter(x => x.t === t);
    const got = list2.filter(x => list.indexOf(x.k) >= 0).length;
    h += '<div class="achsec" style="color:'+ACH_TIER[t].c+'">'
      + ACH_TIER[t].n+' 品 · '+got+'/'+list2.length+'</div>';
    h += '<div class="achg">';
    for(const d of list2){
      const on = list.indexOf(d.k) >= 0;
      h += '<div class="ach'+(on?' got':'')+'">'
        + (on ? '<span class="tick">已 达 成</span>' : '')
        + '<div class="ant"><span class="tier" style="color:'+ACH_TIER[d.t].c+'">'+ACH_TIER[d.t].n+'</span>'+d.n+'</div>'
        + '<div class="ad">'+d.d+'</div>'
        + '<div class="ab2">'+achTierText(d.t)+'</div>'
        + '</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  showModal('成 就 · 道 心 有 痕', h, [{label:'关 闭', primary:true, fn:closeModal}], 'wide');
}

   奇遇 · 机遇时刻
   设计意图：低频（冷却 5 日 / 约 9%）+ 分 5 段专属 + 选项不可兼得
   不做成"每次行动都弹窗"——那会毁掉节奏。这里是真正需要做决定的时刻。
   ========================================================= */
const ENC_CD = 5;
const ENC_RATE = 9;

function encSeg(){
  const g = realmAt(S.level).group;
  return g <= 1 ? 0 : g <= 3 ? 1 : g <= 6 ? 2 : g <= 9 ? 3 : 4;
}
const ENC_SEG_NAME = ['炼气 · 筑基','金丹 · 元婴','化神 · 炼虚 · 合体','大乘 · 渡劫 · 大罗','准圣 · 圣人 · 天道'];
function encTier(){ return clamp(encSeg() + 1, 0, 4); }

function eExp(m){ return Math.floor(expNeed(S.level) * m); }
function eStone(m){ return fortStone(Math.round((50 + S.level*30) * m)); }
function eStones(m){ const v = eStone(m); S.stones += v; addLog('灵石 +'+num(v)+' 枚。','item'); return v; }
function eGain(m){ gainExp(eExp(m)); }
function eLoot(luck, bias, n){
  n = n || 1;
  for(let i=0;i<n;i++) addItem(rollItem(bias === undefined ? 0 : bias, luck));
}
function ePill(name, n){ S.pills[name] = (S.pills[name]||0) + n; addLog('得「'+name+'」×'+n+' 枚。','item'); }
function eHeal(){ const st = stats(); S.hp = st.hpMax; S.mp = st.mpMax; addLog('气血与灵力尽复。','gain'); }
function eHurt(m){ const d = Math.round(stats().hpMax*m); S.hp = Math.max(1, S.hp - d); addLog('气血 -'+num(d)+'。','dmg'); }
function eSpend(mp){ const d = Math.round(stats().mpMax*mp); S.mp = Math.max(0, S.mp - d); return d; }
function eFight(tier, boss){ startFight(makeMonster(clamp(tier,0,4), !!boss), { type:'enc' }); }
function eMirror(){
  const st = stats();
  const hp = Math.round(st.hpMax*1.1);
  return { name:'镜中之我', tier:3, boss:false, hpMax:hp, hp:hp,
    atk: Math.round(st.atk*1.05), def: Math.round(st.def*0.95), crit: st.crit,
    exp: eExp(2.8), stones: eStone(3.2) };
}

function tryEncounter(){
  if(!S || busy() || S.encOpen) return false;
  if(S.day - (S.encDay||0) < ENC_CD) return false;
  if(!chance(ENC_RATE)) return false;
  const seg = encSeg();
  const pool = ENCOUNTERS.filter(e => e.seg === seg);
  if(!pool.length) return false;
  const tot = pool.reduce((a,e)=>a+e.w, 0);
  let r = Math.random()*tot, sel = pool[0];
  for(const e of pool){ r -= e.w; if(r <= 0){ sel = e; break; } }
  S.encDay = S.day;
  S.encOpen = sel;
  META.encSeen = (META.encSeen||0) + 1;
  if(META.encKeys.indexOf(sel.k) < 0) META.encKeys.push(sel.k);
  if(S.stat) S.stat.enc++;
  saveMeta();
  addSep();
  addLog('【奇遇 · '+sel.t+'】'+sel.d,'enc');
  showEncounter();
  return true;
}

function showEncounter(){
  const e = S.encOpen;
  if(!e) return;
  let h = '<div class="encintro">'+e.d+'</div><div class="encopts">';
  for(let i=0;i<e.ch.length;i++){
    const o = e.ch[i];
    h += '<div class="encopt" onclick="encChoose('+i+')">'
      + '<div class="et">'+o.t+'</div>'
      + (o.d ? '<div class="ed">'+o.d+'</div>' : '')
      + '</div>';
  }
  h += '</div>';
  showModal('奇 遇 · '+e.t, h, [], 'wide');
}

function encChoose(i){
  const e = S.encOpen;
  if(!e) return;
  const o = e.ch[i];
  if(!o) return;
  S.encOpen = null;
  closeModal();
  addLog('你选择了「'+o.t+'」。','sys');
  try{ o.f(); }catch(err){}
  checkAch();
  clampVitals();
  after();
}


/* 轮回印记：每一世永久 +2% 修炼速度（至多 +20%） */
function rebirthCult(){ return Math.min(20, META.rebirths*2); }
function heritageCult(){ return META.up.cult*6 + rebirthCult(); }
function hCost(h){ return h.base + Math.floor((META.up[h.k]||0)/2); }
function heritageSummary(){
  const on = HERITAGE.filter(h => (META.up[h.k]||0) > 0).map(h => h.name+' '+META.up[h.k]+' 重');
  if(rebirthCult() > 0) on.push('轮回印记 +'+rebirthCult()+'% 修速');
  return on.length ? on.join('、') : '空空如也';
}
function realmNameOf(lv){ return REALMS[clamp(lv||0,0,MAX_LV)].name; }

/* ---------------- 属性计算 ---------------- */
function stats(){
  const lv = S ? S.level : 0;
  const st = {
    hpMax: Math.round(130 + lv*54),
    mpMax: Math.round(65 + lv*27),
    atk: 13 + lv*5.2,
    def: 6 + lv*2.8,
    crit: 5,
    cult: 0,
    cultGear: 0,
    speed: 0
  };
  if(S){
    const eq = [S.equip.weapon, S.equip.armor, S.equip.mount, ...S.equip.treasures].filter(Boolean);
    for(const it of eq){
      st.hpMax += it.hp||0; st.mpMax += it.mp||0;
      st.atk += it.atk||0;  st.def += it.def||0;
      st.crit += it.crit||0; st.cult += it.cult||0;
      st.speed += it.speed||0;
    }
  }
  st.cultGear = st.cult;                                   /* 仅器物提供的修速，用于突破判定 */
  const ab = achBonus();
  st.hpMax = Math.round(st.hpMax * (1 + META.up.body*0.05) * (1 + ab.hp/100)); /* 体魄传承 + 成就 */
  st.atk *= (1 + ab.atk/100);
  st.def *= (1 + ab.def/100);
  st.cult += heritageCult() + ab.cult;                      /* 悟性传承 + 轮回印记 + 成就 */
  st.atk = Math.round(st.atk);
  st.def = Math.round(st.def);
  st.crit = +st.crit.toFixed(1);
  st.speed = +st.speed.toFixed(1);
  st.cult = +st.cult.toFixed(1);
  st.power = Math.round(st.atk*2 + st.def*2.6 + st.hpMax*0.16 + st.mpMax*0.1 + st.crit*6);
  return st;
}
function clampVitals(){
  const st = stats();
  S.hp = clamp(S.hp, 0, st.hpMax);
  S.mp = clamp(S.mp, 0, st.mpMax);
}

/* ---------------- 日志 ---------------- */
function addLog(text, cls){
  S.logs.push({ t:text, c: cls || 'act' });
  if(S.logs.length > 220) S.logs.splice(0, S.logs.length - 220);
}
function addSep(){
  S.logs.push({ sep:true });
  if(S.logs.length > 220) S.logs.splice(0, S.logs.length - 220);
}
function renderLog(){
  const el = $('log');
  let html = '';
  for(const l of S.logs){
    if(l.sep){ html += '<div class="sep">· · ·</div>'; continue; }
    html += '<p class="l-'+l.c+'">'+l.t+'</p>';
  }
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}
function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity='0'; }, 900);
  setTimeout(()=>d.remove(), 1250);
}

/* ---------------- 时间 ---------------- */
function advance(days){
  S.day += days;
  const st = stats();
  S.hp = Math.min(st.hpMax, S.hp + Math.round(st.hpMax * 0.07 * days));
  S.mp = Math.min(st.mpMax, S.mp + Math.round(st.mpMax * 0.09 * days));
  if(S.day - S.shopDay >= 6) refreshShop(true);
}

/* 坐骑遁速：缩短赶路耗时（修炼不受影响） */
function travelDays(base){
  const cut = clamp(stats().speed, 0, 65);
  return Math.max(1, Math.round(base * (1 - cut/100)));
}

/* ---------------- 修为 ---------------- */
function gainExp(v, silent){
  S.exp += v;
  if(!silent && v > 0) addLog('修为 +' + num(v), 'gain');
}

/* 把一件器物与当前槽位对比：更强就换上，被替换的退回储物袋。
   返回 true 表示已装备。法宝三格优先填空位，满了才替换其中最弱的一件。 */
function tryEquipIfBetter(it){
  if(!it || !it.slot) return false;

  if(it.slot === 'treasure'){
    let idx = S.equip.treasures.indexOf(null);
    if(idx < 0){
      let worst = 0;
      for(let i=1;i<3;i++){
        const t = S.equip.treasures[i];
        if(t && t.power < S.equip.treasures[worst].power) worst = i;
      }
      if(!(it.power > S.equip.treasures[worst].power)) return false;
      S.bag.push(S.equip.treasures[worst]);
      S.equip.treasures[worst] = it;
    }else{
      S.equip.treasures[idx] = it;
    }
    return true;
  }

  const cur = S.equip[it.slot];
  if(cur && !(it.power > cur.power)) return false;
  S.equip[it.slot] = it;
  if(cur) S.bag.push(cur);
  return true;
}

/* 统一入库：开启自动换装时，更强的直接上身；否则进储物袋。
   force = true 用于玩家手动购买/拾取时也要走自动逻辑（默认就是） */
/* 器物统计（供成就判定） */
function countItem(it){
  if(!S || !S.stat || !it) return;
  S.stat.items++;
  if(it.q >= 4) S.stat.shen++;
  else if(it.q >= 3) S.stat.xian++;
  if(isMount(it) && (it.lv||0) > S.stat.mountMax) S.stat.mountMax = it.lv||0;
}

function addItem(it, quiet){
  if(!it) return false;
  countItem(it);

  if(S.autoEquipOn && tryEquipIfBetter(it)){
    if(!quiet){
      const isMount = it.slot === 'mount';
      addLog('获得'+(isMount?'坐骑':'法器')+'：'+ (isMount ? mountLabel(it) : itemLabel(it))
        + '，威能胜于在身者，已自动祭炼。','item');
    }
    return true;
  }

  if(S.bag.length >= 40){
    addLog('储物袋已满，'+it.name+'被随手丢弃。','dim');
    return false;
  }
  S.bag.push(it);
  if(!quiet){
    const isMount = it.slot === 'mount';
    addLog('获得'+(isMount?'坐骑':'法器')+'：'+ (isMount ? mountLabel(it) : itemLabel(it))
      + (S.autoEquipOn ? '（不及在身者，收于囊中）' : ''),'item');
  }
  return true;
}

function toggleAutoEquip(){
  S.autoEquipOn = !S.autoEquipOn;
  addLog(S.autoEquipOn
    ? '你放开神识，此后所得器物若胜于在身者，皆自行祭炼认主。'
    : '你敛起神识，此后每一件所得都要亲手过目。','sys');
  after();
}

/* =========================================================
   修炼系统
   ========================================================= */
function medGain(){
  const st = stats();
  return Math.floor(askExp(S.level) * (1 + st.cult/100) * rf(0.9, 1.16));
}

function actMeditate(){
  if(S.combat || S.dungeon) return;
  const before = S.exp;
  const g = medGain();
  advance(1);
  gainExp(g);
  const st = stats();
  S.hp = Math.min(st.hpMax, S.hp + Math.round(st.hpMax*0.18));
  S.mp = Math.min(st.mpMax, S.mp + Math.round(st.mpMax*0.28));
  addLog('你在蒲团上盘膝而坐，以「'+pick(['引气诀','玄门吐纳法','周天导引术','清心诀'])+'」运转周天，灵气自百会入，沉于丹田。','act');
  addLog('一日苦修，气血与灵力皆有所复。','dim');
  S.stat.med++;
  medEvent();
  checkBreakReady(before);
  checkAch();
  if(tryEncounter()) return;
  after();
}

function actStoneCultivate(){
  if(S.combat || S.dungeon) return;
  const cost = 25 + S.level*6;
  if(S.stones < cost){ toast('灵石不足（需 '+cost+'）'); return; }
  const before = S.exp;
  S.stones -= cost;
  const st = stats();
  const g = Math.floor(expNeed(S.level) * 0.85 * (1 + st.cult/100) * rf(0.95,1.15));
  advance(1);
  gainExp(g);
  addLog('你将 '+cost+' 枚灵石布成聚灵阵，盘坐阵眼。灵石寸寸碎裂，化作精纯灵气涌入四肢百骸——比枯坐快上数倍。','act');
  S.stat.med++;
  medEvent();
  checkBreakReady(before);
  checkAch();
  if(tryEncounter()) return;
  after();
}

function actSeclusion(){
  if(S.combat || S.dungeon) return;
  const st = stats();
  if(S.mp < st.mpMax*0.9){ toast('灵力不足九成，无法闭关'); return; }
  if(S.hp < st.hpMax*0.9){ toast('气血不足九成，无法闭关'); return; }
  const before = S.exp;
  S.hp = Math.round(st.hpMax*0.5);
  S.mp = Math.round(st.mpMax*0.2);
  advance(7);
  addLog('你封死洞府石门，布下九重禁制，闭关七日。','act');
  let g = Math.floor(expNeed(S.level) * 4.2 * (1 + st.cult/100));
  if(chance(26)){
    const lose = Math.floor(g * 0.42);
    g -= lose;
    S.hp = Math.max(1, Math.round(S.hp*0.5));
    addLog('闭关第三日，心魔骤起——过往执念化作幻影直刺神魂。你咬破舌尖以痛制妄，七日功成时，修为竟折损近半。','warn');
  }else if(chance(22)){
    g = Math.floor(g * 1.55);
    addLog('闭关第五日，潮汐般的灵机忽然贯通，你于恍惚间窥见天地至理——顿悟！','epic');
  }else{
    addLog('洞中无日月。七日后石门开启，你周身气息沉凝了几分。','act');
  }
  gainExp(g);
  S.stat.sec++;
  checkBreakReady(before);
  checkAch();
  if(tryEncounter()) return;
  after();
}

function medEvent(){
  const r = Math.random()*100;
  if(r < 4){
    const bonus = Math.floor(expNeed(S.level)*0.35);
    gainExp(bonus, true);
    S.stat.ins++;
    addLog('入定之中，忽有灵光乍现，你抓住那一瞬——顿悟！额外修为 +'+num(bonus),'epic');
  }else if(r < 6.5){
    const s = fortStone(12);
    S.stones += s;
    S.stat.stones += s;
    addLog('吐纳时地脉灵气涌动，竟在身侧凝出 '+s+' 枚灵石。','item');
  }else if(r < 8){
    addLog('灵气岔行，你急忙收功调息，所幸并无大碍。','warn');
  }
}

function checkBreakReady(before){
  const need = expNeed(S.level);
  if(S.exp >= need && before < need){
    if(S.level >= MAX_LV) addLog('════ 修为再无可增，天穹之上雷云翻涌——可以「白日飞升」了！ ════','epic');
    else addLog('════ 修为圆满，气机已至瓶颈，可冲击「'+realmAt(S.level+1).name+'」！ ════','epic');
  }
}

/* ---------------- 突破 ----------------
   平衡说明：
   · 基础成功率随大境界递减（74% → 45%），比旧版整体下调，用以抵消"溢出结转 + 连破"带来的提速
   · 破境丹加成随大境界增厚（14% → 26%），每个境界皆可用，至多连服三枚叠加
   · 修速（仅计器物）最多 +20%，丹道传承每重 +1.5%
   · 连破惩罚：每连破一境，下一境成功率 -3%（至多 -12%），失败即清零
   · 失败代价改为"当前境界所需修为的 32%"（封顶），不再按持有总量的 35% 扣除
----------------------------------------- */
function pillBonus(){
  const g = realmAt(S.level).group;
  const base = 14 + Math.min(12, g*1.2);
  const n = clamp(S.pillStack||0, 0, 3);
  const mult = n >= 3 ? 1.55 : (n === 2 ? 1.3 : (n === 1 ? 1 : 0));
  return Math.round(base * mult);
}
function breakChance(){
  const g = realmAt(S.level).group;
  let c = 74 - g*2.4;
  c += META.up.pill * 1.5;
  c += achBonus().brk;                                      /* 成就加成 */
  c += Math.min(20, stats().cultGear * 0.28);
  c += pillBonus();
  c -= Math.min(12, (S.breakStreak||0) * 3);
  return clamp(Math.round(c), 20, 96);
}
function pillTip(){
  const n = S.pillStack||0;
  if(n > 0) return ' · 破境丹 +'+pillBonus()+'%（'+n+' 枚）';
  return (S.pills['破境丹']||0) > 0 ? ' · 可服破境丹' : '';
}

/* 当前修为还够连破几境 */
function readyCount(){
  if(S.level >= MAX_LV) return 0;
  let e = S.exp, lv = S.level, n = 0;
  while(lv < MAX_LV && e >= expNeed(lv)){ e -= expNeed(lv); lv++; n++; if(n > 99) break; }
  return n;
}

/* 单次突破，返回 'ok' / 'fail' / 'end' */
function breakthroughOnce(quiet){
  if(S.level >= MAX_LV){ ascend(); return 'end'; }
  const need = expNeed(S.level);
  if(S.exp < need) return 'fail';

  const c = breakChance();
  S.pillStack = 0;                     /* 药力成或败皆尽 */

  if(chance(c)){
    S.level++;
    S.exp = Math.max(0, S.exp - need); /* 溢出结转：可继续冲击下一境 */
    S.breakStreak = (S.breakStreak||0) + 1;
    if(S.breakStreak > S.stat.chainMax) S.stat.chainMax = S.breakStreak;
    const st = stats();
    S.hp = st.hpMax; S.mp = st.mpMax;
    const gname = realmAt(S.level).groupName;
    const grp = realmAt(S.level).group;
    if(!quiet){
      addLog('轰——！','epic');
      addLog('周身灵气如潮水倒灌，经脉节节拓宽，骨骼发出细密脆响。你于剧痛中睁开双眼，眸中精光一闪而逝。','epic');
    }
    addLog('★ 突破成功，境界晋升为【'+realmName()+'】！' + (quiet ? '' : '气血灵力尽复。'),'epic');
    if(isGroupStart(S.level)) addLog('你踏入「'+gname+'」——天地在你眼中骤然不同。','sys');
    if(grp >= 10 && realmAt(S.level).i === 0){
      addLog(grp === 10 ? '仙道之上再无阶可循。至此，你已是准圣之姿，一念可断山河。'
           : grp === 11 ? '万法归一，诸天俯首。圣人之名，自此镌于天碑。'
           : '你触到了那层始终笼罩众生的幕布——天道，就在幕布之后。','epic');
    }
    if(S.level >= MAX_LV){
      addLog('九霄雷云翻涌，天地皆寂。你已走到这条路的尽头，只差最后一步。','epic');
    }
    return 'ok';
  }

  const lose = Math.min(S.exp, Math.floor(need*0.32));
  S.exp -= lose;
  S.breakStreak = 0;                   /* 失败，连破气机尽散 */
  S.stat.breakFail++;
  S.hp = Math.max(1, Math.round(S.hp * 0.42));
  addLog('突破失败！气机反冲，你闷哼一声，嘴角溢出一线暗红。','warn');
  addLog('修为倒退 '+num(lose)+'，气血大损。或许该多备几枚破境丹，或先淬炼几件法器。','dim');
  return 'fail';
}

function doBreakthrough(){
  if(S.combat || S.dungeon) return;
  if(S.exp < expNeed(S.level)){ toast('修为尚未圆满'); return; }
  const r = breakthroughOnce(false);
  if(r === 'ok') addSep();
  after();
}

/* 连续突破：一口气冲到修为不够或失败为止 */
function doBreakthroughChain(){
  if(S.combat || S.dungeon) return;
  if(S.level >= MAX_LV){ ascend(); return; }
  if(S.exp < expNeed(S.level)){ toast('修为尚未圆满'); return; }
  addLog('你不再压抑体内翻涌的气机，任由修为一次又一次撞向瓶颈——','act');
  let n = 0, fail = false;
  while(S.level < MAX_LV && S.exp >= expNeed(S.level) && n < 99){
    const r = breakthroughOnce(true);
    n++;
    if(r === 'fail'){ fail = true; break; }
    if(r === 'end') break;
  }
  const got = fail ? n-1 : n;
  if(got > 0) addLog('════ 一连冲破 '+got+' 重境界，气机至此方歇 ════','epic');
  addSep();
  after();
}

/* 飞升结局 */
function ascend(){
  S.ended = true;
  META.ascensions = (META.ascensions||0) + 1;
  META.best.lv = Math.max(META.best.lv, S.level);
  saveMeta();
  const g = rebirthGain();
  const mountLine = S.equip.mount
    ? '座下【'+S.equip.mount.name+'】长鸣一声，随你一同没入云海。'
    : '你孤身一人，踏碎虚空而去。';
  showModal(
    '白 日 飞 升',
    '九道紫霄神雷自天穹垂落，尽数被你收入体内。<br>你回首望向这片修行了 <b>'+num(S.day)+'</b> 日的天地——'
    + '青云山麓的晨雾、幽冥沼泽的瘴气、天外仙宫的琉璃瓦，一一在眼底流转。<br>'
    + '你从一介炼气小修，走到准圣、圣人，直至叩问天道。<br><br>'
    + mountLine + '<br>'
    + '从此，天碑之上多了一个名字。<br>'
    + '<span style="color:var(--ink3);font-size:12.5px">斩妖 '+num(S.kills)+' 头 · 殒身 '+S.deaths+' 次 · 终境 '+realmName()+
      ' · 此为第 '+(META.ascensions)+' 次飞升</span><br><br>'
    + '<span style="font-size:12.5px">若就此转世，可结 <b>'+g+'</b> 点轮回点，并让下一世修炼更快。'
    + '留在本界亦可，顶栏「轮 回」随时可用。</span>',
    [{ label:'入 轮 回（+'+g+' 点）', primary:true, fn:()=>doRebirth() },
     { label:'留 于 此 界', fn:closeModal }]
  );
}

/* =========================================================
   妖兽系统
   ========================================================= */
function makeMonster(tier, boss){
  const lv = S.level;
  const base = 1 + tier*0.58;
  const k = 1 + lv*0.30;
  const m = {
    name: pick(MONSTERS[tier]) + (boss ? '（妖王）' : ''),
    tier, boss: !!boss,
    hpMax: Math.round(95 * base * k * (boss?2.8:1)),
    atk:   Math.round(11 * base * k * (boss?1.32:1)),
    def:   Math.round(3.4 * base * k * (boss?1.25:1)),
    crit:  5 + tier*3,
    exp:   Math.floor(expNeed(lv) * (0.45 + tier*0.18) * (boss?3.2:1)),
    stones:Math.round((10 + tier*16) * (1 + lv*0.32) * (boss?4:1))
  };
  m.hp = m.hpMax;
  return m;
}

function startFight(m, ctx){
  S.combat = { m, ctx: ctx||{}, turn:1 };
  S.fightPillN = 0;
  addSep();
  addLog('【'+m.name+'】出现在你面前——'+TIER_NAME[m.tier]+'，气血 '+num(m.hpMax)+'。','dmg');
  renderAll();
}

function dmgRoll(atk, def, crit, mult){
  let d = Math.max(1, atk*rf(0.86,1.14) - def*0.6);
  const isCrit = chance(crit);
  if(isCrit) d *= 1.85;
  return { d: Math.max(1, Math.round(d*(mult||1))), crit: isCrit };
}

function fightAttack(){ fightAction('atk'); }
function fightSkill(){ fightAction('skill'); }

function fightAction(kind){
  const c = S.combat;
  if(!c) return;
  const st = stats();
  const m = c.m;

  if(kind === 'defend'){
    c.defend = true;
    const rec = Math.round(st.mpMax*0.14);
    S.mp = Math.min(st.mpMax, S.mp + rec);
    addLog('你掐诀布下护体灵光，静待其势。（灵力 +'+rec+'）','sys');
    monsterTurn();
    after(); return;
  }

  if(kind === 'flee'){
    if(m.boss){ toast('妖王当前，无从遁走'); return; }
    const fc = Math.min(94, 58 + st.speed*0.8);
    if(chance(fc)){
      addLog('你脚下一错，踏罡步斗，身形暴退数十丈——脱身了。'
        + (st.speed ? '（坐骑遁速 +'+st.speed+'%）' : ''),'sys');
      endFight('flee');
    }else{
      addLog('你转身欲走，却被其拦住去路！','warn');
      monsterTurn();
    }
    after(); return;
  }

  let mult = 1, cost = 0;
  if(kind === 'skill'){
    cost = Math.round(st.mpMax*0.15) + 8;
    if(S.mp < cost){ toast('灵力不足（需 '+cost+'）'); return; }
    S.mp -= cost;
    mult = 2.3;
  }

  const r = dmgRoll(st.atk, m.def, st.crit, mult);
  m.hp -= r.d;
  addLog('你'+(kind==='skill' ? '催动灵力，一道灵光斩落' : '挥动法器直取')+'——'
    + (r.crit?'<b>暴击！</b>':'') + '造成 '+num(r.d)+' 点伤害。', r.crit?'epic':'dmg');

  if(m.hp <= 0){ winFight(); after(); return; }
  monsterTurn();
  after();
}

function monsterTurn(){
  const c = S.combat;
  if(!c || c.m.hp <= 0) return;
  const st = stats();
  const m = c.m;

  if(c.defend){
    const raw = dmgRoll(m.atk, st.def, m.crit, 1);
    const d = Math.max(1, Math.round(raw.d*0.32));
    S.hp -= d;
    addLog(m.name+'猛扑而来，被护体灵光卸去大半力道，你仍受 '+num(d)+' 点伤害。','sys');
    c.defend = false;
  }else{
    const r = dmgRoll(m.atk, st.def, m.crit, 1);
    S.hp -= r.d;
    addLog(m.name+(r.crit?'狞笑一声，一击命中要害':'扑上来撕咬')+'——你受 '+num(r.d)+' 点伤害'
      + (r.crit?'（暴击）':'') + '。','dmg');
  }
  if(S.hp <= 0){ loseFight(); return; }
  c.turn++;
}

function winFight(){
  const c = S.combat;
  const m = c.m;
  S.kills++;
  if(m.boss) S.stat.boss++;
  addLog('【'+m.name+'】发出一声哀鸣，轰然倒地。','epic');
  gainExp(m.exp);
  const got = fortStone(m.stones);
  S.stones += got; S.stat.stones += got;
  addLog('拾得灵石 '+num(got)+' 枚。','item');

  // 掉落（气运提高掉落概率）
  const dropChance = (m.boss ? 100 : fortDrop(26 + m.tier*7));
  if(chance(dropChance)){
    const it = rollItem(-1 + m.tier, 0.12 + m.tier*0.14 + (m.boss?0.28:0));
    addItem(it);
  }else if(chance(22)){
    const p = pick(PILLS);
    S.pills[p.name] = (S.pills[p.name]||0) + 1;
    addLog('从残骸中摸出一枚「'+p.name+'」。','item');
  }

  // 灵兽幼崽：只有凶兽以上的妖兽才有，妖王概率大涨
  const mtChance = fortDrop(m.boss ? 55 : (m.tier >= 1 ? 5 + m.tier*3.5 : 1.5));
  if(chance(mtChance)){
    addLog('你在其巢穴深处发现一枚尚有余温的兽卵——还能驯服。','act');
    addItem(rollMount(clamp(m.tier - 1, 0, 4), 0.10 + m.tier*0.13 + (m.boss?0.25:0)));
  }
  checkAch();
  endFight('win');
}

function loseFight(){
  playerDefeated();
}

function endFight(outcome){
  const c = S.combat;
  const ctx = c.ctx;
  S.combat = null;
  if(outcome === 'win' && ctx.type === 'boss'){ completeDungeon(); return; }
  if(outcome === 'win' && ctx.type === 'dungeon'){
    addLog('你退回秘境甬道，继续前行。','dim');
  }
  renderAll();
}

function playerDefeated(){
  S.combat = null;
  S.deaths++;
  const lose = Math.floor(S.exp * 0.25);
  S.exp = Math.max(0, S.exp - lose);
  advance(3);
  const st = stats();
  S.hp = Math.round(st.hpMax*0.3);
  S.mp = Math.round(st.mpMax*0.3);
  addLog('你眼前一黑，栽倒在地……','dmg');
  addLog('三日后于溪边醒来，周身剧痛。修为流失 '+num(lose)+'，气血仅余三成。','warn');
  if(S.dungeon){
    addLog('秘境之行就此中断，所得之物尽数遗落在深处。','warn');
    S.dungeon = null;
  }
  addSep();
  after();
}

/* ---------------- 历练 ---------------- */
function hunt(gi){
  if(S.combat || S.dungeon) return;
  const g = GROUNDS[gi];
  if(S.level < g.min){ toast('境界不足，需 '+realmAt(g.min).name); return; }
  const days = travelDays(g.days);
  advance(days);
  const r = Math.random()*100;
  if(r < 62){
    startFight(makeMonster(g.tier, chance(4)), { type:'hunt' });
    renderAll(); return;
  }else if(r < 78){
    const s = fortStone(Math.round((14 + g.tier*22) * (1 + S.level*0.3) * rf(0.7,1.4)));
    S.stones += s; S.stat.stones += s;
    addLog('你在'+g.name+'搜寻半日，于岩缝中寻得灵石 '+num(s)+' 枚。','item');
  }else if(r < 89){
    addLog('你在'+g.name+'游走'+days+'日，只见风过林梢，未遇敌手。','dim');
  }else if(r < 95){
    const it = rollItem(0, 0.15 + g.tier*0.12);
    addLog('涧边一具枯骨半掩于落叶之下，手中犹握一物。','act');
    addItem(it);
  }else if(r < 98){
    addLog('林间一只受伤的幼兽伏在溪边，见你并不躲闪，反而低鸣着凑了过来。','act');
    addItem(rollMount(clamp(g.tier-1, 0, 4), 0.12 + g.tier*0.13));
  }else{
    const d = Math.round(stats().hpMax*0.22);
    S.hp = Math.max(1, S.hp - d);
    addLog('你误入兽群伏击圈！一番苦战后脱身，气血 -'+num(d)+'。','warn');
  }
  checkAch();
  if(tryEncounter()) return;
  after();
}

/* =========================================================
   秘境系统
   ========================================================= */
function enterSecret(si){
  if(S.combat || S.dungeon) return;
  const d = SECRETS[si];
  if(S.level < d.min){ toast('境界不足，需 '+realmAt(d.min).name); return; }
  if(S.mp < d.mp){ toast('灵力不足，需 '+num(d.mp)); return; }
  S.mp -= d.mp;
  advance(travelDays(d.days));
  S.dungeon = { idx:si, floor:1, total:d.floors, searched:false, gained:0, items:0 };
  addSep();
  addLog('你以灵力 '+num(d.mp)+' 打开「'+d.name+'」的入口禁制，踏入其中。','epic');
  addLog(d.desc,'dim');
  S.stat.secEnter++;
  floorIntro();
  checkAch();
  after();
}

function floorIntro(){
  const d = S.dungeon, def = SECRETS[d.idx];
  if(d.floor === d.total){
    addLog('═══ 第 '+d.floor+' 层 · 终点 ═══  前方妖气冲霄，守关妖王的气息压得你几乎喘不过气。','warn');
  }else{
    addLog('─── 第 '+d.floor+'/'+d.total+' 层 ───','sys');
  }
}

function dungeonSearch(){
  const d = S.dungeon;
  if(!d || d.searched) return;
  d.searched = true;
  const def = SECRETS[d.idx];
  const r = Math.random()*100;

  if(r < 34){
    const s = fortStone(Math.round((30 + def.tier*70) * (1 + S.level*0.35) * rf(0.8,1.3)));
    S.stones += s; d.gained += s; S.stat.stones += s;
    addLog('崖壁暗格中藏着一只玉匣，启开是满满灵石。','item');
    addLog('灵石 +'+num(s),'gain');
  }else if(r < 54){
    const it = rollItem(ri(0,2), def.luck);
    if(addItem(it)) d.items++;
  }else if(r < 68){
    const e = Math.floor(expNeed(S.level) * (0.28 + def.tier*0.1));
    gainExp(e);
    addLog('石壁上刻着上古修士的修行心得，你默诵良久，受益匪浅。','act');
  }else if(r < 76){
    addLog('石室角落一只异兽被禁制锁了不知多少岁月，见你破阵，竟低头伏地。','act');
    addItem(rollMount(ri(0, def.tier+1), def.luck + 0.16));
  }else if(r < 90){
    addLog('你拨开藤蔓，一头妖兽猛然扑出！','warn');
    startFight(makeMonster(def.tier, false), { type:'dungeon' });
    renderAll(); return;
  }else{
    const dm = Math.round(stats().hpMax*0.18);
    S.hp = Math.max(1, S.hp - dm);
    addLog('脚下法阵骤然亮起，万千雷芒穿体而过——但你并非全无收获。','warn');
    const s = fortStone(Math.round((45 + def.tier*90) * (1 + S.level*0.35)));
    S.stones += s; S.stat.stones += s;
    addLog('气血 -'+num(dm)+'，却从阵眼中剥离出灵石 '+num(s)+' 枚。','dmg');
  }
  after();
}

function dungeonForward(){
  const d = S.dungeon;
  if(!d || d.floor >= d.total) return;
  const def = SECRETS[d.idx];
  const e = Math.floor(expNeed(S.level) * (0.16 + def.tier*0.06));
  gainExp(e);
  d.floor++;
  d.searched = false;
  advance(1);
  floorIntro();
  if(chance(48)){
    addLog('转角处一道黑影直扑而至！','warn');
    startFight(makeMonster(def.tier, false), { type:'dungeon' });
  }
  after();
}

function dungeonBoss(){
  const d = S.dungeon;
  if(!d) return;
  const def = SECRETS[d.idx];
  addLog('你踏上最后一级台阶，守关妖王缓缓转身——','dmg');
  startFight(makeMonster(def.tier, true), { type:'boss' });
  renderAll();
}

function completeDungeon(){
  const d = S.dungeon;
  const def = SECRETS[d.idx];
  addSep();
  addLog('═══ 「'+def.name+'」 已 被 贯 通 ═══','epic');
  const e = Math.floor(expNeed(S.level) * (0.9 + def.tier*0.35));
  gainExp(e);
  const s = fortStone(Math.round((160 + def.tier*380) * (1 + S.level*0.35)));
  S.stones += s; S.stat.stones += s;
  addLog('妖王陨落，其守护的宝藏尽归你手：灵石 +'+num(s)+'。','item');
  const n = def.tier + 1;
  for(let i=0;i<n;i++){
    const it = rollItem(ri(1,4), def.luck + 0.2);
    addItem(it);
  }
  addLog('你自秘境深处掠出，衣衫猎猎。此番所得，抵得上数月苦修。','epic');
  if(S.pills['破境丹'] === 0 && chance(50)){
    S.pills['破境丹'] = 1;
    addLog('妖王内丹中竟凝着一缕破境之机，可炼为破境丹。','item');
  }
  if(chance(38)){
    addLog('妖王尸身前，一头幼兽蜷缩着低鸣——它认你为主了。','act');
    addItem(rollMount(ri(1, def.tier+1), def.luck + 0.22));
  }
  S.dungeon = null;
  S.stat.secret++;
  if(META.secSet.indexOf(d.idx) < 0){ META.secSet.push(d.idx); saveMeta(); }
  addSep();
  checkAch();
  after();
}

function dungeonLeave(){
  const d = S.dungeon;
  if(!d) return;
  addLog('你见好就收，循原路退出「'+SECRETS[d.idx].name+'」。','sys');
  S.dungeon = null;
  after();
}

/* =========================================================
   坊市 / 装备
   ========================================================= */
function refreshShop(free){
  if(!free){
    if(S.stones < 3){ toast('灵石不足'); return; }
    S.stones -= 3;
    addLog('你付了 3 枚灵石，请掌柜换了批新货。','dim');
  }
  S.shop = [];
  for(let i=0;i<4;i++){
    S.shop.push(rollItem(ri(-1,2), 0.08 + S.level/60));
  }
  // 灵兽栏：坊市常设一头坐骑，随境界与刷新浮动
  const mt = clamp(ri(0,1) + Math.floor(S.level/12), 0, 4);
  S.shopMount = rollMount(mt, 0.10 + S.level/70);
  S.shopDay = S.day;
  if(!free) after();
}

function buyMount(){
  const m = S.shopMount;
  if(!m) return;
  const cost = mountCost(m);
  if(S.stones < cost){ toast('灵石不足（需 '+num(cost)+'）'); return; }
  S.stones -= cost;
  addLog('你以 '+num(cost)+' 枚灵石从灵兽栏中买下【'+m.name+'】。','item');
  addItem(m, true);
  S.shopMount = null;
  after();
}

/* 喂养坐骑：以灵石淬炼，每阶重算属性 */
function feedMount(){
  if(noBusy('战中无暇温养灵兽')) return;
  const m = S.equip.mount;
  if(!m){ toast('尚无坐骑'); return; }
  if(m.lv >= MOUNT_MAX_LV){ toast('此兽已至化境，无需再喂'); return; }
  const cost = mountFeedCost(m);
  if(S.stones < cost){ toast('灵石不足（需 '+num(cost)+'）'); return; }
  S.stones -= cost;
  m.lv++;
  applyMountStats(m);
  if(m.lv > S.stat.mountMax) S.stat.mountMax = m.lv;
  checkAch();
  addLog('你以灵石温养【'+m.name+'】，其气息愈发凝练——已至 '+m.lv+' 阶，战力 '+num(m.power)+'。','gain');
  clampVitals(); after();
}

function releaseMount(){
  if(noBusy('战中无暇他顾')) return;
  const m = S.equip.mount;
  if(!m) return;
  S.equip.mount = null;
  addLog('你松了缰绳，【'+m.name+'】长鸣一声，没入云中。','dim');
  clampVitals(); after();
}

function buyItem(i){
  const it = S.shop[i];
  if(!it) return;
  const cost = itemCost(it);
  if(S.stones < cost){ toast('灵石不足（需 '+num(cost)+'）'); return; }
  S.stones -= cost;
  S.shop.splice(i,1);
  addLog('你以 '+num(cost)+' 枚灵石购得【'+it.name+'】。','item');
  addItem(it, true);
  after();
}

function buyPill(name){
  const p = PILLS.find(x=>x.name===name);
  if(!p) return;
  if(S.stones < p.price){ toast('灵石不足（需 '+p.price+'）'); return; }
  S.stones -= p.price;
  S.pills[name] = (S.pills[name]||0) + 1;
  addLog('购得「'+name+'」一枚。','item');
  after();
}

function equipBag(id){
  if(noBusy('战中无暇换装')) return;
  const i = S.bag.findIndex(x=>x.id===id);
  if(i < 0) return;
  const it = S.bag[i];
  if(it.slot === 'treasure'){
    let slot = S.equip.treasures.indexOf(null);
    if(slot < 0) slot = 0;
    const old = S.equip.treasures[slot];
    S.equip.treasures[slot] = it;
    S.bag.splice(i,1);
    if(old) S.bag.push(old);
  }else if(it.slot === 'mount'){
    const old = S.equip.mount;
    S.equip.mount = it;
    S.bag.splice(i,1);
    if(old) S.bag.push(old);
  }else{
    const old = S.equip[it.slot];
    S.equip[it.slot] = it;
    S.bag.splice(i,1);
    if(old) S.bag.push(old);
  }
  addLog(it.slot === 'mount'
    ? '你翻身上了【'+it.name+'】，四蹄生云。'
    : '你祭炼了【'+it.name+'】，将其纳入体内温养。','act');
  clampVitals();
  after();
}

function unequip(slotKey, idx){
  if(noBusy('战中无暇换装')) return;
  let it;
  if(slotKey === 'treasure'){
    it = S.equip.treasures[idx];
    if(!it) return;
    S.equip.treasures[idx] = null;
  }else{
    it = S.equip[slotKey];
    if(!it) return;
    S.equip[slotKey] = null;
  }
  S.bag.push(it);
  addLog('你收回【'+it.name+'】。','dim');
  clampVitals();
  after();
}

function dropItem(id){
  if(noBusy()) return;
  const i = S.bag.findIndex(x=>x.id===id);
  if(i < 0) return;
  const it = S.bag[i];
  S.bag.splice(i,1);
  addLog('你将【'+it.name+'】弃于荒野。','dim');
  after();
}

/* =========================================================
   出售 · 以器易石
   ========================================================= */
const SELL_TYPES = [
  {k:'all', n:'全部'}, {k:'weapon', n:'武器'}, {k:'armor', n:'防具'},
  {k:'treasure', n:'法宝'}, {k:'mount', n:'坐骑'}
];
const SELL_Q = [
  {k:'all', n:'全部'}, {k:'0', n:'凡品'}, {k:'1', n:'灵品'},
  {k:'2', n:'宝品'}, {k:'3', n:'仙品'}, {k:'4', n:'神品'}
];
let SELL = { type:'all', q:'all' };

function setSell(type, q){
  if(type) SELL.type = type;
  if(q) SELL.q = q;
  after();
}
function matchSell(it){
  if(SELL.type !== 'all'){
    if(SELL.type === 'mount'){ if(!isMount(it)) return false; }
    else if(it.slot !== SELL.type || isMount(it)) return false;
  }
  if(SELL.q !== 'all' && it.q !== +SELL.q) return false;
  return true;
}
function sellBatch(){
  if(noBusy('战中无暇谈价')) return;
  const list = S.bag.filter(matchSell);
  if(!list.length){ toast('没有符合条件的器物'); return; }
  let tot = 0;
  for(const it of list){
    const i = S.bag.indexOf(it);
    if(i >= 0) S.bag.splice(i,1);
    tot += sellPrice(it);
  }
  S.stones += tot;
  S.stat.stones += tot;
  addLog('你抱出一堆器物摊在柜上，掌柜逐件验看，共付灵石 '+num(tot)+' 枚（'+list.length+' 件）。','item');
  checkAch();
  after();
}
function sellQuality(maxQ){
  if(noBusy('战中无暇谈价')) return;
  const list = S.bag.filter(x => x.q <= maxQ);
  if(!list.length){ toast('没有符合条件的器物'); return; }
  let tot = 0;
  for(const it of list){
    const i = S.bag.indexOf(it);
    if(i >= 0) S.bag.splice(i,1);
    tot += sellPrice(it);
  }
  S.stones += tot;
  S.stat.stones += tot;
  addLog('你把那些用不上的器物尽数卖给掌柜，得灵石 '+num(tot)+' 枚（'+list.length+' 件）。','item');
  checkAch();
  after();
}
function sellBagItem(id){
  if(noBusy('战中无暇谈价')) return;
  const i = S.bag.findIndex(x=>x.id===id);
  if(i < 0) return;
  const it = S.bag[i], p = sellPrice(it);
  S.bag.splice(i,1);
  S.stones += p;
  S.stat.stones += p;
  addLog('你将【'+it.name+'】售与坊市，得灵石 '+num(p)+' 枚。','item');
  checkAch();
  after();
}
function sellEquipped(key, idx){
  if(noBusy('战中无暇谈价')) return;
  let it = null;
  if(key === 'treasure'){
    it = S.equip.treasures[idx];
    if(!it) return;
    S.equip.treasures[idx] = null;
  }else{
    it = S.equip[key];
    if(!it) return;
    S.equip[key] = null;
  }
  const p = sellPrice(it);
  S.stones += p;
  S.stat.stones += p;
  addLog('你解下【'+it.name+'】当场售出，得灵石 '+num(p)+' 枚。','item');
  clampVitals(); checkAch(); after();
}

function usePill(name, force){
  if(!S.pills[name]) return;
  if(!force && busy()){ toast('战中无暇服丹，请在战斗面板中点「服丹」'); return; }
  const st = stats();
  if(name === '回春丹'){
    if(S.hp >= st.hpMax){ toast('气血已满'); return; }
    S.pills[name]--;
    S.hp = Math.min(st.hpMax, S.hp + Math.round(st.hpMax*0.45));
    addLog('你服下回春丹，暖流游走周身，伤口以肉眼可见的速度愈合。','gain');
  }else if(name === '聚灵丹'){
    if(S.mp >= st.mpMax){ toast('灵力已满'); return; }
    S.pills[name]--;
    S.mp = Math.min(st.mpMax, S.mp + Math.round(st.mpMax*0.65));
    addLog('聚灵丹入喉即化，枯竭的灵力迅速充盈。','gain');
  }else{
    const stack = S.pillStack||0;
    if(stack >= 3){ toast('丹田药力已至极限，再服无益'); return; }
    S.pills[name]--;
    S.pillStack = stack + 1;
    addLog('你服下第 '+(stack+1)+' 枚破境丹，一股雄浑药力沉入丹田，静待突破之时迸发。'
      + '（本次突破 +'+pillBonus()+'%）','epic');
  }
  S.stat.pillUse++;
  after();
}

   渲染

function renderAll(){
  if(!S) return;
  clampVitals();
  renderTop();
  renderChar();
  renderEquip();
  renderPills();
  renderMount();
  renderBag();
  renderTabs();
  renderActions();
  renderUtil();

}

function renderTop(){
  const st = stats();
  $('topRealm').textContent = realmName();
  $('topDay').textContent = '第 ' + num(S.day) + ' 日';
  $('topStones').textContent = num(S.stones);
  $('topPower').textContent = num(st.power);
  const f = fortune();
  $('topLuck').textContent = f;
  $('luckTs').className = 'ts luck' + (f >= 50 ? ' hi' : '');
  const ab = $('achBtn');
  if(ab) ab.textContent = '成 就 ' + achList().length + ' / ' + ACHIEVEMENTS.length;

      box.style.display = 'none';
    }

function renderChar(){
  const st = stats();
  const need = expNeed(S.level);
  const can = S.exp >= need;
  const n = can ? Math.max(1, readyCount()) : 0;
  $('expTxt').textContent = num(S.exp) + ' / ' + num(need) + (n > 1 ? '　可连破 ×' + n : (can ? '　圆满' : ''));
  $('expTxt').style.color = can ? 'var(--zhu)' : '';
  $('expBar').style.width = clamp(S.exp/need*100,0,100) + '%';
  $('hpTxt').textContent = num(S.hp) + ' / ' + num(st.hpMax);
  $('hpBar').style.width = clamp(S.hp/st.hpMax*100,0,100) + '%';
  $('mpTxt').textContent = num(S.mp) + ' / ' + num(st.mpMax);
  $('mpBar').style.width = clamp(S.mp/st.mpMax*100,0,100) + '%';
  $('sAtk').textContent = num(st.atk);
  $('sDef').textContent = num(st.def);
  $('sCrit').textContent = st.crit + '%';
  $('sCult').textContent = '+' + st.cult + '%';
  $('sSpeed').textContent = '+' + st.speed + '%';
  const f = fortune();
  $('sLuck').textContent = f;
  $('sLuck').style.color = f >= 50 ? 'var(--zhu)' : '';
  $('sKill').textContent = num(S.kills);
  $('sDeath').textContent = num(S.deaths);
}

function slotRow(label, it, key, idx){
  if(!it){
    return '<div class="slot"><span class="k">'+label+'</span><span class="v empty">— 空 —</span></div>';
  }
  const body = '<span class="v">'+ (isMount(it) ? mountLabel(it) : itemLabel(it)) +'</span>'
    + (busy()
        ? '<span class="r" style="opacity:.3">卸下</span>'
        : '<span class="r" onclick="unequip(\''+key+'\','+idx+')">卸下</span>'
          + '<span class="r sell" onclick="sellEquipped(\''+key+'\','+idx+')">售'+num(sellPrice(it))+'</span>');
  return '<div class="slot'+godCls(it.q)+'"><span class="k">'+label+'</span>'+body+'</div>';
}

function renderEquip(){
  let h = '';
  h += slotRow('武器', S.equip.weapon, 'weapon', 0);
  h += slotRow('防具', S.equip.armor, 'armor', 0);
  for(let i=0;i<3;i++){
    h += slotRow('法宝'+(i+1), S.equip.treasures[i], 'treasure', i);
  }
  $('equipBox').innerHTML = h;

  const tag = $('autoTag');
  tag.textContent = '自动换装 · ' + (S.autoEquipOn ? '开' : '关');
  tag.style.color = S.autoEquipOn ? 'var(--qing)' : 'var(--ink4)';
  tag.style.border = '1px solid ' + (S.autoEquipOn ? 'var(--qing)' : 'var(--line2)');
  tag.style.borderRadius = '2px';
  tag.style.padding = '1px 6px';
}

function renderMount(){
  const m = S.equip.mount;
  const box = $('mountBox');
  const tag = $('mountTag');

/* 自动装备：按战力择优（法宝含修炼加成权重，坐骑含遁速权重） */
function autoEquip(){
  const all = [];
  ['weapon','armor','mount'].forEach(k => { if(S.equip[k]) all.push(S.equip[k]); S.equip[k] = null; });
  for(let i=0;i<3;i++){ if(S.equip.treasures[i]) all.push(S.equip.treasures[i]); S.equip.treasures[i] = null; }
  all.push(...S.bag);
  S.bag = [];

  const by = { weapon:[], armor:[], treasure:[], mount:[] };
  for(const it of all) if(by[it.slot]) by[it.slot].push(it);
  const best = k => by[k].sort((a,b) => b.power - a.power);

  S.equip.weapon = best('weapon')[0] || null;
  S.equip.armor  = best('armor')[0]  || null;
  S.equip.mount  = best('mount')[0]  || null;
  const ts = best('treasure');
  for(let i=0;i<3;i++) S.equip.treasures[i] = ts[i] || null;

  const used = new Set();
  ['weapon','armor','mount'].forEach(k => { if(S.equip[k]) used.add(S.equip[k].id); });
  S.equip.treasures.forEach(t => { if(t) used.add(t.id); });
  S.bag = all.filter(it => !used.has(it.id)).slice(0, 40);

  addLog('你以神识扫过周身器物，挑出威能最盛者重新祭炼——战力至此为 '+num(stats().power)+'。','act');
  clampVitals(); after();
}

function unequipAll(){
  ['weapon','armor','mount'].forEach(k=>{ if(S.equip[k]){ S.bag.push(S.equip[k]); S.equip[k]=null; } });
  for(let i=0;i<3;i++){ if(S.equip.treasures[i]){ S.bag.push(S.equip.treasures[i]); S.equip.treasures[i]=null; } }
  addLog('你解下周身法器与坐骑，纳入储物袋中。','dim');
  clampVitals(); after();
}

const SAVE_KEY = 'xiuxian_save_v2';
const SAVE_OLD = 'xiuxian_save_v1';
const SLOT_N = 3;
const slotKey = i => 'xiuxian_slot_'+i+'_v2';

function saveData(){
  return {
    v:2,
    level:S.level, exp:S.exp, day:S.day, stones:S.stones,
    hp:S.hp, mp:S.mp, equip:S.equip, bag:S.bag, pills:S.pills,
    shop:S.shop, shopMount:S.shopMount, shopDay:S.shopDay,
    pillStack:S.pillStack, breakStreak:S.breakStreak,
    autoEquipOn:S.autoEquipOn,
    kills:S.kills, deaths:S.deaths, tab:S.tab,
    stat:S.stat, encDay:S.encDay,
    logs:S.logs.slice(-90), ended:S.ended,
    t: Date.now()
  };
}
function save(){

}
function hardWipeSave(){
  try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_OLD); }catch(e){}
}

let REH_UID = 700000;
function rehydrate(it){
  if(!it) return null;
  const o = Object.assign({}, it);
  o.id = ++REH_UID;
  if(o.power === undefined){
    o.power = Math.round((o.atk||0)*2 + (o.def||0)*2.6 + (o.hp||0)*0.16
      + (o.mp||0)*0.1 + (o.crit||0)*6 + (o.cult||0)*5 + (o.speed||0)*14);
  }
  return o;
}

/* 把一份存档数据装回运行时状态（读档 / 玉简 / 导入共用） */
function restore(d){
  if(!d || typeof d.level !== 'number') return false;
  const eq = d.equip || {};
  S = {
    level: d.level||0,
    exp: d.exp||0,
    day: d.day||1,
    stones: d.stones||0,
    hp: d.hp||1,
    mp: d.mp||0,
    equip:{
      weapon: eq.weapon ? rehydrate(eq.weapon) : null,
      armor:  eq.armor  ? rehydrate(eq.armor)  : null,
      mount:  eq.mount  ? rehydrate(eq.mount)  : null,
      treasures: (eq.treasures || [null,null,null]).map(x => x ? rehydrate(x) : null)
    },
    bag: (d.bag||[]).map(rehydrate),
    pills: Object.assign({'回春丹':0,'聚灵丹':0,'破境丹':0}, d.pills||{}),
    logs: d.logs||[],
    combat:null,
    dungeon:null,
    shop:(d.shop||[]).map(rehydrate),
    shopMount: d.shopMount ? rehydrate(d.shopMount) : null,
    shopDay: d.shopDay||1,
    /* 旧版 buffBreak 迁移为破境丹药力层数 */
    pillStack: (d.pillStack !== undefined) ? d.pillStack : ((d.buffBreak||0) > 0 ? 1 : 0),
    breakStreak: d.breakStreak||0,
    autoEquipOn: d.autoEquipOn !== false,
    kills: d.kills||0,
    deaths: d.deaths||0,
    tab: d.tab||'cult',
    ended: !!d.ended,
    stat: Object.assign(blankStat(), d.stat||{}),
    encDay: d.encDay||0,
    encOpen: null
  };
  while(S.equip.treasures.length < 3) S.equip.treasures.push(null);
  if(!S.logs.length) addLog('你重新睁开双眼，前尘如故。','sys');
  if(!S.shop.length) refreshShop(true);
  /* 旧存档（坐骑系统之前）没有 shopMount 字段，补一头 */
  else if(d.shopMount === undefined){
    S.shopMount = rollMount(clamp(ri(0,1)+Math.floor(S.level/12), 0, 4), 0.10 + S.level/70);
  }
  clampVitals();
  return true;
}

function load(){

  }catch(e){ return false; }
}
