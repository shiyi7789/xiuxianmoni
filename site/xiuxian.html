/* ---------- 左栏「材 料」面板 ---------- */
function renderMaterials(){
  const box = $('matBox');
  if(!box) return;
  const owned = MAT_ORDER.filter(k => countMat(k) > 0);

  const tag = $('matTag');
  if(tag) tag.textContent = owned.length + ' / ' + MAT_ORDER.length;

  if(!owned.length){
    box.innerHTML = '<div class="empty-note">囊 中 尚 无 材 料</div>'
      + '<div class="hint-mini">斩妖剥皮、秘境采撷、岩缝拾矿皆有所得。'
      + '材料可在「坊 市」页炼丹与炼器。</div>';
    return;
  }

  let h = '';
  for(const k of owned){
    const m = MATERIALS[k];
    const n = countMat(k);
    h += '<div class="slot'+godCls(m.t)+'">'
      + '<span class="k" style="flex:0 0 58px">'+m.n+'</span>'
      + '<span class="v">'+qName('×'+num(n), m.t)+'</span>'
      + '<span class="q qc'+m.t+'">'+matTierName(m.t)+'</span>'
      + '</div>';
  }
  h += '<div class="hint-mini">材料归本局所有，不随轮回带走。炼制请至「坊 市」页。</div>';
  box.innerHTML = h;
}

/* =========================================================
   坊市页 · 三段
   ========================================================= */

/* ---------- 丹 房 ---------- */
function renderPillSection(){
  let h = '<div class="tip" style="margin-top:18px">丹 房 · 炼 丹'
    + ((S.pillStack || 0) > 0 ? '　<span class="muted-sm">丹田已蓄破境丹药力 '+S.pillStack+' 枚</span>' : '')
    + '</div>';
  h += '<div class="actgrid">';
  for(const r of PILL_RECIPES) h += crRecipeCard(r, 'pill');
  h += '</div>';
  h += '<div class="tip" style="font-size:11px">炼制消耗<b>灵力与天数</b>（不耗灵石）；失败返还四成材料。'
    + '丹道传承与境界优势可提升成丹率——越级炼则每差一档 -6%。</div>';
  return h;
}

/* ---------- 器 坊 ---------- */
function renderGearSection(){
  let h = '<div class="tip" style="margin-top:18px">器 坊 · 炼 器</div>';
  h += '<div class="actgrid">';
  for(const r of GEAR_RECIPES) h += crRecipeCard(r, 'gear');
  h += '</div>';
  h += '<div class="tip" style="font-size:11px">所成之器品质随机，至少为'
    + ' <span class="qname qc2">宝品</span>；<b>气运</b>与<b>越级炼器</b>可再提一阶，'
    + '最高 <span class="flow q4">神品</span>。'
    + '坊市刷不出仙品武器，但你可以反复炼——这就是把随机产出变成可控产出。</div>';
  return h;
}

/* ---------- 材 料 铺 ---------- */
function renderMatShopSection(){
  let h = '<div class="tip" style="margin-top:18px">材 料 铺</div>';
  h += '<div class="actgrid">';
  for(const row of MAT_SHOP){
    const m = MATERIALS[row.k];
    if(!m) continue;
    const can = S.stones >= row.price;
    h += '<div class="card'+(can ? '' : ' lock')+'"'
      + (can ? ' onclick="crUiBuyMat(\''+row.k+'\',1)"' : '')+'>'
      + '<div class="t">'+qName(m.n, m.t)+' <span class="tier-tag">'+matTierName(m.t)+'</span></div>'
      + '<div class="d">来路：'+m.src+'</div>'
      + '<div class="cost">'+row.price+' 灵石 · 已有 '+countMat(row.k)+'</div>'
      + '</div>';
  }
  h += '</div>';
  h += '<div class="tip" style="font-size:11px">材料主要靠<b>打怪与探秘境</b>捡，近乎免费；'
    + '材料铺只是<b>应急补差</b>，故标价略高于成品。'
    + '星辰砂与混沌石不上架——只能自己去高阶秘境与妖王身上找。</div>';
  return h;
}

/* =========================================================
   配方卡片
   ========================================================= */
function crRecipeCard(r, type){
  const isPill = (type === 'pill');
  const rate = Math.round((isPill ? pillCraftRate(r.k) : gearCraftRate(r.k)) * 100);
  const mp = craftMp(r);
  const canOne = isPill ? canCraftPill(r.k, 1) : canCraftGear(r.k, 1);
  const canFive = isPill ? canCraftPill(r.k, 5) : canCraftGear(r.k, 5);
  const fn = isPill ? 'crUiCraftPill' : 'crUiCraftGear';
  const title = isPill
    ? '《'+r.out+'》'
    : ({ weapon:'铸 · 兵 器', armor:'铸 · 护 甲', treasure:'铸 · 法 宝' }[r.slot] || '铸 器');
  const lvTag = (r.lv > 0) ? ' <span class="tier-tag">需 '+realmNameOf(r.lv)+'</span>' : '';

  let h = '<div class="card'+(canOne ? ' hot' : ' lock')+'">';
  h += '<div class="t">'+title+lvTag+'</div>';
  h += '<div class="d">'+r.d+'</div>';
  h += '<div class="d" style="margin-top:4px">用料：'+matText(r.need)+'</div>';
  h += '<div class="cost">成率 '+rate+'% · 灵力 '+num(mp)+' · '+r.days+' 日/次'
    + (isPill ? '' : ' · 最低 '+matTierName(r.qiMin))+'</div>';

  if(canOne){
    h += '<div style="display:flex;gap:6px;margin-top:7px">'
      + '<button class="mbtn" style="flex:1;padding:5px 0;font-size:11.5px;letter-spacing:.06em"'
      + ' onclick="'+fn+'(\''+r.k+'\',1)">炼 一 次</button>'
      + (canFive ? '<button class="mbtn" style="padding:5px 12px;font-size:11.5px;letter-spacing:.06em"'
          + ' onclick="'+fn+'(\''+r.k+'\',5)">×5</button>' : '')
      + '</div>';
  }else{
    const why = craftBlockReason(r) || '暂无余裕';
    h += '<div class="hint-mini" style="margin-top:6px">'+why+'</div>';
  }
  h += '</div>';
  return h;
}

/* =========================================================
   按 钮（crUi 前缀，必须是顶层 function 声明）
   ========================================================= */
function crUiCraftPill(k, n){ craftPill(k, n); }
function crUiCraftGear(k, n){ craftGear(k, n); }
function crUiBuyMat(k, n){ buyMaterial(k, n); }

/* ── ui/panels/cave.js ──────────────────────────────────────────── */

/* =========================================================
   洞 府 · 面 板
   ---------------------------------------------------------
   规则：
   · 面板操作函数一律 cvUi 前缀（构建后同作用域，重名会静默覆盖）
   · 只用具名导入（禁止 import * as / 默认导入，构建器会剥掉整行）
   · 不新增配色：面板行复用 .heritage / .hr / .hn / .hl / .dots / .hd / .hb
   · 弹层而非新页签（#tabs 移动端写死 5 等分，加第 6 个会破坏布局）
   ========================================================= */

/* ---------- 左栏摘要 ---------- */
function renderCave(){
  const box = $('caveBox');
  if(!box) return;
  if(!caveEnsure()){ box.innerHTML = ''; return; }

  const tag = $('caveTag');
  if(tag) tag.textContent = cvTotalLv() + ' / ' + cvTotalMax();

  const b = cvBonus();
  const parts = [];
  if(b.herb)     parts.push('灵草 ' + b.herb.toFixed(2) + '/时');
  if(b.stone)    parts.push('灵石 ' + b.stone + '/时');
  if(b.cult)     parts.push('修速 +' + b.cult + '%');
  if(b.pillRate) parts.push('成丹 +' + Math.round(b.pillRate*100) + '%');
  if(b.gearRate) parts.push('成器 +' + Math.round(b.gearRate*100) + '%');

  let h = '<div class="hint-mini">'
    + (parts.length ? parts.join(' · ') : '洞府尚未开垦，点下方开始布置。')
    + '</div>';
  h += '<div style="margin-top:8px">'
    + '<button class="mbtn" style="width:100%;padding:6px 0;font-size:11.5px;letter-spacing:.08em"'
    + ' onclick="cvUiOpen()">整 修 洞 府</button></div>';
  box.innerHTML = h;
}

/* ---------- 弹层 ---------- */
function cvUiOpen(){
  const capH = cvOfflineCapHours();
  const full = caveFullCost();
  let h = '<div class="meta-note" style="margin-bottom:10px">'
    + '洞府五处：<b>灵田</b>产灵草、<b>聚灵阵</b>加修速并自动凝石、<b>丹房</b>加成丹率、'
    + '<b>器坊</b>加成器率、<b>静室</b>延长离线可累积时长。<br>'
    + '升级消耗<b>灵石与天数</b>（天数即时光流逝，与出门打怪形成节奏竞争）。'
    + '离线时灵田与聚灵阵仍在运转 —— 可累积时长上限为 <b>' + capH + ' 小时</b>，超出的部分不再计入。<br>'
    + '洞府归本局所有，<b>轮回清零</b>（与装备、灵石、材料同轴）。'
    + '<span class="muted-sm">五处全满约需 ' + num(full.stones) + ' 灵石 · ' + full.days + ' 日。</span>'
    + '</div>';

  h += '<div class="pb-scroll">';
  for(const f of CAVE_FACILITIES) h += cvFacRow(f);
  h += '</div>';

  showModal('洞 府 · 经 营', h, [{ label:'关 闭', primary:true, fn: closeModal }], 'wide');
}

function cvFacRow(f){
  const lv = cvFacLv(f.k);
  const max = f.max;
  const full = lv >= max;
  const cost = full ? null : f.cost(lv + 1);
  const can = !!(cost && S && S.stones >= cost.stones);
  const eff = lv > 0 ? cvFacSummary(f, lv) : '未 建';
  const nextEff = full ? null : cvFacSummary(f, lv + 1);

  let dots = '<span class="dots">';
  for(let i = 0; i < max; i++) dots += '<i class="' + (i < lv ? 'f' : '') + '"></i>';
  dots += '</span>';

  let acts;
  if(full){
    acts = '<button class="hb dis" style="margin-left:0;padding:4px 10px">已 圆 满</button>';
  }else{
    const price = num(cost.stones);
    const onclick = can
      ? 'cvUiUp(\'' + f.k + '\')'
      : 'toast(\'灵石不足（需 ' + price + '）\')';
    acts = '<button class="hb' + (can ? '' : ' dis') + '"'
      + ' style="margin-left:0;padding:4px 10px"'
      + ' onclick="' + onclick + '">整 修 · ' + price + '</button>';
  }

  return '<div class="heritage">'
    + '<div class="hr">'
    +   '<span class="hn">' + f.n + '</span>'
    +   '<span class="hl">' + lv + ' / ' + max + '</span>'
    +   dots
    +   '<span style="margin-left:auto">' + acts + '</span>'
    + '</div>'
    + '<div class="hd">' + f.d + '</div>'
    + '<div class="hd">当前 <b>' + eff + '</b>'
    +   (nextEff ? '　→　下级 <b>' + nextEff + '</b>' : '')
    +   (cost ? '　（费 ' + num(cost.stones) + ' 灵石 · ' + cost.days + ' 日）' : '')
    + '</div>'
    + '</div>';
}

function cvUiUp(k){
  if(cvUpgrade(k)) cvUiOpen();
}

/* ---------- 离线归来 ---------- */
function cvShowOfflineReport(report){
  if(!report) return;
  const timeTxt = cvFmtDuration(report.elapsedMs);
  let h = '<div class="encintro">'
    + '你自入定中醒来，洞府一切如常。离山 <b>' + timeTxt + '</b>'
    + (report.capped ? '（已达上限）' : '')
    + '，灵田与聚灵阵一日未曾停歇。</div>';
  h += '<div class="heritage">';
  if(report.herb > 0){
    h += '<div class="hr"><span class="hn">灵 田</span>'
      + '<span class="hl" style="margin-left:auto">已收 <b>' + report.herb + '</b> 株灵草</span></div>';
  }
  if(report.stone > 0){
    h += '<div class="hr"><span class="hn">聚 灵 阵</span>'
      + '<span class="hl" style="margin-left:auto">已凝 <b>' + num(report.stone) + '</b> 枚灵石</span></div>';
  }
  h += '</div>';
  if(report.capped){
    h += '<div class="meta-note" style="margin-top:10px">'
      + '离线累积已达 <b>' + cvOfflineCapHours() + ' 小时</b>上限，超出的部分不再计入。'
      + '升级「静 室」可延长可累积时长。</div>';
  }
  showModal('闭 关 归 来', h, [{ label:'收 下', primary:true, fn: closeModal }], 'wide');
}

/* ── main.js ────────────────────────────────────────────────────── */

/* =========================================================
   启动
   ========================================================= */
(function boot(){
  UID = 900000;
  applyTheme();
  watchSystemTheme();
  loadMeta();

  /* 读档 / 新号 + 离线结算
     结算必须在 renderAll 之前——它会改灵石与材料，先算后画才能一次画对 */
  let offlineReport = null;
  if(load()){
    offlineReport = cvSettleOffline();
    renderAll();
  }else{
    newGame();
  }

  /* 首次进入：先请玩家阅读游玩声明（点「我已知晓」后才记录） */
  if(!noticeAccepted()) showNotice();
  /* 老玩家回归：补发历史上其实已经达成的成就 */
  const got = checkAch();
  if(got.length) renderAll();
  /* 闭关归来：放在声明与成就之后，免得打断它们 */
  if(offlineReport) cvShowOfflineReport(offlineReport);
  window.addEventListener('beforeunload', () => { try{ save(); saveMeta(); }catch(e){} });
})();
</script>
