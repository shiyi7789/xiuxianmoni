/* -------- 存档码：导出 / 导入 -------- */
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function b64dec(txt){
  const bin = atob(String(txt).trim());
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function exportCode(){
  const pack = { s: saveData(), m: META };
  return 'XXLX1.' + b64enc(JSON.stringify(pack));
}
function copyCode(){
  const el = $('saveCode');
  const code = exportCode();
  if(el) el.value = code;
  const done = () => toast('存档码已复制');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(done).catch(()=>{ if(el){ el.select(); document.execCommand('copy'); done(); } });
      return;
    }
  }catch(e){}
  if(el){ el.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选中'); } }
}
function importSave(text){
  try{
    const t = String(text||'').trim();
    if(!t){ toast('请先粘贴存档码'); return; }
    const body = t.indexOf('XXLX1.') === 0 ? t.slice(6) : t;
    const obj = JSON.parse(b64dec(body));
    const sd = obj.s ? obj.s : obj;
    if(!restore(sd)){ toast('存档码无效'); return; }
    if(obj.m) applyMeta(obj.m);
    closeModal();
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(saveData())); }catch(e){}
    addLog('一纸残卷自虚空中落下，其上正是你走过的路——旧日道途，重新展开。','epic');
    renderAll();
    toast('存档已导入');
  }catch(e){ toast('存档码无法解析'); }
}
function importFile(){
  const el = $('impFile');
  if(!el) return;
  el.value = '';
  el.click();
}
function onImportFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = () => importSave(String(fr.result||''));
  fr.onerror = () => toast('文件读取失败');
  fr.readAsText(f);
}
function downloadSave(){
  const code = exportCode();
  const blob = new Blob([code], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '修仙存档-'+realmName()+'-第'+S.day+'日.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
function fmtTime(ts){
  try{
    const d = new Date(ts);
    const p = n => (n<10?'0':'')+n;
    return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){ return ''; }
}

function rebirthGain(){
  if(!S) return 1;
  return Math.max(1, 1 + Math.floor(S.level/3) + Math.floor(S.kills/30));
}

function openRebirth(){
  const g = rebirthGain();
  const next = META.rebirths + 1;
  showModal('轮 回 转 世',
    '你将以今世的全部所得，换一枚投向未来的种子。<br><br>'
    + '今世：<b>'+realmName()+'</b> · 修行 <b>'+num(S.day)+'</b> 日 · 斩妖 <b>'+num(S.kills)+'</b> 头 · 战力 <b>'+num(stats().power)+'</b><br>'
    + '可结轮回点 <b>'+g+'</b>；下一世为 <b>第 '+next+' 世</b>，轮回印记使修炼速度 <b>+'+Math.min(20,next*2)+'%</b>。<br><br>'
    + '<span style="color:var(--ink3);font-size:12.5px">灵石、法器、丹药、境界与修为尽数归零，进度归零重来；'
    + '已点化的传承与轮回印记永不消散，故每一世都比上一世更好走。</span>',
    [{label:'再 想 想', fn:closeModal},
     {label:'入 轮 回（+'+g+' 点）', primary:true, fn:()=>doRebirth()}]);
}

function doRebirth(){
  if(!S) return;
  const g = rebirthGain();
  META.points += g;
  META.rebirths++;
  META.totalKills += S.kills;
  META.totalDeaths += S.deaths;
  META.best.lv = Math.max(META.best.lv, S.level);
  META.best.day = Math.max(META.best.day, S.day);
  META.best.kills = Math.max(META.best.kills, S.kills);
  if(S.ended) META.ascensions = (META.ascensions||0) + 1;
  /* 历世累计（成就判定跨越轮回） */
  const s0 = S.stat || blankStat();
  for(const k in META.life){
    if(k === 'chainMax' || k === 'mountMax') META.life[k] = Math.max(META.life[k]||0, s0[k]||0);
    else META.life[k] = (META.life[k]||0) + (s0[k]||0);
  }
  saveMeta();
  closeModal();
  hardWipeSave();
  newGame();
  addLog('════ 轮 回 ════','epic');
  addLog('一世修行尽付东流，唯有那点不肯散去的执念留在了神魂里。你自凡俗中再一次睁开眼。','epic');
  if(g) addLog('结得轮回点 '+g+'，可用以点化传承。','item');
  renderAll();
  toast('轮回第 '+META.rebirths+' 世 · 轮回点 +'+g);
}

function buyHeritage(k){
  const h = HERITAGE.find(x=>x.k===k);

  renderAll();
  openHeritage();
}

const THEME_KEY = 'xiuxian_theme_v1';
function systemDark(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
  catch(e){ return false; }
}
function savedTheme(){
  let t = null;
  try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
  return (t === 'light' || t === 'dark') ? t : null;
}
function applyTheme(){
  const t = savedTheme() || (systemDark() ? 'dark' : 'light');
  try{
    if(document.documentElement) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
  const b = $('themeBtn');
  if(b){
    b.textContent = (t === 'dark') ? '☀' : '☾';
    b.title = (t === 'dark') ? '切到宣纸（日间）' : '切到玄墨（夜间）';
  }
  return t;
}
function toggleTheme(){
  const next = (document.documentElement && document.documentElement.getAttribute('data-theme') === 'dark')
    ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme();
  const b = $('themeBtn');
  if(b) b.title = (next === 'dark') ? '切到宣纸（日间）' : '切到玄墨（夜间）';
}
/* 未手动选过主题时，跟随系统变化 */
function watchSystemTheme(){
  try{
    if(!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const on = () => { if(!savedTheme()) applyTheme(); };
    if(mq.addEventListener) mq.addEventListener('change', on);
    else if(mq.addListener) mq.addListener(on);
  }catch(e){}
}

  let b = '';
  (buttons||[]).forEach((x,i) => {
    b += '<button class="mbtn'+(x.primary?' primary':'')+'" data-i="'+i+'">'+x.label+'</button>';
  });
  root.innerHTML = '<div class="mask"><div class="modal'+(cls ? ' '+cls : '')+'">'
    + '<h2 class="serif">'+title+'</h2>'
    + '<div class="txt">'+html+'</div>'
    + (b ? '<div class="btns">'+b+'</div>' : '')
    + '</div></div>';
  (buttons||[]).forEach((x,i) => {
    const el = root.querySelector('.mbtn[data-i="'+i+'"]');
    if(el) el.onclick = () => { if(x.fn) x.fn(); };
  });
}
