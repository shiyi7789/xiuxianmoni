name: CI

# 每次推送与 PR 都跑三件事，守住「源码 = 成品」的关键不变量：
#   1. 源码能构建出成品（scripts/build.mjs）
#   2. 构建产物与提交的 xiuxian.html 完全一致（改了 src/ 却忘了跑构建，这里会直接失败）
#   3. 有人改了 xiuxian.html 却忘了跑 release.mjs（站点自检会失败）
# main 上额外跑一个 online 作业：等平台重新部署完，抓线上真身与本地 site/ 逐字节比对
#   （本地开发机可能连不上站点，这道校验放在 CI 跑最稳）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 构建 + 游戏回归 + 站点自检
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建（src/ → xiuxian.html）
        run: node scripts/build.mjs

      - name: 校验构建产物与提交版一致
        run: |
          if ! git diff --quiet -- xiuxian.html; then
            echo "::error::src/ 与提交的 xiuxian.html 不一致 —— 请在本地跑 node scripts/build.mjs 后一起提交"
            git diff --stat -- xiuxian.html
            exit 1
          fi

      - name: 游戏逻辑回归测试
        run: node regression-test.js xiuxian.html 回归测试结果.txt

      - name: 站点自检（HTTP / SEO / a11y / 性能 / 链接 / 版式 / 部署配置）
        run: node scripts/verify-site.mjs

      # ---- 星际裂隙（games/thunder-rogue/）自带的无头自检 ----
      # test/ 已被 release.mjs 的 ROGUE_SKIP 排除，不会进 site/，只用于守源码
      - name: 星际裂隙 · 无头冒烟（30k 帧）
        run: node test/smoke.js
        working-directory: games/thunder-rogue

      - name: 星际裂隙 · 元素系统测试
        run: node test/elements.js
        working-directory: games/thunder-rogue

      - name: 星际裂隙 · 音频层测试
        run: node test/audio.js
        working-directory: games/thunder-rogue

      # 渲染回归：常规自检管"能不能跑、数值对不对"，这条管"跑得顺不顺"
      - name: 星际裂隙 · 渲染性能回归（overdraw 闸门）
        run: node test/perf.js --assert
        working-directory: games/thunder-rogue

      - name: 失败时保留测试输出
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            回归测试结果.txt
            _site_check.txt
            _build_report.txt
          if-no-files-found: ignore

  online:
    name: 线上核验（部署后字节级自检）
    # 只在 main 上跑：PR 没有对应的线上产物可验
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 平台重新部署约 10~60 秒，先等线上版本号追平再核验，最多等 8 分钟
      - name: 线上核验（与本地 site/ 逐字节比对）
        run: node scripts/verify-online.mjs --wait=480000

      - name: 失败时保留核验报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: online-check
          path: _online_check.txt
          if-no-files-found: ignore
