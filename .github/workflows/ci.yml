name: CI

# 每次推送与 PR 都跑三件事，守住「源码 = 成品」的关键不变量：
#   1. 源码能构建出成品（scripts/build.mjs）
#   2. 构建产物与提交的 xiuxian.html 完全一致（改了 src/ 却忘了跑构建，这里会直接失败）
#   3. 有人改了 xiuxian.html 却忘了跑 release.mjs（站点自检会失败）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 构建 + 游戏回归 + 站点自检
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建（src/ → xiuxian.html）
        run: node scripts/build.mjs

      - name: 校验构建产物与提交版一致
        run: |
          if ! git diff --quiet -- xiuxian.html; then
            echo "::error::src/ 与提交的 xiuxian.html 不一致 —— 请在本地跑 node scripts/build.mjs 后一起提交"
            git diff --stat -- xiuxian.html
            exit 1
          fi

      - name: 游戏逻辑回归测试（126 项断言）
        run: node regression-test.js xiuxian.html 回归测试结果.txt

      - name: 站点自检（74 项）
        run: node scripts/verify-site.mjs

      - name: 失败时保留测试输出
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            回归测试结果.txt
            _site_check.txt
            _build_report.txt
          if-no-files-found: ignore
