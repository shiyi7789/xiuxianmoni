</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 顶栏：品牌 · 统计带 · 操作簇 ===== -->
  <div class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">仙</span>
      <span class="btxt">
        <h1 class="serif">修 仙 模 拟 器</h1>
        <span>L I T E R A R Y &nbsp; C U L T I V A T I O N</span>
      </span>
    </div>
    <div class="top-stats">
      <div class="ts realm"><i>境 界</i><b id="topRealm">炼气一层</b></div>
      <div class="ts"><i>修 行 日</i><b id="topDay">第 1 日</b></div>
      <div class="ts"><i>灵 石</i><b id="topStones">0</b></div>
      <div class="ts"><i>战 力</i><b id="topPower">0</b></div>
      <div class="ts luck" id="luckTs"><i>气 运</i><b id="topLuck">0</b></div>
      <div class="ts" id="metaTs" style="display:none"><i>轮 回 印 记</i><b id="topMeta">0</b></div>
    </div>
    <div class="top-acts">
      <button class="btn btn-sm act-d" onclick="showHelp()">道 法</button>
      <button class="btn btn-sm act-d" onclick="openAchievements()" id="achBtn">成 就</button>
      <button class="btn btn-sm act-d" onclick="openGongfa()" id="gfBtn">功 法</button>
      <span class="gap1 act-d" aria-hidden="true"></span>
      <button class="btn btn-sm act-d" onclick="openSavePanel()">存 档</button>
      <button class="btn btn-sm act-d" onclick="openHeritage()">传 承</button>
      <button class="btn btn-sm act-d" onclick="openRebirth()">轮 回</button>
      <button class="btn btn-sm btn-icon act-d" onclick="toggleTheme()" id="themeBtn" title="明暗切换" aria-label="明暗切换">☾</button>
      <button class="btn btn-sm btn-icon only-m" onclick="toggleSheet()" id="menuBtn" aria-label="状态与功能">≡</button>
    </div>
  </div>

  <div class="main">
    <!-- ===== 左栏（移动端为底部抽屉） ===== -->
    <div class="left" id="leftPane">
      <div class="sheetbar only-m">
        <span class="grip"></span>
        <span class="stitle serif">道 体 · 囊 中 之 物</span>
        <button class="sclose" onclick="closeSheet()" aria-label="收起">✕</button>
      </div>

      <div class="panel util-panel">
        <div class="ph">功 能</div>
        <div class="pb" id="utilBox"></div>
      </div>

      <!-- 道体：左栏的头等面板 -->
      <div class="panel hero">
        <div class="pb">
          <div class="hero-hd">
            <span class="realm serif" id="heroRealm">炼气一层</span>
            <span class="sub" id="heroSub">第 1 日 · 战力 0</span>
          </div>
          <div class="bar">
            <div class="lab"><span>修 为</span><em id="expTxt">0 / 140</em></div>
            <div class="track"><div class="fill f-exp" id="expBar" style="width:0%"></div></div>
          </div>
          <div class="bar">
            <div class="lab"><span>气 血</span><em id="hpTxt">0 / 0</em></div>
            <div class="track"><div class="fill f-hp" id="hpBar" style="width:0%"></div></div>
          </div>
          <div class="bar">
            <div class="lab"><span>灵 力</span><em id="mpTxt">0 / 0</em></div>
            <div class="track"><div class="fill f-mp" id="mpBar" style="width:0%"></div></div>
          </div>
          <div class="grid2">
            <div><span>攻 击</span><b id="sAtk">0</b></div>
            <div><span>防 御</span><b id="sDef">0</b></div>
            <div><span>暴 击</span><b id="sCrit">0%</b></div>
            <div><span>修 速</span><b id="sCult">+0%</b></div>
            <div><span>遁 速</span><b id="sSpeed">+0%</b></div>
            <div><span>气 运</span><b id="sLuck">0</b></div>
            <div><span>斩 妖</span><b id="sKill">0</b></div>
            <div><span>殒 身</span><b id="sDeath">0</b></div>
          </div>
        </div>
      </div>

      <div class="lgrp"><span class="lgrp-t">身 外 之 物</span></div>

      <div class="panel">
        <div class="ph">法 器 <span class="ph-tag" id="autoTag" onclick="toggleAutoEquip()"></span></div>
        <div class="pb" id="equipBox"></div>
      </div>

      <div class="panel">
        <div class="ph">坐 骑 <span class="ph-tag" id="mountTag"></span></div>
        <div class="pb" id="mountBox"></div>
      </div>

      <div class="panel">
        <div class="ph">功 法 <span class="ph-tag" id="gfTag"></span></div>
        <div class="pb" id="gfBox"></div>
      </div>

      <div class="panel">
        <div class="ph">丹 药</div>
        <div class="pb btnrow" id="pillBox" style="margin-top:0"></div>
      </div>

      <div class="panel">
        <div class="ph">材 料 <span class="ph-tag" id="matTag"></span></div>
        <div class="pb" id="matBox"></div>
      </div>

      <div class="panel">
        <div class="ph">洞 府 <span class="ph-tag" id="caveTag"></span></div>
        <div class="pb" id="caveBox"></div>
      </div>

      <div class="panel">
        <div class="ph">储 物 袋 <span class="ph-tag" id="bagCount"></span></div>
        <div class="pb" id="bagBox" style="padding:6px"></div>
      </div>

      <div class="lgrp"><span class="lgrp-t">收 录</span></div>

      <div class="panel">
        <div class="ph">图 鉴 · 称 号</div>
        <div class="pb btnrow" style="margin-top:0">
          <button class="btn btn-sm" onclick="openCodex()">
            图 鉴 <span class="muted-sm" id="cdTag">0/0</span>
          </button>
          <button class="btn btn-sm" onclick="openTitles()">
            称 号 <span class="muted-sm" id="ttTag">0/0</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== 右栏 ===== -->
    <div class="right">
      <div class="tabs" id="tabs"></div>
      <div class="panel actwrap" id="actPanel"></div>
      <div class="panel logpanel">
        <div class="ph">天 机 录 <span class="live-dot" aria-hidden="true"></span></div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>
</div>
<div id="veil" onclick="closeSheet()"></div>
<input type="file" id="impFile" accept=".txt,.json,text/plain" style="display:none" onchange="onImportFile(this)">
<!-- 移动端浮动反馈条：底部导航上方常驻，实时显示最新一条关键日志（桌面隐藏） -->
<div id="fbStrip" class="fb-strip only-m" onclick="fbStripClick()">
  <span class="fb-strip-txt">—</span>
  <span class="fb-strip-hint">天 机 录</span>
</div>
<div id="modalRoot"></div>

<script>
